apiVersion: v2
name: infrared-core
description: Infrared's core chart, an operator/CRD-driven gitops control plane for agentic change management. Install the umbrella chart infrared, which wraps it and pins every image (ADR 0038).
type: application
version: 0.1.0-alpha.265
appVersion: v0.1.0-alpha.235
kubeVersion: ">=1.30.0-0"
annotations:
  # The gitops template this chart was released with: values.yaml's
  # gitops.templateVersion, which scripts/verify.sh holds equal. Unlike that
  # value, which the template's own components/infrared.yaml sets to the repo's
  # pin, no values file overrides it, so the API renders it as
  # INFRARED_GITOPS_TEMPLATE_RELEASE and moves the install's gitops repo to it
  # while the rollout flag templateFollowsChart is on (workspace TODO 687).
  infrared.darkshift.io/gitops-template: v0.1.21
home: https://github.com/darkshiftio/infrared-chart
sources:
  - https://github.com/darkshiftio/infrared-chart
  - https://github.com/darkshiftio/infrared-operator
keywords:
  - gitops
  - argocd
  - operator
maintainers:
  - name: darkshift
    url: https://github.com/darkshiftio
dependencies:
  # Gitea, the forge an install may run for its orgs' repos: off unless
  # gitea.enabled. hack/deps.sh (make deps) vendors it at Chart.lock's version and
  # checks the archive's sha256; values.yaml presets it for one pod.
  - name: gitea
    version: 12.7.0
    repository: oci://docker.gitea.com/charts
    condition: gitea.enabled
