apiVersion: v2
name: infrared
description: Infrared, an operator/CRD-driven gitops control plane for agentic change management.
type: application
version: 0.1.0-alpha.110
appVersion: v0.1.0-alpha.110
kubeVersion: ">=1.30.0-0"
home: https://github.com/darkshiftio/infrared-chart
sources:
  - https://github.com/darkshiftio/infrared-chart
  - https://github.com/darkshiftio/infrared-operator
keywords:
  - gitops
  - argocd
  - operator
maintainers:
  - name: darkshift
    url: https://github.com/darkshiftio
dependencies:
  # Gitea, the forge an install may run for its orgs' repos: off unless
  # gitea.enabled. hack/deps.sh (make deps) vendors it at Chart.lock's version and
  # checks the archive's sha256; values.yaml presets it for one pod.
  - name: gitea
    version: 12.7.0
    repository: oci://docker.gitea.com/charts
    condition: gitea.enabled
