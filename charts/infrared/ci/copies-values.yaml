# CI: the platform's copies and Zot's retention, every field set, layered on an
# install's values or, after adoption, on what the gitops repo's `infrared`
# Application carries, which is these same values. The recipient is age's own
# example public key.
copies:
  recipients:
    - age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p
  postgres:
    schedule: "0 30 2 * * *"
    retention: 14d
  mirror:
    schedule: "47 * * * *"
    retention: 10d
  objects:
    schedule: "35 * * * *"
    retention: 9d
  gitea:
    schedule: "40 * * * *"
    retention: 8d
registry:
  retention:
    untaggedAfter: 48h
    keepTags: ["^v[0-9]", "^release-"]
    keepNewest: 20
    gcInterval: 2h
    gcDelay: 30m
