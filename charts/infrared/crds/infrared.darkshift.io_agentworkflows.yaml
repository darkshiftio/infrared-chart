---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentworkflows.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: AgentWorkflow
    listKind: AgentWorkflowList
    plural: agentworkflows
    shortNames:
    - aw
    singular: agentworkflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentWorkflow orders AgentRoles and gates into a repeatable workflow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentWorkflowSpec is the ordered steps a Change (or a scheduled
              job) moves through.
            properties:
              deadLetter:
                description: DeadLetterPolicy routes work an agent can't finish to
                  a human.
                properties:
                  notify:
                    description: Notify lists channels, e.g. slack:#checkout-changes.
                    items:
                      type: string
                    type: array
                  to:
                    description: To is the default human reviewer, a team or user
                      handle.
                    type: string
                type: object
              description:
                type: string
              displayName:
                minLength: 1
                type: string
              enabled:
                default: true
                type: boolean
              maxConcurrency:
                default: 3
                format: int32
                minimum: 1
                type: integer
              origin:
                description: AgentOrigin records where an AgentRole's definition came
                  from.
                properties:
                  catalog:
                    description: Catalog version the role was seeded from.
                    type: string
                  tailored:
                    description: Tailored is True once repo analysis rewrote the role
                      for this org.
                    type: boolean
                  tailoredFrom:
                    items:
                      type: string
                    type: array
                type: object
              steps:
                items:
                  description: |-
                    WorkflowStep is one step of an AgentWorkflow. A step starts when the steps
                    it needs have finished (by default the previous step), or with the workflow
                    when it is independent. It is Skipped when its when condition is false or its
                    AgentRole is disabled.
                  properties:
                    agentRole:
                      description: AgentRole to run, for type agentRole.
                      type: string
                    approvers:
                      description: |-
                        Approvers lists the team or user handles who may approve a human step,
                        e.g. @acme/reviewers. Human steps only. Empty means the dead-letter
                        reviewer.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    deliver:
                      description: |-
                        Deliver is where a report step's output goes: issue (an issue on the
                        Product's backlog, the default) or slack (a draft to the org's Slack
                        channel, nothing opened on GitHub).
                      enum:
                      - issue
                      - slack
                      type: string
                    description:
                      type: string
                    independent:
                      description: |-
                        Independent starts the step as soon as the workflow starts, with no
                        dependency on any other step, so independent steps run in parallel.
                        It can't be combined with needs.
                      type: boolean
                    maxAttempts:
                      default: 1
                      format: int32
                      minimum: 1
                      type: integer
                    minApprovals:
                      description: |-
                        MinApprovals is how many approvals from approvers a human step needs.
                        Human steps only. Omitted means 1.
                      format: int32
                      minimum: 1
                      type: integer
                    mode:
                      description: |-
                        Mode says what an agentRole step works on: build (implement the Change
                        and open its pull request), review (fix or judge the Change branch) or
                        issue (rewrite the issue and move it on the board; no code changes) or
                        resolve (re-apply the Change on the base branch and merge it in, for a
                        conflicted pull request). Empty means build for the first agentRole step
                        and review after it.
                        report is for runs without a Change (scheduled audits, newsletters):
                        read the repo and report, opening an issue for findings.
                      enum:
                      - build
                      - review
                      - issue
                      - resolve
                      - report
                      type: string
                    name:
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    needs:
                      description: |-
                        Needs lists steps that must finish first. Empty means the previous step,
                        unless independent is true. A Skipped step counts as finished.
                      items:
                        type: string
                      type: array
                    onFailure:
                      default: deadLetter
                      enum:
                      - deadLetter
                      - fail
                      - continue
                      type: string
                    required:
                      description: Required steps can't be disabled per release.
                      type: boolean
                    timeout:
                      description: |-
                        Timeout bounds how long the step may take before onFailure applies, e.g.
                        30m. For a human step it is how long approval may wait before the step
                        escalates to the dead-letter reviewer. Omitted means no timeout.
                      type: string
                    type:
                      description: 'Type of step: an AgentRole, a human gate, an automatic
                        action, a CI gate, or a promotion.'
                      enum:
                      - agentRole
                      - human
                      - auto
                      - ci
                      - promote
                      type: string
                    when:
                      description: |-
                        When is a condition that must hold for the step to run; otherwise the
                        step is Skipped. Clauses are joined with && and each may start with !.
                        A clause is one of: change.author in [human, agent] (who opened the
                        Change; runs started from an issue count as agent); agentRole.enabled
                        (the step's AgentRole is enabled; agentRole steps only); label:<name>
                        (the issue or pull request carries the label). Empty means always.
                        Whatever when says, an agentRole step whose AgentRole is disabled is
                        Skipped.
                      maxLength: 512
                      type: string
                    zone:
                      description: Zone to promote to, for type promote.
                      type: string
                  required:
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              triggers:
                items:
                  description: AgentTrigger says when an AgentRole or AgentWorkflow
                    runs.
                  properties:
                    branches:
                      description: |-
                        Branches narrows the trigger to Changes whose base branch matches one of
                        these globs, e.g. main or release/*. Empty matches any branch.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    description:
                      description: Description of the trigger in plain words, shown
                        in the UI.
                      type: string
                    event:
                      description: Event names the event, for type event (e.g. release.cut,
                        issue.opened, conflict.detected).
                      type: string
                    labels:
                      description: |-
                        Labels narrows the trigger to issues or pull requests that carry at least
                        one of these labels, e.g. needs-hydration. Empty matches any labels.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    paths:
                      description: |-
                        Paths narrows the trigger to Changes that touch at least one file matching
                        one of these globs, relative to the repo root, e.g. docs/** or *.go.
                        ** matches any number of directories. Empty matches any path.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    schedule:
                      description: Schedule is a cron expression, for type cron.
                      type: string
                    type:
                      enum:
                      - adhoc
                      - onChange
                      - cron
                      - event
                      type: string
                  required:
                  - type
                  type: object
                minItems: 1
                type: array
            required:
            - displayName
            - enabled
            - steps
            - triggers
            type: object
          status:
            description: AgentWorkflowStatus is the observed state of an AgentWorkflow.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScheduledAt:
                description: LastScheduledAt is when the scheduler last started runs
                  from a cron trigger.
                format: date-time
                type: string
              nextScheduledAt:
                description: NextScheduledAt is when it will next, while the org's
                  scheduling is on.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              schedule:
                description: Schedule says in plain words whether and when the workflow
                  runs on its own.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
