---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentworkflows.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: AgentWorkflow
    listKind: AgentWorkflowList
    plural: agentworkflows
    shortNames:
    - aw
    singular: agentworkflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentWorkflow orders AgentRoles and gates into a repeatable workflow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentWorkflowSpec is the ordered steps a Change (or a scheduled
              job) moves through.
            properties:
              deadLetter:
                description: DeadLetterPolicy routes work an agent can't finish to
                  a human.
                properties:
                  notify:
                    description: Notify lists channels, e.g. slack:#checkout-changes.
                    items:
                      type: string
                    type: array
                  to:
                    description: To is the default human reviewer, a team or user
                      handle.
                    type: string
                type: object
              description:
                type: string
              displayName:
                minLength: 1
                type: string
              enabled:
                default: true
                type: boolean
              maxConcurrency:
                default: 3
                format: int32
                minimum: 1
                type: integer
              origin:
                description: AgentOrigin records where an AgentRole's definition came
                  from.
                properties:
                  catalog:
                    description: Catalog version the role was seeded from.
                    type: string
                  tailored:
                    description: Tailored is True once repo analysis rewrote the role
                      for this org.
                    type: boolean
                  tailoredFrom:
                    items:
                      type: string
                    type: array
                type: object
              steps:
                items:
                  description: WorkflowStep is one step of an AgentWorkflow.
                  properties:
                    agentRole:
                      description: AgentRole to run, for type agentRole.
                      type: string
                    description:
                      type: string
                    maxAttempts:
                      default: 1
                      format: int32
                      minimum: 1
                      type: integer
                    name:
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    needs:
                      description: Needs lists steps that must finish first. Empty
                        means the previous step.
                      items:
                        type: string
                      type: array
                    onFailure:
                      default: deadLetter
                      enum:
                      - deadLetter
                      - fail
                      - continue
                      type: string
                    required:
                      description: Required steps can't be disabled per release.
                      type: boolean
                    type:
                      description: 'Type of step: an AgentRole, a human gate, an automatic
                        action, a CI gate, or a promotion.'
                      enum:
                      - agentRole
                      - human
                      - auto
                      - ci
                      - promote
                      type: string
                    zone:
