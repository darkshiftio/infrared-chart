---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clusters.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    shortNames:
    - ircluster
    singular: cluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.flavor
      name: Flavor
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.kubernetesVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster is a management or workload cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec describes a cluster Infrared knows about.
            properties:
              connection:
                description: Connection says how Infrared and Argo CD reach a workload
                  cluster.
                properties:
                  inCluster:
                    description: InCluster places the workload cluster's zones on
                      the management cluster.
                    type: boolean
                  kubeconfigSecretRef:
                    description: |-
                      KubeconfigSecretRef holds a kubeconfig for the cluster, in namespace infrared.
                      Its current context is used; token and client-certificate users are supported.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
              flavor:
                description: ClusterFlavor selects distribution-specific components
                  in templates.
                enum:
                - k3s
                - eks
                type: string
              provider:
                enum:
                - aws
                - gcp
                - linode
                - local
                type: string
              provision:
                description: Provision builds the cluster from its template with an
                  OpenTofu Job.
                properties:
                  action:
                    default: plan
                    description: |-
                      Action is plan (show what would be built, the default) or apply (build it).
                      Apply creates billable cloud resources.
                    enum:
                    - plan
                    - apply
                    type: string
                  cloudAccount:
                    description: |-
                      CloudAccount names a CloudAccount of the platform org (in its namespace,
                      ir-org-<platform org>) that the Job acts through (ADR 0033): before each
                      run Infrared mints the account's short-lived credentials as
                      cluster-<name>-credentials, AWS session keys for an aws account and a
                      Google access token for a gcp one, and deletes them when the Job ends.
                      The account must be Verified and match spec.provider. Empty keeps the
                      hand-made Secret cluster-<name>-credentials.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef is ignored: the Job's cloud credentials are always
                      the keys of Secret cluster-<name>-credentials in namespace infrared (see
                      ClusterCredentialsSecret), so each cluster has its own.

                      Deprecated: kept so existing objects stay valid.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  image:
                    description: Image is the OpenTofu image; empty means ghcr.io/opentofu/opentofu:1.10.
                    type: string
                  source:
                    description: |-
                      Source overrides the module source; empty means
                      git::https://github.com/darkshiftio/infrared-iac-modules//<template.module>?ref=<template.version>.
                    type: string
                  variables:
                    additionalProperties:
                      type: string
                    description: Variables are the module's inputs.
                    type: object
                type: object
              region:
                type: string
              server:
                description: Server is the API server URL Argo CD uses. Empty means
                  in-cluster.
                type: string
              template:
                description: ClusterTemplateRef pins the cluster template (a tagged
                  iac module) that built the cluster.
                properties:
                  module:
                    description: Module path within infrared-iac-modules, e.g. aws/k3s-node.
                    type: string
                  version:
                    type: string
                required:
                - module
                type: object
              type:
                description: ClusterType is the cluster's role.
                enum:
                - management
                - workload
                type: string
            required:
            - type
            type: object
          status:
            description: ClusterStatus is the observed state of a cluster.
            properties:
              argoSecret:
                description: ArgoSecret is the Argo CD cluster Secret Infrared wrote,
                  if any.
                type: string
              argoServer:
                description: ArgoServer is the server URL Argo CD Applications use
                  for this cluster.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              detected:
                description: Detected is True for the cluster Infrared found itself
                  running on.
                type: boolean
              gitopsPath:
                description: GitopsPath is the directory in the gitops repo whose
                  Applications land on this cluster.
                type: string
              kubernetesVersion:
                type: string
              nodes:
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              provision:
                description: Provision reports the last OpenTofu Job.
                properties:
                  action:
                    description: Action the Job ran.
                    type: string
                  generation:
                    description: Generation is the Cluster generation the Job ran
                      for.
                    format: int64
                    type: integer
                  job:
                    description: Job is the Job's name in namespace infrared.
                    type: string
                  message:
                    type: string
                  phase:
                    description: Phase is Waiting (for the credentials Secret), Running,
                      Succeeded or Failed.
                    type: string
                required:
                - action
                - generation
                - job
                - phase
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
