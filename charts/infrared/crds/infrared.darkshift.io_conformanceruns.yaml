---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: conformanceruns.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: ConformanceRun
    listKind: ConformanceRunList
    plural: conformanceruns
    shortNames:
    - confrun
    singular: conformancerun
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.template.name
      name: Template
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.costUSD
      name: Cost
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ConformanceRun is one run of one cluster template (ADR 0047).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConformanceRunSpec is one run of one template.
            properties:
              install:
                description: |-
                  Install is the install under test, as the suite named it then: an
                  install run's (ADR 0100). Empty for a template run; the operator copies
                  the suite's at the start of a run made without it.
                properties:
                  backup:
                    description: |-
                      Backup is the bucket a run's install backs up to, under the install's
                      name.
                    properties:
                      bucket:
                        description: |-
                          Bucket is the Google Cloud Storage bucket of the runs' backups, which
                          forgets what it holds on its own after a few days.
                        minLength: 1
                        type: string
                      impersonate:
                        description: |-
                          Impersonate is the Google service account the run reads and writes
                          the bucket as.
                        type: string
                      region:
                        description: Region is the bucket's region.
                        type: string
                    required:
                    - bucket
                    type: object
                  chart:
                    description: |-
                      Chart is the umbrella chart ir install installs, an OCI reference such
                      as oci://us-central1-docker.pkg.dev/darkshift-preprod/infrared/charts/infrared.
                    minLength: 1
                    type: string
                  content:
                    description: Content is what a run adds to its install before
                      the backup.
                    properties:
                      historyFactor:
                        description: |-
                          HistoryFactor is the history a run seeds, as a multiple of the objects
                          and bytes of the newest point of the install the operator runs, such as
                          "1.25"; "0" seeds none.
                        pattern: ^[0-9]{1,3}(\.[0-9]{1,3})?$
                        type: string
                      storesGiB:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          StoresGiB is the ballast a run writes into the stores: a number of GiB,
                          or home for the size of the mirror of the install the operator runs.
                        x-kubernetes-int-or-string: true
                    type: object
                  domain:
                    description: |-
                      Domain is where a run's install answers, https://<install>.<domain>: a
                      name never published, no record and no certificate from outside.
                    maxLength: 200
                    pattern: ^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  loss:
                    description: |-
                      Loss is how the first cluster is lost: sequential, the only way, the
                      second cluster built once the first's destroy is done.
                    enum:
                    - sequential
                    type: string
                  subchart:
                    description: |-
                      Subchart is the umbrella's subchart the install's values are for, such
                      as infrared-core; empty: the chart's own.
                    type: string
                  templateVersion:
                    description: |-
                      TemplateVersion is the gitops template version the install renders:
                      empty, the one this install's own gitops repo pins, resolved at each
                      run's start and recorded in its status; or a tag, as while this install
                      is older than the first template with the private edge.
                    type: string
                  valuesFrom:
                    description: |-
                      ValuesFrom is the ConfigMap that holds the install's two files,
                      infrared-values.yaml and infrared.yaml, with the placeholders the
                      operator fills for each run.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  version:
                    default: self
                    description: |-
                      Version is the chart's version: self, the version of the install the
                      operator runs, resolved at each run's start and recorded in its status,
                      or a version.
                    type: string
                required:
                - backup
                - chart
                - domain
                - valuesFrom
                type: object
              suite:
                description: Suite is the ConformanceSuite that started it.
                type: string
              template:
                description: Template is the template under test, as the suite named
                  it then.
                properties:
                  cloudAccount:
                    description: |-
                      CloudAccount is the platform org's CloudAccount the run builds
                      through.
                    type: string
                  flavor:
                    description: 'Flavor is the Cluster''s flavor: eks on EKS, empty
                      on GKE.'
                    enum:
                    - k3s
                    - eks
                    type: string
                  hourlyUSD:
                    description: |-
                      HourlyUSD is what a run's cluster costs an hour while it stands, in US
                      dollars, e.g. "0.17": runs are priced from it, and the cap with them.
                    type: string
                  module:
                    description: 'Module is the template under test: gcp/gke-cluster
                      or aws/eks-cluster.'
                    type: string
                  name:
                    description: |-
                      Name is the template's short name in the suite, e.g. gke or eks: a DNS
                      label, used in its runs' and Clusters' names.
                    pattern: ^[a-z0-9]([-a-z0-9]{0,10}[a-z0-9])?$
                    type: string
                  provider:
                    description: Provider is gcp or aws.
                    enum:
                    - gcp
                    - aws
                    type: string
                  region:
                    description: Region is the Cluster's region.
                    type: string
                  suspend:
                    description: Suspend stops scheduling this template's runs.
                    type: boolean
                  variables:
                    additionalProperties:
                      type: string
                    description: |-
                      Variables are the template's inputs. The run adds name, its labels and
                      the API's allowed addresses (the management cluster's nodes).
                    type: object
                  version:
                    description: Version is the infrared-iac-modules tag under test,
                      e.g. v0.15.0.
                    type: string
                required:
                - cloudAccount
                - hourlyUSD
                - module
                - name
                - provider
                - version
                type: object
              trigger:
                description: Trigger is schedule, trial or manual.
                type: string
            required:
            - suite
            - template
            type: object
          status:
            description: ConformanceRunStatus is a run's record.
            properties:
              address:
                description: Address is the workload's load balancer address.
                type: string
              baseline:
                description: |-
                  Baseline is what the operator read of the first cluster after the
                  backup, to compare the second with.
                properties:
                  counts:
                    additionalProperties:
                      format: int64
                      type: integer
                    description: |-
                      Counts are the objects of Infrared's kinds that the install makes only
                      at a person's word, by resource as a backup counts them.
                    type: object
                  managementCluster:
                    type: string
                  passwordSetAt:
                    description: PasswordSetAt is the root user's BreakGlass passwordSetAt.
                    format: date-time
                    type: string
                  platformOrg:
                    type: string
                  readAt:
                    format: date-time
                    type: string
                  signInURL:
                    type: string
                type: object
              checks:
                description: |-
                  Checks are an install run's checks that the same install came back,
                  the drill's and the operator's.
                items:
                  description: ConformanceCheck is one check that the same install
                    came back.
                  properties:
                    judge:
                      description: Judge is drill or operator.
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    passed:
                      type: boolean
                  required:
                  - judge
                  - name
                  - passed
                  type: object
                type: array
              cluster:
                description: Cluster is the Cluster the run built.
                type: string
              costUSD:
                description: |-
                  CostUSD is the run's estimate: the hours its cluster stood at the
                  template's hourly rate.
                type: string
              expiresAt:
                description: ExpiresAt is when its cluster expires for the sweeper.
                format: date-time
                type: string
              failedStep:
                description: FailedStep is the first step that failed.
                type: string
              finishedAt:
                format: date-time
                type: string
              leaks:
                description: Leaks are what the cluster's deletion reported it may
                  have left.
                items:
                  type: string
                type: array
              message:
                description: Message says what the run is doing now.
                type: string
              phase:
                description: Phase is Pending, Running, Deleting, Passed or Failed.
                type: string
              point:
                description: Point is the backup an install run restored.
                type: string
              projection:
                description: |-
                  Projection is the maintenance window of the install the operator runs,
                  projected from an install run that reached its end.
                properties:
                  basis:
                    description: 'Basis says what it rests on: the point it is for
                      and its sizes.'
                    type: string
                  plannedSeconds:
                    description: 'PlannedSeconds is a planned rebuild: rows 2, 3 and
                      5 to 10.'
                    format: int64
                    type: integer
                  rows:
                    description: Rows are the phases, each measured, scaled or estimated.
                    items:
                      description: ConformanceProjectionRow is one phase of a projected
                        window.
                      properties:
                        basis:
                          description: Basis is measured, scaled or estimated.
                          enum:
                          - measured
                          - scaled
                          - estimated
                          type: string
                        message:
                          description: Message says what the number rests on.
                          type: string
                        name:
                          description: Name is the phase, such as make-down.
                          type: string
                        row:
                          description: Row is the plan's row number.
                          format: int32
                          type: integer
                        seconds:
                          format: int64
                          type: integer
                      required:
                      - basis
                      - name
                      - row
                      - seconds
                      type: object
                    type: array
                  unplannedSeconds:
                    description: 'UnplannedSeconds is an unplanned loss: rows 3 and
                      5 to 10.'
                    format: int64
                    type: integer
                required:
                - plannedSeconds
                - unplannedSeconds
                type: object
              restoreCluster:
                description: |-
                  RestoreCluster is the second Cluster an install run built, which its
                  install is restored onto.
                type: string
              signature:
                description: 'Signature names the failure: template, step and first
                  error.'
                type: string
              sizes:
                description: Sizes are what an install run moved, and what it was
                  scaled from.
                properties:
                  digests:
                    additionalProperties:
                      type: string
                    description: |-
                      Digests are the digests of the content the drill compared, by what
                      they are of.
                    type: object
                  drill:
                    additionalProperties:
                      format: int64
                      type: integer
                    description: |-
                      Drill are the sizes the drill reported, in bytes by part: the
                      artifact, gitea and postgres of the point it made, the history and
                      stores it seeded, and the artifact of its backup again.
                    type: object
                  home:
                    description: |-
                      Home is the newest point of the install the operator runs, read at the
                      run's start: its content is scaled from it, and its projection is for it.
                    properties:
                      artifactBytes:
                        format: int64
                        type: integer
                      counts:
                        additionalProperties:
                          format: int64
                          type: integer
                        type: object
                      databases:
                        items:
                          type: string
                        type: array
                      giteaBytes:
                        format: int64
                        type: integer
                      mirrorBytes:
                        format: int64
                        type: integer
                      mirrorObjects:
                        format: int64
                        type: integer
                      objectBytes:
                        description: |-
                          ObjectBytes is the backup's objects' JSON before compression, where its
                          manifest gives it.
                        format: int64
                        type: integer
                      objects:
                        description: Objects are the backup's objects in all; Counts
                          by resource.
                        format: int64
                        type: integer
                      point:
                        description: Point is the point's stamp.
                        type: string
                      postgresBytes:
                        format: int64
                        type: integer
                    type: object
                  peakMemoryBytes:
                    additionalProperties:
                      format: int64
                      type: integer
                    description: |-
                      PeakMemoryBytes are the backup's and the restore's containers' peak
                      working set, by container, as the drill read them.
                    type: object
                  run:
                    description: Run is the run's own point, as the drill reported
                      it.
                    properties:
                      artifactBytes:
                        format: int64
                        type: integer
                      counts:
                        additionalProperties:
                          format: int64
                          type: integer
                        type: object
                      databases:
                        items:
                          type: string
                        type: array
                      giteaBytes:
                        format: int64
                        type: integer
                      mirrorBytes:
                        format: int64
                        type: integer
                      mirrorObjects:
                        format: int64
                        type: integer
                      objectBytes:
                        description: |-
                          ObjectBytes is the backup's objects' JSON before compression, where its
                          manifest gives it.
                        format: int64
                        type: integer
                      objects:
                        description: Objects are the backup's objects in all; Counts
                          by resource.
                        format: int64
                        type: integer
                      point:
                        description: Point is the point's stamp.
                        type: string
                      postgresBytes:
                        format: int64
                        type: integer
                    type: object
                type: object
              startedAt:
                format: date-time
                type: string
              steps:
                items:
                  description: ConformanceStep is one step of a run.
                  properties:
                    finishedAt:
                      format: date-time
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                    state:
                      description: State is Pending, Running, Done, Failed or Skipped.
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
              templateVersion:
                description: |-
                  TemplateVersion is the gitops template version an install run's
                  install rendered, resolved at its start.
                type: string
              triage:
                description: Triage is the QA triage run a failure started, if any.
                type: string
              version:
                description: |-
                  Version is the chart version an install run installed: its suite's,
                  self resolved at its start.
                type: string
              window:
                description: Window is each phase of an install run with its start,
                  end and seconds.
                items:
                  description: |-
                    ConformancePhase is one phase of an install run, timed: a step of the run,
                    or a phase inside one, <step>/<name>, such as the waits ir times
                    (Restore/restore-objects) and the steps of the first cluster's deletion
                    (Lose/Destroy).
                  properties:
                    finishedAt:
                      format: date-time
                      type: string
                    name:
                      type: string
                    result:
                      description: |-
                        Result is how it ended: done or failed, or as ir says, reached or
                        timeout.
                      type: string
                    seconds:
                      description: Seconds is how long it took.
                      format: int64
                      type: integer
                    startedAt:
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
