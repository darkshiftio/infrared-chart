---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gitopsrepos.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: GitopsRepo
    listKind: GitopsRepoList
    plural: gitopsrepos
    shortNames:
    - irgitops
    singular: gitopsrepo
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.url
      name: Repo
      type: string
    - jsonPath: .spec.template.version
      name: Template
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'GitopsRepo is an org''s gitops repo: created, hydrated and bootstrapped
          by Infrared.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GitopsRepoSpec describes an org's gitops repo.
            properties:
              bootstrap:
                default: true
                description: Bootstrap applies Argo CD and the root Application after
                  hydration.
                type: boolean
              cluster:
                description: Cluster is the management cluster the repo's registry
                  bootstraps.
                minLength: 1
                type: string
              clusterFlavor:
                default: k3s
                description: ClusterFlavor selects distribution-specific components
                  in templates.
                enum:
                - k3s
                - eks
                type: string
              defaultBranch:
                default: main
                type: string
              name:
                default: gitops
                description: Name of the repo within the provider's owner.
                type: string
              providerRef:
                description: ProviderRef is the GitProvider that owns the repo.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              template:
                description: GitopsTemplate pins the template the repo is hydrated
                  from.
                properties:
                  repo:
                    default: https://github.com/darkshiftio/infrared-gitops-template
                    description: Repo is the template's git URL.
                    type: string
                  version:
                    description: Version is a tag of the template repo.
                    minLength: 1
                    type: string
                required:
                - version
                type: object
              visibility:
                default: private
                enum:
                - private
                - internal
                - public
                type: string
            required:
            - cluster
            - providerRef
            - template
            type: object
          status:
            description: GitopsRepoStatus is the observed state of the gitops repo.
            properties:
              bootstrappedCommit:
                description: |-
                  BootstrappedCommit is the hydration commit whose Argo CD install and
                  registry Application were last applied. Bootstrap runs again only when
                  Commit moves past it.
                type: string
              commit:
                description: Commit is the SHA of the last hydration commit.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hydratedVersion:
                description: HydratedVersion is the template version the repo was
                  hydrated from.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: GitopsRepoPhase is how far the controller has taken the
                  gitops repo.
                enum:
                - Pending
                - Created
                - Hydrated
                - Bootstrapped
                - Synced
                type: string
              url:
                description: URL of the repo on the provider.
                type: string
              waves:
                items:
                  description: WaveStatus groups Applications by sync wave.
                  properties:
                    applications:
                      items:
                        description: ApplicationStatus is one Argo CD Application
                          in the repo's registry.
                        properties:
                          health:
                            description: ArgoHealthStatus is Argo CD's health status,
                              verbatim.
                            enum:
                            - Healthy
                            - Progressing
                            - Degraded
                            - Suspended
                            - Missing
                            - Unknown
                            type: string
                          name:
                            type: string
                          sync:
                            description: ArgoSyncStatus is Argo CD's sync status,
                              verbatim.
                            enum:
                            - Synced
                            - OutOfSync
                            - Unknown
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    wave:
                      format: int32
                      type: integer
                  required:
                  - applications
                  - wave
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
