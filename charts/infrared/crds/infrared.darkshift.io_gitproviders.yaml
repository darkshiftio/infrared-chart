---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gitproviders.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: GitProvider
    listKind: GitProviderList
    plural: gitproviders
    shortNames:
    - irgit
    singular: gitprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.installationVerified
      name: Verified
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GitProvider connects an org to its forge: GitHub through a GitHub App, or
          Gitea through one bot user (GitLab later).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GitProviderSpec connects an org to its git provider.
            properties:
              gitea:
                description: Gitea is required for type gitea.
                properties:
                  secretRef:
                    description: |-
                      SecretRef names the Secret, in the GitProvider's namespace, that holds
                      the user's username, password, token and read-token.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: |-
                      URL is the Gitea server's root, as Infrared and the cluster reach it,
                      e.g. http://gitea-http.infrared.svc.cluster.local:3000.
                    pattern: ^https?://[^\s/?#]+(/[^\s?#]*)?$
                    type: string
                  user:
                    description: User is the Gitea user Infrared acts as in spec.owner,
                      e.g. ir-acme.
                    maxLength: 40
                    minLength: 1
                    type: string
                required:
                - secretRef
                - url
                - user
                type: object
              github:
                description: GitHubAppSpec identifies a GitHub App and its installation
                  on one org.
                properties:
                  apiURL:
                    description: APIURL overrides https://api.github.com for GitHub
                      Enterprise Server.
                    type: string
                  appID:
                    format: int64
                    minimum: 1
                    type: integer
                  installationID:
                    description: InstallationID is set once the App is installed on
                      the owner.
                    format: int64
                    type: integer
                  privateKeySecretRef:
                    description: PrivateKeySecretRef holds the App's PEM private key.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  slug:
                    type: string
                  webhookSecretRef:
                    description: SecretKeyRef selects a key of a Secret in the same
                      namespace as the referrer.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - appID
                - privateKeySecretRef
                type: object
              owner:
                description: |-
                  Owner is the provider org Infrared manages: a GitHub organization login,
                  or a Gitea organization name (at most 40 characters).
                minLength: 1
                type: string
              type:
                description: GitProviderType names a supported git provider integration.
                enum:
                - github-app
                - gitea
                type: string
            required:
            - owner
            - type
            type: object
          status:
            description: GitProviderStatus is the observed state of the connection.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              installationVerified:
                description: |-
                  InstallationVerified is True when the App can mint an installation token,
                  or, for type gitea, when the user's token reaches spec.owner with write
                  access.
                type: boolean
              lastVerifiedTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.github is required for type github-app
          rule: self.spec.type != 'github-app' || has(self.spec.github)
        - message: spec.gitea is required for type gitea
          rule: self.spec.type != 'gitea' || has(self.spec.gitea)
        - message: 'spec.owner names a Gitea organization: at most 40 characters'
          rule: self.spec.type != 'gitea' || size(self.spec.owner) <= 40
    served: true
    storage: true
    subresources:
      status: {}
