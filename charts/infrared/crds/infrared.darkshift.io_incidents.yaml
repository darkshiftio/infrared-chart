---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: incidents.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Incident
    listKind: IncidentList
    plural: incidents
    shortNames:
    - irinc
    singular: incident
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.productRef.name
      name: Product
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.title
      name: Title
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Incident is something wrong in a Product's zone that people are handling:
          opened by an alert or by hand, acknowledged, and resolved, with a timeline.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IncidentSpec describes what went wrong and where.
            properties:
              alert:
                description: IncidentAlert is the alert behind an Incident.
                properties:
                  fingerprint:
                    type: string
                  generatorURL:
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                  name:
                    type: string
                  startsAt:
                    format: date-time
                    type: string
                required:
                - fingerprint
                - name
                type: object
              description:
                type: string
              productRef:
                description: LocalRef names another Infrared resource in the same
                  namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              severity:
                default: warning
                enum:
                - critical
                - warning
                - info
                type: string
              source:
                description: Source is alert (opened by an alert) or manual (opened
                  by a person).
                enum:
                - alert
                - manual
                type: string
              title:
                minLength: 1
                type: string
              zone:
                description: Zone the Incident affects.
                type: string
            required:
            - severity
            - source
            - title
            type: object
          status:
            description: IncidentStatus is where the Incident is and what happened.
            properties:
              acknowledgedAt:
                format: date-time
                type: string
              acknowledgedBy:
                type: string
              investigation:
                description: Investigation is the incident agent's (ADR 0074).
                properties:
                  cause:
                    description: Cause is the likely cause, in one sentence.
                    type: string
                  confidence:
                    description: 'Confidence in the cause: high, medium or low.'
                    type: string
                  costUSD:
                    description: CostUSD is what the run spent, as a decimal string.
                    type: string
                  impact:
                    items:
                      description: IncidentImpact is how the Incident touches one
                        Product, as the agent judged it.
                      properties:
                        effect:
                          description: Effect is affected, at-risk or unaffected.
                          type: string
                        product:
                          type: string
                        why:
                          type: string
                      required:
                      - effect
                      - product
                      - why
                      type: object
                    type: array
                  message:
                    description: Message says why the investigation Failed.
                    type: string
                  phase:
                    description: InvestigationPhase is where an Incident's investigation
                      is.
                    enum:
                    - Investigating
                    - Ready
                    - Failed
                    type: string
                  proposals:
                    items:
                      description: |-
                        IncidentProposal is one thing a person can do about the Incident: start a
                        Change (kind change) or run commands themselves (kind commands). Infrared
                        never runs an operational step itself.
                      properties:
                        change:
                          description: 'Change is set by the API once the proposal''s
                            Change started: the run''s name.'
                          type: string
                        commands:
                          description: Commands are, for kind commands, what a person
                            runs, in order.
                          items:
                            description: IncidentCommand is one command a person may
                              run, and what it does.
                            properties:
                              command:
                                type: string
                              explains:
                                type: string
                            required:
                            - command
                            - explains
                            type: object
                          type: array
                        confidence:
                          description: Confidence is high, medium or low.
                          type: string
                        id:
                          description: ID is a short slug, unique in the list.
                          type: string
                        issueBody:
                          description: IssueBody is Markdown.
                          type: string
                        issueTitle:
                          type: string
                        kind:
                          description: Kind is change or commands.
                          type: string
                        product:
                          description: Product is, for a change, the Product whose
                            first repo gets the issue.
                          type: string
                        risk:
                          description: Risk is low, medium or high.
                          type: string
                        title:
                          type: string
                        why:
                          type: string
                      required:
                      - confidence
                      - id
                      - kind
                      - risk
                      - title
                      - why
                      type: object
                    type: array
                  run:
                    description: Run is the AgentWorkflowRun investigating, or that
                      investigated.
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  summary:
                    description: Summary is plain words for anyone, at most 1200 characters.
                    type: string
                  technical:
                    description: Technical is Markdown for admins, at most 20000 characters.
                    type: string
                  updatedAt:
                    format: date-time
                    type: string
                  verdict:
                    description: 'Verdict is the agent''s: EXPLAINED, PARTIAL or UNEXPLAINED.'
                    type: string
                required:
                - phase
                type: object
              openedAt:
                format: date-time
                type: string
              phase:
                description: IncidentPhase is where an Incident is.
                enum:
                - Open
                - Acknowledged
                - Resolved
                type: string
              resolvedAt:
                format: date-time
                type: string
              resolvedBy:
                type: string
              timeline:
                items:
                  description: IncidentEvent is one entry on an Incident's timeline.
                  properties:
                    at:
                      format: date-time
                      type: string
                    by:
                      type: string
                    kind:
                      description: Kind is opened, firing, alert-resolved, acknowledged,
                        resolved, reopened or note.
                      type: string
                    message:
                      type: string
                  required:
                  - at
                  - kind
                  - message
                  type: object
                type: array
              video:
                description: Video is the Incident's summary video.
                properties:
                  at:
                    description: At is when the state last changed.
                    format: date-time
                    type: string
                  costUSD:
                    description: CostUSD is what the video cost, counted in the org's
                      summary video cap.
                    type: string
                  message:
                    type: string
                  poster:
                    type: string
                  seconds:
                    type: integer
                  state:
                    description: State is making, ready or failed.
                    type: string
                  url:
                    description: URL is the video's API path, e.g. /v1/orgs/{org}/incidents/{name}/video/video.mp4.
                    type: string
                required:
                - state
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
