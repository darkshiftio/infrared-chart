---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: installations.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Installation
    listKind: InstallationList
    plural: installations
    shortNames:
    - irinst
    singular: installation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.platformOrg
      name: Org
      type: string
    - jsonPath: .spec.managementCluster
      name: Cluster
      type: string
    - jsonPath: .status.backup.lastPoint
      name: Last point
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Installation is the singleton that tracks setup of this Infrared
          control plane.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              admin:
                description: |-
                  InstallationAdmin is the first platform admin, the root user, created by
                  the setup wizard. Its password's hash lives in the BreakGlass record named
                  root (infrared-docs-internal ADR 0042).
                properties:
                  email:
                    format: email
                    type: string
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef held the bcrypt hash of the admin password in a
                      Secret. Deprecated (ADR 0042): the hash lives in BreakGlass root. The
                      API copies it from the Secret once, and clears this ref once a person
                      has deleted the Secret.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - email
                type: object
              backup:
                description: |-
                  Backup is where the platform's backups go and how they are made. The
                  operator fills it from INFRARED_BACKUP and INFRARED_COPIES while it is
                  empty, and never overwrites a value someone set.
                properties:
                  destination:
                    description: |-
                      Destination is the object storage outside the cluster the backups and
                      the mirror are written to.
                    properties:
                      bucket:
                        description: Bucket is the bucket's name.
                        maxLength: 63
                        minLength: 3
                        pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                        type: string
                      credentials:
                        description: |-
                          Credentials are how the backups reach the bucket: a key, or the
                          identity of whatever runs.
                        properties:
                          kind:
                            description: |-
                              Kind is the credential's kind: accessKey, an S3 access key and its
                              secret, in the Secret secretRef names (linode, s3); or serviceAccount,
                              the identity of whatever reaches the bucket, granted the bucket's role
                              outside Infrared, with nothing in any Secret (gcs). role (AWS) is
                              reserved.
                            enum:
                            - accessKey
                            - serviceAccount
                            type: string
                          secretRef:
                            description: |-
                              SecretRef names the Secret in Infrared's namespace that holds the
                              access key, as backup-access-key-id and backup-secret-access-key:
                              infrared-platform-tokens, which the chart keeps. Required for an
                              accessKey; none for a serviceAccount.
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - kind
                        type: object
                        x-kubernetes-validations:
                        - message: an accessKey names the Secret that holds it in
                            secretRef
                          rule: self.kind != 'accessKey' || has(self.secretRef)
                      endpoint:
                        description: |-
                          Endpoint is the store's endpoint, https:// and a host, with no path:
                          https://<region>.linodeobjects.com for Linode, and for gcs always
                          https://storage.googleapis.com.
                        maxLength: 270
                        pattern: ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$
                        type: string
                      prefix:
                        description: |-
                          Prefix is where in the bucket this install's backups and mirror go:
                          <prefix>/backups/ and <prefix>/seaweedfs/. Empty means the install's
                          name, the management cluster's.
                        pattern: ^([a-z0-9][a-z0-9._-]{0,62})?$
                        type: string
                      provider:
                        description: |-
                          Provider runs the store: linode, Linode Object Storage, the one offered
                          on day one; s3, any other S3-compatible store; or gcs, Google Cloud
                          Storage, reached natively by the identity of whatever runs, with
                          credentials of kind serviceAccount. aws is reserved for AWS by role.
                        enum:
                        - linode
                        - s3
                        - gcs
                        type: string
                      region:
                        description: |-
                          Region is the region S3 requests are signed for, such as us-lax-4;
                          for gcs, the bucket's location, such as us-central1, which nothing
                          signs for.
                        maxLength: 63
                        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                        type: string
                    required:
                    - bucket
                    - credentials
                    - endpoint
                    - provider
                    - region
                    type: object
                    x-kubernetes-validations:
                    - message: gcs takes credentials of kind serviceAccount at the
                        endpoint https://storage.googleapis.com; linode and s3 take
                        an accessKey
                      rule: 'self.provider == ''gcs'' ? (self.credentials.kind ==
                        ''serviceAccount'' && self.endpoint == ''https://storage.googleapis.com'')
                        : self.credentials.kind == ''accessKey'''
                  mirror:
                    description: Mirror is the stores' buckets' mirror to the destination.
                    properties:
                      schedule:
                        description: |-
                          Schedule is when the mirror runs, five cron fields in UTC. Empty means
                          17 * * * *.
                        maxLength: 128
                        pattern: ^[0-9A-Za-z*/,?-]+( [0-9A-Za-z*/,?-]+){4}$
                        type: string
                    type: object
                  postgres:
                    description: Postgres is the platform's Postgres's own archive.
                    properties:
                      archive:
                        description: |-
                          Archive turns on Barman's WAL archiving and a daily base backup to the
                          destination's <prefix>/postgres/. Off by default: each backup holds a
                          dump of Postgres, and a restore never reads the archive.
                        type: boolean
                    type: object
                  recipients:
                    description: |-
                      Recipients are the age public keys (age1...) each backup is encrypted
                      to; any one of their identities opens it. Without one no backup is
                      made. Only the public half is ever here.
                    items:
                      pattern: ^age1[02-9ac-hj-np-z]{58}$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  retention:
                    description: |-
                      Retention is how long a backup is kept, whole days such as 7d; the
                      newest complete backup is never deleted. Empty means 7d.
                    pattern: ^[1-9][0-9]{0,2}d$
                    type: string
                  schedule:
                    description: |-
                      Schedule is when a backup is made, five cron fields in UTC. Empty
                      means 5 * * * *.
                    maxLength: 128
                    pattern: ^[0-9A-Za-z*/,?-]+( [0-9A-Za-z*/,?-]+){4}$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: postgres.archive is not offered with gcs yet
                  rule: '!(has(self.destination) && self.destination.provider == ''gcs''
                    && has(self.postgres) && self.postgres.archive)'
              edge:
                description: |-
                  Edge is how traffic reaches Infrared and its zones: traefik, through
                  Traefik Ingresses as before, or gateway, through one shared Gateway run
                  by Envoy Gateway. Empty means traefik. The gitops template installs the
                  edge it names. The operator fills it from INFRARED_EDGE while it is
                  empty, and never overwrites a value someone set.
                enum:
                - ""
                - traefik
                - gateway
                type: string
              gitProviderRef:
                description: GitProviderRef is the platform org's git provider.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              gitopsRepoRef:
                description: GitopsRepoRef is the platform org's gitops repo.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              managementCluster:
                description: ManagementCluster is the Cluster Infrared runs on.
                type: string
              models:
                description: |-
                  Models maps model tiers to model IDs and holds the price table cost
                  estimates use.
                properties:
                  includedRuns:
                    description: |-
                      IncludedRuns gives each self-service org agent runs on a key the
                      install holds, up to an allowance, until the org sets its own key
                      (infrared-docs-internal ADR 0059). Absent, or an allowance of 0, is off.
                    properties:
                      perOrgUSD:
                        description: |-
                          PerOrgUSD is each self-service org's allowance of model spend on the
                          install's key, in US dollars as a decimal ("5.00"), once per org. Empty
                          or 0 is off.
                        pattern: ^([0-9]{1,6}(\.[0-9]{1,2})?)?$
                        type: string
                    type: object
                  prices:
                    description: |-
                      Prices replace DefaultModelPrices for cost estimates when set. Spend
                      itself is what the Agent SDK reports for each step.
                    items:
                      description: |-
                        ModelPrice is a model's list price in USD per million tokens, as decimal
                        strings. CacheWriteUSD is the 5-minute cache write.
                      properties:
                        cacheReadUSD:
                          type: string
                        cacheWriteUSD:
                          type: string
                        inputUSD:
                          type: string
                        model:
                          minLength: 1
                          type: string
                        outputUSD:
                          type: string
                      required:
                      - model
                      type: object
                    type: array
                  tiers:
                    description: Tiers maps tiers to model IDs. Unset fields use DefaultModelTiers.
                    properties:
                      balanced:
                        type: string
                      fast:
                        type: string
                      frontier:
                        type: string
                    type: object
                type: object
              observability:
                description: |-
                  Observability is where the install's own numbers go: the telemetry
                  plane it is a platform of (infrared-docs-internal ADR 0044). The gitops
                  template reads it; nothing leaves the cluster while it is unset.
                properties:
                  sessions:
                    description: |-
                      Sessions is the install's default for every org's Claude Code sessions
                      (ADR 0071 D4): whether they are recorded and measured where an org has
                      not decided for itself. A field left unset is on.
                    properties:
                      record:
                        type: boolean
                      telemetry:
                        type: boolean
                    type: object
                  telemetry:
                    description: |-
                      Telemetry is the telemetry plane this install writes its metrics to
                      (ADR 0044): the operator's step series, the API's request series and
                      what else the install measures, pushed by a vmagent the gitops template
                      renders while it is set, every series labelled with the platform name.
                    properties:
                      platform:
                        description: |-
                          Platform is this install's name in the telemetry plane, the platform
                          label on every series it writes: a DNS label, such as <login>-<stack>
                          for a stack on a Mac, or the management cluster's name for a hosted
                          install.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                        type: string
                      url:
                        description: |-
                          URL is the remote-write address the install's metrics are pushed to,
                          such as https://infrared.example.com/api/v1/telemetry/write, under the
                          telemetry token kept in the cluster.
                        maxLength: 2048
                        pattern: ^https?://
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: telemetry takes url and platform together, or neither
                      rule: has(self.url) == has(self.platform)
                type: object
              platformOrg:
                description: PlatformOrg is the Organization that administers this
                  control plane.
                type: string
              previews:
                description: |-
                  Previews give pre-release zones a URL behind Infrared sign-in. The
                  operator fills it from INFRARED_PREVIEWS while it is unset.
                properties:
                  acmeEmail:
                    description: |-
                      ACMEEmail is the address Let's Encrypt writes to about the origin
                      certificates of custom hostnames, e.g. alerts@example.com.
                    type: string
                  cloudflareTokenKey:
                    description: |-
                      CloudflareTokenKey is the key of CloudflareTokenSecret that holds the
                      token; empty is api-token. The chart's infrared-platform-tokens holds it
                      as cloudflare-api-token.
                    type: string
                  cloudflareTokenSecret:
                    description: |-
                      CloudflareTokenSecret names a Secret in Infrared's namespace whose
                      CloudflareTokenKey key may edit DNS for the managed roots.
                    type: string
                  customHostnames:
                    description: |-
                      CustomHostnames serves addresses under an org's external Domains on a
                      Gateway edge behind Cloudflare: each becomes a Cloudflare for SaaS
                      custom hostname on the zone of the managed root that holds IngressHost,
                      whose fallback origin is IngressHost, and its origin certificate comes
                      from Let's Encrypt over HTTP-01 through Cloudflare's proxy. Cloudflare
                      for SaaS must be on for that zone, and the token needs Zone / SSL and
                      Certificates / Edit there.
                    type: boolean
                  domain:
                    description: |-
                      Domain previews live under: zone z is https://<z>.<domain>. A wildcard DNS
                      record for the domain must point at the management cluster's ingress.
                    minLength: 1
                    type: string
                  domainTokenKey:
                    description: |-
                      DomainTokenKey is the key of the Secret infrared-platform-tokens that
                      holds a Cloudflare token for Domain's zone, when Domain is in another
                      Cloudflare zone than SignInURL's host and that token is kept apart (a
                      hosted plane's tenants' domain, infrared-docs-internal ADR 0063). The
                      Gateway edge then takes the certificate and DNS records of *.<Domain>
                      with it, and those of Infrared's own name with cloudflare-api-token.
                      Empty means cloudflare-api-token serves both.
                    maxLength: 253
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  ingressHost:
                    description: |-
                      IngressHost is the name customers point their own domains at with a
                      CNAME, e.g. ingress.apps.example.com; it resolves to the ingress.
                    type: string
                  ingressIP:
                    description: IngressIP is the ingress's public address, for A
                      records on root domains.
                    type: string
                  managedRoots:
                    description: |-
                      ManagedRoots are domains Infrared manages in Cloudflare, under which any
                      org can claim a subdomain (e.g. darkshift.io gives acme.darkshift.io).
                    items:
                      type: string
                    type: array
                  signInPrivate:
                    description: |-
                      SignInPrivate keeps Infrared's own name, SignInURL's host, off a
                      Gateway edge: the gitops template renders no listener, route, tunnel
                      route or certificate name for it, so nothing publishes the name, and
                      the install's own private ingress (a VPN's proxy) serves it
                      (infrared-docs-internal ADR 0090, workspace TODO 745). SignInURL stays
                      the issuer, the preview sign-in's address and the links Infrared
                      writes, and Grafana still signs people in there. external-dns deletes
                      a record of the name it owns. Keep the name outside Domain's wildcard,
                      whose listener would otherwise take a name one label under it. Only a
                      Gateway edge reads it; off, the edge serves the name as before.
                    type: boolean
                  signInURL:
                    description: |-
                      SignInURL is Infrared's public URL, where preview visitors sign in,
                      e.g. https://infrared.example.com.
                    pattern: ^https://
                    type: string
                required:
                - domain
                - signInURL
                type: object
              signIn:
                description: |-
                  SignIn holds the sign-in settings platform admins change in Infrared,
                  in Settings, Sign-in: which Google Workspace domains may sign in with
                  Google, and since when Google sign-ins' roles come from Workspace
                  groups (infrared-docs-internal ADR 0042). The Google OAuth client itself
                  is the install's configuration (the chart's platformTokens.googleClientId
                  and googleClientSecret), and so is whether the root user's password
                  still signs in (the chart's signIn.password.enabled). The operator reads
                  none of it.
                properties:
                  google:
                    description: Google is Sign in with Google.
                    properties:
                      allowedDomains:
                        description: |-
                          AllowedDomains are the Google Workspace domains whose people may sign
                          in with Google, such as example.com: a sign-in is accepted only when the
                          ID token's hd claim and the email address's domain are both on the
                          list. Lower-case, at least one dot, no wildcard. Empty: nobody signs in
                          with Google.
                        items:
                          maxLength: 253
                          pattern: ^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
                          type: string
                        maxItems: 20
                        type: array
                        x-kubernetes-list-type: set
                      groupRoles:
                        description: |-
                          GroupRoles is set once, by the API, when a platform-admin team of the
                          platform org first has a Workspace group that resolves someone: from
                          then on Google sign-ins' roles come from Workspace groups, and an
                          allowed domain no longer makes everyone a platform admin (ADR 0042,
                          replacing ADR 0039's D5). Infrared never clears it; a person can, with
                          kubectl edit.
                        properties:
                          by:
                            description: |-
                              By is the email of the first person, sorted, of the platform-admin
                              team's group who had signed in with Google when the group first
                              resolved, or "the directory" when none of them had.
                            type: string
                          since:
                            description: Since is when the API set it.
                            format: date-time
                            type: string
                        required:
                        - by
                        - since
                        type: object
                      selfSignUp:
                        description: |-
                          SelfSignUp opens Sign in with Google to anyone with a verified Google
                          account, personal or Workspace, as a hosted control plane does
                          (infrared-docs-internal ADR 0057): a first sign-in that holds no role
                          anywhere gets an org of its own on the install's Gitea, its limits
                          copied from Products, People, NewTeams and PublicEnvironments, each
                          field as it is set here. Off (or unset), only the allowed domains sign in, as
                          before. Set by a platform admin in Settings, Sign-in; refused on an
                          install without Gitea, where an org with no forge could hold no Product.
                        properties:
                          customDomains:
                            description: |-
                              CustomDomains is how many own (external) Domains the org a sign-up
                              makes may hold (its limits.customDomains): 0 is none, the free tier,
                              where a custom domain is part of a paid plan; unset is no limit.
                            format: int32
                            maximum: 1000
                            minimum: 0
                            type: integer
                          enabled:
                            description: |-
                              Enabled admits any Google account with a verified address, and makes a
                              first sign-in that holds no role an org of its own.
                            type: boolean
                          newTeams:
                            description: |-
                              NewTeams is how many Teams the org a sign-up makes may make besides
                              the catalog's default Teams (Organization.spec.limits.newTeams):
                              unset means no limit, and 0 the default Teams alone.
                            format: int32
                            maximum: 1000
                            minimum: 0
                            type: integer
                          people:
                            description: |-
                              People is how many people the org a sign-up makes may name
                              (Organization.spec.limits.people): 1 is its owner alone, and 0 means
                              no limit.
                            format: int32
                            maximum: 1000
                            minimum: 0
                            type: integer
                          products:
                            description: |-
                              Products is how many Products the org a sign-up makes may hold
                              (Organization.spec.limits.products); 0 means no limit.
                            format: int32
                            maximum: 1000
                            minimum: 0
                            type: integer
                          publicEnvironments:
                            description: |-
                              PublicEnvironments is whether the org a sign-up makes may make an
                              environment public (Organization.spec.limits.publicEnvironments):
                              unset allows it, and false keeps its environments behind sign-in.
                            type: boolean
                        required:
                        - enabled
                        type: object
                    type: object
                type: object
              storage:
                description: |-
                  Storage is the platform's storage settings (infrared-docs-internal ADR
                  0087): Zot's install-wide settings and the platform's policy per kind,
                  which platform admins write and which applies to every org that has no
                  policy of its own for the kind. The operator enforces it only while the
                  chart's stores.policies.enabled is on, and seeds it from the chart's
                  registry.retention while it is empty; unset, the stores keep files as
                  before.
                properties:
                  policies:
                    description: Policies are the platform's policies, one per kind.
                    items:
                      description: |-
                        StoragePolicy is what keeps or deletes one kind of file, how many copies of
                        it there are, and whether new ones may be written. Each kind takes its own
                        fields (ADR 0087 D8): images, charts and artifacts keepTags, keepNewest,
                        deleteUntagged and copies; snapshots and other expireAfter and copies; the
                        media kinds expireAfter, copies and writes. A field left unset keeps what
                        the store does today.
                      properties:
                        copies:
                          description: |-
                            Copies is how many copies of each new file the stores keep, 1 to 3,
                            and at most the number of volume servers. Unset keeps the bucket's
                            own: two, or one on a single node.
                          format: int32
                          maximum: 3
                          minimum: 1
                          type: integer
                        deleteUntagged:
                          description: |-
                            DeleteUntagged is whether Zot deletes an image no tag names, the
                            install-wide untaggedAfter after it lost its last tag. Unset is true,
                            as today. Registry kinds only.
                          type: boolean
                        expireAfter:
                          description: |-
                            ExpireAfter is how long a file of the kind is kept after it is written:
                            never (unset), 7d, 30d, 90d or 1y. SeaweedFS writes it into the file's
                            volume, so a file keeps the expiry it was written with: shortening one
                            frees nothing until the files written after it age out, and no later
                            change saves a file written under it. Not for a registry kind. A
                            snapshots expiry spares golden snapshots and tags. Other's is the age
                            past which the filer's own log is pruned.
                          enum:
                          - ""
                          - 7d
                          - 30d
                          - 90d
                          - 1y
                          type: string
                        keepNewest:
                          description: |-
                            KeepNewest is how many of each repository's most recently pushed tags
                            are kept, whatever their names: 0 keeps none for being new. Registry
                            kinds only.
                          format: int32
                          maximum: 1000
                          minimum: 0
                          type: integer
                        keepTags:
                          description: |-
                            KeepTags are regular expressions (RE2, as Zot reads them): a tag that
                            matches one is kept in every repository of the kind. A tag that
                            matches none, and is not among its repository's keepNewest newest, is
                            deleted at Zot's next garbage collection. With neither keepTags nor
                            keepNewest, Zot keeps every tag. Registry kinds only.
                          items:
                            maxLength: 200
                            minLength: 1
                            pattern: ^[ -~]+$
                            type: string
                          maxItems: 20
                          type: array
                          x-kubernetes-list-type: atomic
                        kind:
                          description: Kind is what the policy governs.
                          enum:
                          - images
                          - charts
                          - artifacts
                          - snapshots
                          - summary-videos
                          - incident-videos
                          - pictures
                          - other
                          type: string
                        updatedAt:
                          description: UpdatedAt is when they set it.
                          format: date-time
                          type: string
                        updatedBy:
                          description: UpdatedBy is the login of the person who last
                            set the policy.
                          maxLength: 254
                          type: string
                        writes:
                          description: |-
                            Writes false makes the kind's prefix take no new file; reads and
                            deletes go on. Unset is true. Media kinds only.
                          type: boolean
                      required:
                      - kind
                      type: object
                      x-kubernetes-validations:
                      - message: 'keepTags, keepNewest and deleteUntagged are for
                          a registry kind: images, charts or artifacts'
                        rule: self.kind in ['images', 'charts', 'artifacts'] || (!has(self.keepTags)
                          && !has(self.keepNewest) && !has(self.deleteUntagged))
                      - message: 'images, charts and artifacts take no expireAfter:
                          Zot''s retention keeps or deletes them by tag (ADR 0087
                          D10)'
                        rule: '!(self.kind in [''images'', ''charts'', ''artifacts''])
                          || !has(self.expireAfter)'
                      - message: 'writes is for a media kind: summary-videos, incident-videos
                          or pictures'
                        rule: self.kind in ['summary-videos', 'incident-videos', 'pictures']
                          || !has(self.writes)
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    x-kubernetes-list-type: map
                  registry:
                    description: Registry holds Zot's install-wide settings.
                    properties:
                      gcDelay:
                        description: |-
                          GCDelay is how long after a blob was last used Zot may delete it. The
                          template's is 1h.
                        maxLength: 32
                        pattern: ^([0-9]+(h|m|s))+$
                        type: string
                      gcInterval:
                        description: GCInterval is how often Zot collects garbage.
                          The template's is 1h.
                        maxLength: 32
                        pattern: ^([0-9]+(h|m|s))+$
                        type: string
                      untaggedAfter:
                        description: |-
                          UntaggedAfter is how long after an image lost its last tag Zot deletes
                          it, where its policy deletes untagged images. The template's is 24h.
                        maxLength: 32
                        pattern: ^([0-9]+(h|m|s))+$
                        type: string
                    type: object
                type: object
              summaryVideos:
                description: |-
                  SummaryVideos is whether this install makes summary videos and product
                  owner announcements at all: platform admins switch it in Infrared, in
                  Settings, Install features. Off (or unset), no org can make one, and an
                  org's Settings says why. The chart provisions what the videos need (the
                  API's media volume, the pipeline's images, the Gemini key's Secret name;
                  summaryvideo.enabled); this only switches them on.
                properties:
                  enabled:
                    description: |-
                      Enabled lets orgs that turn summary videos on make them. Each video
                      spends the platform's Gemini credit, beside the org's own model key.
                    type: boolean
                type: object
              tokenVerified:
                description: TokenVerified is set once the one-time setup token has
                  been presented.
                type: boolean
              tunnel:
                description: |-
                  Tunnel is the Cloudflare Tunnel a Gateway edge is reached through
                  (infrared-docs-internal ADR 0064). Set, the gitops template binds no
                  node's ports: Envoy's Service is a ClusterIP, cloudflared routes
                  Infrared's own name, the tunnel's hostnames and *.<previews domain> to
                  it and answers 404 for any other name, the edge's
                  certificate comes from a certificate authority inside the cluster, and
                  neither external-dns nor Cloudflare's origin issuer runs. The edge's
                  names are proxied CNAMEs to the tunnel, made once by a person. With
                  mode beside, cloudflared runs beside an edge that stays on the nodes'
                  own ports instead (ADR 0090). Only a Gateway edge reads it; empty,
                  nothing changes. The operator fills it from INFRARED_TUNNEL while it
                  is empty, and never overwrites a value someone set.
                properties:
                  credentialsKey:
                    default: cloudflare-tunnel-credentials
                    description: |-
                      CredentialsKey is the key of the Secret infrared-platform-tokens that
                      holds the tunnel's credentials file, the JSON cloudflared runs the
                      tunnel with. The chart's platformTokens.cloudflareTunnelCredentials
                      writes it under the default, cloudflare-tunnel-credentials.
                    maxLength: 253
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  hostnames:
                    description: |-
                      Hostnames are the other names a record sends to the tunnel, each served
                      on the edge by a listener of its own: the names a gitops repo outside
                      the template serves there (a support desk, a webhook receiver), and,
                      until Infrared lists them itself, a zone's own addresses and the custom
                      hostnames once their records, or the custom hostnames' fallback origin,
                      point at the tunnel. cloudflared gives each a route of its own, which
                      reaches Envoy by that name (originServerName), so every connection it
                      holds to Envoy carries the name it serves: Envoy picks a listener by
                      that name, and finds no route when a connection reused from another
                      name carries the wrong one. A name listed nowhere, here, as Infrared's
                      own name or one label under the previews domain, gets cloudflared's
                      404 and never reaches Envoy
                      (infrared-docs-internal ADR 0090, workspace TODO 745). Lower case and
                      without a wildcard; Infrared's own name is never taken from here. Only
                      a Gateway edge reads it, in either mode.
                    items:
                      maxLength: 253
                      pattern: ^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                      type: string
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: set
                  id:
                    description: |-
                      ID is the tunnel's UUID, lower case, as Cloudflare names it, e.g.
                      6ff42ae2-765d-4adf-8112-31c55c1551ef. It is not a secret: the edge's
                      names are proxied CNAMEs to <id>.cfargotunnel.com.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                  mode:
                    description: |-
                      Mode is how the tunnel stands beside the nodes' own ports: only, the
                      tunnel alone (ADR 0064), or beside, cloudflared beside an edge that
                      stays on the nodes' own ports with Cloudflare's Origin CA and
                      external-dns, so each of its names moves onto the tunnel when its
                      record points at <id>.cfargotunnel.com, and back the same way
                      (infrared-docs-internal ADR 0090, workspace TODO 745). Beside,
                      cloudflared sends a Let's Encrypt challenge to Envoy's plain HTTP, then
                      Infrared's own name, each of Hostnames and the previews domain's
                      wildcard to Envoy's HTTPS, each by its own name, and answers 404 for
                      any other name. Empty means only, as before the field existed.
                    enum:
                    - ""
                    - only
                    - beside
                    type: string
                  publish:
                    description: |-
                      Publish, beside, gives external-dns the tunnel as the target of the
                      names it publishes from the edge (Infrared's own name, the previews
                      domain's wildcard and edge.<domain>): proxied CNAMEs to
                      <id>.cfargotunnel.com in place of the nodes' addresses. Off, it
                      publishes the nodes' addresses, as before. Only mode beside reads it.
                    type: boolean
                required:
                - id
                type: object
                x-kubernetes-validations:
                - message: 'publish takes mode beside: only beside the nodes'' own
                    ports does external-dns publish the edge''s names'
                  rule: '!has(self.publish) || !self.publish || (has(self.mode) &&
                    self.mode == ''beside'')'
            type: object
          status:
            description: InstallationStatus is the observed state of the install.
            properties:
              backup:
                description: |-
                  Backup is the newest backup, mirror run and point the operator has
                  seen in the destination.
                properties:
                  lastBackup:
                    description: LastBackup is the stamp of the newest complete backup.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastBackupAt:
                    description: |-
                      LastBackupAt is when the newest complete backup was made: the time its
                      stamp names.
                    format: date-time
                    type: string
                  lastMirrorRun:
                    description: LastMirrorRun is the stamp of the mirror's newest
                      run.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastPoint:
                    description: |-
                      LastPoint is the stamp of the newest point: the newest complete backup
                      a mirror run followed, which a restore brings back whole.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastPointAt:
                    description: |-
                      LastPointAt is when the newest point's backup was made: the time its
