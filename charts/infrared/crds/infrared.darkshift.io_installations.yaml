---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: installations.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Installation
    listKind: InstallationList
    plural: installations
    shortNames:
    - irinst
    singular: installation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.platformOrg
      name: Org
      type: string
    - jsonPath: .spec.managementCluster
      name: Cluster
      type: string
    - jsonPath: .status.backup.lastPoint
      name: Last point
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Installation is the singleton that tracks setup of this Infrared
          control plane.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              admin:
                description: InstallationAdmin is the first platform admin, created
                  by the setup wizard.
                properties:
                  email:
                    format: email
                    type: string
                  passwordSecretRef:
                    description: PasswordSecretRef holds the bcrypt hash of the admin
                      password.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - email
                - passwordSecretRef
                type: object
              backup:
                description: |-
                  Backup is where the platform's backups go and how they are made. The
                  operator fills it from INFRARED_BACKUP and INFRARED_COPIES while it is
                  empty, and never overwrites a value someone set.
                properties:
                  destination:
                    description: |-
                      Destination is the object storage outside the cluster the backups and
                      the mirror are written to.
                    properties:
                      bucket:
                        description: Bucket is the bucket's name.
                        maxLength: 63
                        minLength: 3
                        pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                        type: string
                      credentials:
                        description: Credentials are the key the backups reach the
                          bucket with.
                        properties:
                          kind:
                            description: |-
                              Kind is the credential's kind: accessKey, an S3 access key and its
                              secret. serviceAccount (Google Cloud Storage) and role (AWS) are
                              reserved.
                            enum:
                            - accessKey
                            type: string
                          secretRef:
                            description: |-
                              SecretRef names the Secret in Infrared's namespace that holds the key,
                              as backup-access-key-id and backup-secret-access-key:
                              infrared-platform-tokens, which the chart keeps.
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - kind
                        - secretRef
                        type: object
                      endpoint:
                        description: |-
                          Endpoint is the store's S3 endpoint, https:// and a host, with no path:
                          https://<region>.linodeobjects.com for Linode.
                        maxLength: 270
                        pattern: ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$
                        type: string
                      prefix:
                        description: |-
                          Prefix is where in the bucket this install's backups and mirror go:
                          <prefix>/backups/ and <prefix>/seaweedfs/. Empty means the install's
                          name, the management cluster's.
                        pattern: ^([a-z0-9][a-z0-9._-]{0,62})?$
                        type: string
                      provider:
                        description: |-
                          Provider runs the store: linode, Linode Object Storage, the one offered
                          on day one; or s3, any other S3-compatible store. gcs and aws are
                          reserved for native Google Cloud Storage and AWS by role.
                        enum:
                        - linode
                        - s3
                        type: string
                      region:
                        description: Region is the region S3 requests are signed for,
                          such as us-lax-4.
                        maxLength: 63
                        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                        type: string
                    required:
                    - bucket
                    - credentials
                    - endpoint
                    - provider
                    - region
                    type: object
                  mirror:
                    description: Mirror is the stores' buckets' mirror to the destination.
                    properties:
                      schedule:
                        description: |-
                          Schedule is when the mirror runs, five cron fields in UTC. Empty means
                          17 * * * *.
                        maxLength: 128
                        pattern: ^[0-9A-Za-z*/,?-]+( [0-9A-Za-z*/,?-]+){4}$
                        type: string
                    type: object
                  postgres:
                    description: Postgres is the platform's Postgres's own archive.
                    properties:
                      archive:
                        description: |-
                          Archive turns on Barman's WAL archiving and a daily base backup to the
                          destination's <prefix>/postgres/. Off by default: each backup holds a
                          dump of Postgres, and a restore never reads the archive.
                        type: boolean
                    type: object
                  recipients:
                    description: |-
                      Recipients are the age public keys (age1...) each backup is encrypted
                      to; any one of their identities opens it. Without one no backup is
                      made. Only the public half is ever here.
                    items:
                      pattern: ^age1[02-9ac-hj-np-z]{58}$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  retention:
                    description: |-
                      Retention is how long a backup is kept, whole days such as 7d; the
                      newest complete backup is never deleted. Empty means 7d.
                    pattern: ^[1-9][0-9]{0,2}d$
                    type: string
                  schedule:
                    description: |-
                      Schedule is when a backup is made, five cron fields in UTC. Empty
                      means 5 * * * *.
                    maxLength: 128
                    pattern: ^[0-9A-Za-z*/,?-]+( [0-9A-Za-z*/,?-]+){4}$
                    type: string
                type: object
              edge:
                description: |-
                  Edge is how traffic reaches Infrared and its zones: traefik, through
                  Traefik Ingresses as before, or gateway, through one shared Gateway run
                  by Envoy Gateway. Empty means traefik. The gitops template installs the
                  edge it names. The operator fills it from INFRARED_EDGE while it is
                  empty, and never overwrites a value someone set.
                enum:
                - ""
                - traefik
                - gateway
                type: string
              gitProviderRef:
                description: GitProviderRef is the platform org's git provider.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              gitopsRepoRef:
                description: GitopsRepoRef is the platform org's gitops repo.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              managementCluster:
                description: ManagementCluster is the Cluster Infrared runs on.
                type: string
              models:
                description: |-
                  Models maps model tiers to model IDs and holds the price table cost
                  estimates use.
                properties:
                  prices:
                    description: |-
                      Prices replace DefaultModelPrices for cost estimates when set. Spend
                      itself is what the Agent SDK reports for each step.
                    items:
                      description: |-
                        ModelPrice is a model's list price in USD per million tokens, as decimal
                        strings. CacheWriteUSD is the 5-minute cache write.
                      properties:
                        cacheReadUSD:
                          type: string
                        cacheWriteUSD:
                          type: string
                        inputUSD:
                          type: string
                        model:
                          minLength: 1
                          type: string
                        outputUSD:
                          type: string
                      required:
                      - model
                      type: object
                    type: array
                  tiers:
                    description: Tiers maps tiers to model IDs. Unset fields use DefaultModelTiers.
                    properties:
                      balanced:
                        type: string
                      fast:
                        type: string
                      frontier:
                        type: string
                    type: object
                type: object
              platformOrg:
                description: PlatformOrg is the Organization that administers this
                  control plane.
                type: string
              previews:
                description: |-
                  Previews give pre-release zones a URL behind Infrared sign-in. The
                  operator fills it from INFRARED_PREVIEWS while it is unset.
                properties:
                  cloudflareTokenSecret:
                    description: |-
                      CloudflareTokenSecret names a Secret in Infrared's namespace whose
                      api-token key may edit DNS for the managed roots.
                    type: string
                  domain:
                    description: |-
                      Domain previews live under: zone z is https://<z>.<domain>. A wildcard DNS
                      record for the domain must point at the management cluster's ingress.
                    minLength: 1
                    type: string
                  ingressHost:
                    description: |-
                      IngressHost is the name customers point their own domains at with a
                      CNAME, e.g. ingress.apps.example.com; it resolves to the ingress.
                    type: string
                  ingressIP:
                    description: IngressIP is the ingress's public address, for A
                      records on root domains.
                    type: string
                  managedRoots:
                    description: |-
                      ManagedRoots are domains Infrared manages in Cloudflare, under which any
                      org can claim a subdomain (e.g. darkshift.io gives acme.darkshift.io).
                    items:
                      type: string
                    type: array
                  signInURL:
                    description: |-
                      SignInURL is Infrared's public URL, where preview visitors sign in,
                      e.g. https://infrared.example.com.
                    pattern: ^https://
                    type: string
                required:
                - domain
                - signInURL
                type: object
              tokenVerified:
                description: TokenVerified is set once the one-time setup token has
                  been presented.
                type: boolean
            type: object
          status:
            description: InstallationStatus is the observed state of the install.
            properties:
              backup:
                description: |-
                  Backup is the newest backup, mirror run and point the operator has
                  seen in the destination.
                properties:
                  lastBackup:
                    description: LastBackup is the stamp of the newest complete backup.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastBackupAt:
                    description: |-
                      LastBackupAt is when the newest complete backup was made: the time its
                      stamp names.
                    format: date-time
                    type: string
                  lastMirrorRun:
                    description: LastMirrorRun is the stamp of the mirror's newest
                      run.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastPoint:
                    description: |-
                      LastPoint is the stamp of the newest point: the newest complete backup
                      a mirror run followed, which a restore brings back whole.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastPointAt:
                    description: |-
                      LastPointAt is when the newest point's backup was made: the time its
                      stamp names.
                    format: date-time
                    type: string
                  message:
                    description: Message says what happened last, or why the backups
                      are not healthy.
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: InstallationPhase is the setup wizard step the install
                  is waiting on.
                enum:
                - AwaitingToken
                - AwaitingAdmin
                - AwaitingOrg
                - AwaitingCluster
                - AwaitingGitProvider
                - AwaitingGitopsRepo
                - Syncing
                - Ready
                type: string
              postgresServerName:
                description: |-
                  PostgresServerName is the server name the platform's Postgres archives
                  under in the backup bucket, chosen once and never changed for the life
                  of the install: postgres-<stamp of when the operator chose it> on a
                  fresh install, the restore's new name on a restore, or postgres on an
                  install that archived before the field existed. Empty until the
                  operator has chosen.
                pattern: ^[a-z][A-Za-z0-9._-]{0,62}$
                type: string
              version:
                description: Version of the Infrared control plane.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: the Installation must be named infrared
          rule: self.metadata.name == 'infrared'
    served: true
    storage: true
    subresources:
      status: {}
