---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: installations.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Installation
    listKind: InstallationList
    plural: installations
    shortNames:
    - irinst
    singular: installation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.platformOrg
      name: Org
      type: string
    - jsonPath: .spec.managementCluster
      name: Cluster
      type: string
    - jsonPath: .status.backup.lastPoint
      name: Last point
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Installation is the singleton that tracks setup of this Infrared
          control plane.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              admin:
                description: |-
                  InstallationAdmin is the first platform admin, the root user, created by
                  the setup wizard. Its password's hash lives in the BreakGlass record named
                  root (infrared-docs-internal ADR 0042).
                properties:
                  email:
                    format: email
                    type: string
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef held the bcrypt hash of the admin password in a
                      Secret. Deprecated (ADR 0042): the hash lives in BreakGlass root. The
                      API copies it from the Secret once, and clears this ref once a person
                      has deleted the Secret.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - email
                type: object
              backup:
                description: |-
                  Backup is where the platform's backups go and how they are made. The
                  operator fills it from INFRARED_BACKUP and INFRARED_COPIES while it is
                  empty, and never overwrites a value someone set.
                properties:
                  destination:
                    description: |-
                      Destination is the object storage outside the cluster the backups and
                      the mirror are written to.
                    properties:
                      bucket:
                        description: Bucket is the bucket's name.
                        maxLength: 63
                        minLength: 3
                        pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                        type: string
                      credentials:
                        description: |-
                          Credentials are how the backups reach the bucket: a key, or the
                          identity of whatever runs.
                        properties:
                          kind:
                            description: |-
                              Kind is the credential's kind: accessKey, an S3 access key and its
                              secret, in the Secret secretRef names (linode, s3); or serviceAccount,
                              the identity of whatever reaches the bucket, granted the bucket's role
                              outside Infrared, with nothing in any Secret (gcs). role (AWS) is
                              reserved.
                            enum:
                            - accessKey
                            - serviceAccount
                            type: string
                          secretRef:
                            description: |-
                              SecretRef names the Secret in Infrared's namespace that holds the
                              access key, as backup-access-key-id and backup-secret-access-key:
                              infrared-platform-tokens, which the chart keeps. Required for an
                              accessKey; none for a serviceAccount.
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - kind
                        type: object
                        x-kubernetes-validations:
                        - message: an accessKey names the Secret that holds it in
                            secretRef
                          rule: self.kind != 'accessKey' || has(self.secretRef)
                      endpoint:
                        description: |-
                          Endpoint is the store's endpoint, https:// and a host, with no path:
                          https://<region>.linodeobjects.com for Linode, and for gcs always
                          https://storage.googleapis.com.
                        maxLength: 270
                        pattern: ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$
                        type: string
                      prefix:
                        description: |-
                          Prefix is where in the bucket this install's backups and mirror go:
                          <prefix>/backups/ and <prefix>/seaweedfs/. Empty means the install's
                          name, the management cluster's.
                        pattern: ^([a-z0-9][a-z0-9._-]{0,62})?$
                        type: string
                      provider:
                        description: |-
                          Provider runs the store: linode, Linode Object Storage, the one offered
                          on day one; s3, any other S3-compatible store; or gcs, Google Cloud
                          Storage, reached natively by the identity of whatever runs, with
                          credentials of kind serviceAccount. aws is reserved for AWS by role.
                        enum:
                        - linode
                        - s3
                        - gcs
                        type: string
                      region:
                        description: |-
                          Region is the region S3 requests are signed for, such as us-lax-4;
                          for gcs, the bucket's location, such as us-central1, which nothing
                          signs for.
                        maxLength: 63
                        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                        type: string
                    required:
                    - bucket
                    - credentials
                    - endpoint
                    - provider
                    - region
                    type: object
                    x-kubernetes-validations:
                    - message: gcs takes credentials of kind serviceAccount at the
                        endpoint https://storage.googleapis.com; linode and s3 take
                        an accessKey
                      rule: 'self.provider == ''gcs'' ? (self.credentials.kind ==
                        ''serviceAccount'' && self.endpoint == ''https://storage.googleapis.com'')
                        : self.credentials.kind == ''accessKey'''
                  mirror:
                    description: Mirror is the stores' buckets' mirror to the destination.
                    properties:
                      schedule:
                        description: |-
                          Schedule is when the mirror runs, five cron fields in UTC. Empty means
                          17 * * * *.
                        maxLength: 128
                        pattern: ^[0-9A-Za-z*/,?-]+( [0-9A-Za-z*/,?-]+){4}$
                        type: string
                    type: object
                  postgres:
                    description: Postgres is the platform's Postgres's own archive.
                    properties:
                      archive:
                        description: |-
                          Archive turns on Barman's WAL archiving and a daily base backup to the
                          destination's <prefix>/postgres/. Off by default: each backup holds a
                          dump of Postgres, and a restore never reads the archive.
                        type: boolean
                    type: object
                  recipients:
                    description: |-
                      Recipients are the age public keys (age1...) each backup is encrypted
                      to; any one of their identities opens it. Without one no backup is
                      made. Only the public half is ever here.
                    items:
                      pattern: ^age1[02-9ac-hj-np-z]{58}$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  retention:
                    description: |-
                      Retention is how long a backup is kept, whole days such as 7d; the
                      newest complete backup is never deleted. Empty means 7d.
                    pattern: ^[1-9][0-9]{0,2}d$
                    type: string
                  schedule:
                    description: |-
                      Schedule is when a backup is made, five cron fields in UTC. Empty
                      means 5 * * * *.
                    maxLength: 128
                    pattern: ^[0-9A-Za-z*/,?-]+( [0-9A-Za-z*/,?-]+){4}$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: postgres.archive is not offered with gcs yet
                  rule: '!(has(self.destination) && self.destination.provider == ''gcs''
                    && has(self.postgres) && self.postgres.archive)'
              edge:
                description: |-
                  Edge is how traffic reaches Infrared and its zones: traefik, through
                  Traefik Ingresses as before, or gateway, through one shared Gateway run
                  by Envoy Gateway. Empty means traefik. The gitops template installs the
                  edge it names. The operator fills it from INFRARED_EDGE while it is
                  empty, and never overwrites a value someone set.
                enum:
                - ""
                - traefik
                - gateway
                type: string
              gitProviderRef:
                description: GitProviderRef is the platform org's git provider.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              gitopsRepoRef:
                description: GitopsRepoRef is the platform org's gitops repo.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              managementCluster:
                description: ManagementCluster is the Cluster Infrared runs on.
                type: string
              models:
                description: |-
                  Models maps model tiers to model IDs and holds the price table cost
                  estimates use.
                properties:
                  prices:
                    description: |-
                      Prices replace DefaultModelPrices for cost estimates when set. Spend
                      itself is what the Agent SDK reports for each step.
                    items:
                      description: |-
                        ModelPrice is a model's list price in USD per million tokens, as decimal
                        strings. CacheWriteUSD is the 5-minute cache write.
                      properties:
                        cacheReadUSD:
                          type: string
                        cacheWriteUSD:
                          type: string
                        inputUSD:
                          type: string
                        model:
                          minLength: 1
                          type: string
                        outputUSD:
                          type: string
                      required:
                      - model
                      type: object
                    type: array
                  tiers:
                    description: Tiers maps tiers to model IDs. Unset fields use DefaultModelTiers.
                    properties:
                      balanced:
                        type: string
                      fast:
                        type: string
                      frontier:
                        type: string
                    type: object
                type: object
              observability:
                description: |-
                  Observability is where the install's own numbers go: the telemetry
                  plane it is a platform of (infrared-docs-internal ADR 0044). The gitops
                  template reads it; nothing leaves the cluster while it is unset.
                properties:
                  telemetry:
                    description: |-
                      Telemetry is the telemetry plane this install writes its metrics to
                      (ADR 0044): the operator's step series, the API's request series and
                      what else the install measures, pushed by a vmagent the gitops template
                      renders while it is set, every series labelled with the platform name.
                    properties:
                      platform:
                        description: |-
                          Platform is this install's name in the telemetry plane, the platform
                          label on every series it writes: a DNS label, such as <login>-<stack>
                          for a stack on a Mac, or the management cluster's name for a hosted
                          install.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                        type: string
                      url:
                        description: |-
                          URL is the remote-write address the install's metrics are pushed to,
                          such as https://infrared.example.com/api/v1/telemetry/write, under the
                          telemetry token kept in the cluster.
                        maxLength: 2048
                        pattern: ^https?://
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: telemetry takes url and platform together, or neither
                      rule: has(self.url) == has(self.platform)
                type: object
              platformOrg:
                description: PlatformOrg is the Organization that administers this
                  control plane.
                type: string
              previews:
                description: |-
                  Previews give pre-release zones a URL behind Infrared sign-in. The
                  operator fills it from INFRARED_PREVIEWS while it is unset.
                properties:
                  acmeEmail:
                    description: |-
                      ACMEEmail is the address Let's Encrypt writes to about the origin
                      certificates of custom hostnames, e.g. alerts@example.com.
                    type: string
                  cloudflareTokenKey:
                    description: |-
                      CloudflareTokenKey is the key of CloudflareTokenSecret that holds the
                      token; empty is api-token. The chart's infrared-platform-tokens holds it
                      as cloudflare-api-token.
                    type: string
                  cloudflareTokenSecret:
                    description: |-
                      CloudflareTokenSecret names a Secret in Infrared's namespace whose
                      CloudflareTokenKey key may edit DNS for the managed roots.
                    type: string
                  customHostnames:
                    description: |-
                      CustomHostnames serves addresses under an org's external Domains on a
                      Gateway edge behind Cloudflare: each becomes a Cloudflare for SaaS
                      custom hostname on the zone of the managed root that holds IngressHost,
                      whose fallback origin is IngressHost, and its origin certificate comes
                      from Let's Encrypt over HTTP-01 through Cloudflare's proxy. Cloudflare
                      for SaaS must be on for that zone, and the token needs Zone / SSL and
                      Certificates / Edit there.
                    type: boolean
                  domain:
                    description: |-
                      Domain previews live under: zone z is https://<z>.<domain>. A wildcard DNS
                      record for the domain must point at the management cluster's ingress.
                    minLength: 1
                    type: string
                  domainTokenKey:
                    description: |-
                      DomainTokenKey is the key of the Secret infrared-platform-tokens that
                      holds a Cloudflare token for Domain's zone, when Domain is in another
                      Cloudflare zone than SignInURL's host and that token is kept apart (a
                      hosted plane's tenants' domain, infrared-docs-internal ADR 0063). The
                      Gateway edge then takes the certificate and DNS records of *.<Domain>
                      with it, and those of Infrared's own name with cloudflare-api-token.
                      Empty means cloudflare-api-token serves both.
                    maxLength: 253
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  ingressHost:
                    description: |-
                      IngressHost is the name customers point their own domains at with a
                      CNAME, e.g. ingress.apps.example.com; it resolves to the ingress.
                    type: string
                  ingressIP:
                    description: IngressIP is the ingress's public address, for A
                      records on root domains.
                    type: string
                  managedRoots:
                    description: |-
                      ManagedRoots are domains Infrared manages in Cloudflare, under which any
                      org can claim a subdomain (e.g. darkshift.io gives acme.darkshift.io).
                    items:
                      type: string
                    type: array
                  signInURL:
                    description: |-
                      SignInURL is Infrared's public URL, where preview visitors sign in,
                      e.g. https://infrared.example.com.
                    pattern: ^https://
                    type: string
                required:
                - domain
                - signInURL
                type: object
              signIn:
                description: |-
                  SignIn holds the sign-in settings platform admins change in Infrared,
                  in Settings, Sign-in: which Google Workspace domains may sign in with
                  Google, and since when Google sign-ins' roles come from Workspace
                  groups (infrared-docs-internal ADR 0042). The Google OAuth client itself
                  is the install's configuration (the chart's platformTokens.googleClientId
                  and googleClientSecret), and so is whether the root user's password
                  still signs in (the chart's signIn.password.enabled). The operator reads
                  none of it.
                properties:
                  google:
                    description: Google is Sign in with Google.
                    properties:
                      allowedDomains:
                        description: |-
                          AllowedDomains are the Google Workspace domains whose people may sign
                          in with Google, such as example.com: a sign-in is accepted only when the
                          ID token's hd claim and the email address's domain are both on the
                          list. Lower-case, at least one dot, no wildcard. Empty: nobody signs in
                          with Google.
                        items:
                          maxLength: 253
                          pattern: ^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
                          type: string
                        maxItems: 20
                        type: array
                        x-kubernetes-list-type: set
                      groupRoles:
                        description: |-
                          GroupRoles is set once, by the API, when a platform-admin team of the
                          platform org first has a Workspace group that resolves someone: from
                          then on Google sign-ins' roles come from Workspace groups, and an
                          allowed domain no longer makes everyone a platform admin (ADR 0042,
                          replacing ADR 0039's D5). Infrared never clears it; a person can, with
                          kubectl edit.
                        properties:
                          by:
                            description: |-
                              By is the email of the first person, sorted, of the platform-admin
                              team's group who had signed in with Google when the group first
                              resolved, or "the directory" when none of them had.
                            type: string
                          since:
                            description: Since is when the API set it.
                            format: date-time
                            type: string
                        required:
                        - by
                        - since
                        type: object
                      selfSignUp:
                        description: |-
                          SelfSignUp opens Sign in with Google to anyone with a verified Google
                          account, personal or Workspace, as a hosted control plane does
                          (infrared-docs-internal ADR 0057): a first sign-in that holds no role
                          anywhere gets an org of its own on the install's Gitea, its limits
                          copied from Products, People, NewTeams and PublicEnvironments, each
                          field as it is set here. Off (or unset), only the allowed domains sign in, as
                          before. Set by a platform admin in Settings, Sign-in; refused on an
                          install without Gitea, where an org with no forge could hold no Product.
                        properties:
                          enabled:
                            description: |-
                              Enabled admits any Google account with a verified address, and makes a
                              first sign-in that holds no role an org of its own.
                            type: boolean
                          newTeams:
                            description: |-
                              NewTeams is how many Teams the org a sign-up makes may make besides
                              the catalog's default Teams (Organization.spec.limits.newTeams):
                              unset means no limit, and 0 the default Teams alone.
                            format: int32
                            maximum: 1000
                            minimum: 0
                            type: integer
                          people:
                            description: |-
                              People is how many people the org a sign-up makes may name
                              (Organization.spec.limits.people): 1 is its owner alone, and 0 means
                              no limit.
                            format: int32
                            maximum: 1000
                            minimum: 0
                            type: integer
                          products:
                            description: |-
                              Products is how many Products the org a sign-up makes may hold
                              (Organization.spec.limits.products); 0 means no limit.
                            format: int32
                            maximum: 1000
                            minimum: 0
                            type: integer
                          publicEnvironments:
                            description: |-
                              PublicEnvironments is whether the org a sign-up makes may make an
                              environment public (Organization.spec.limits.publicEnvironments):
                              unset allows it, and false keeps its environments behind sign-in.
                            type: boolean
                        required:
                        - enabled
                        type: object
                    type: object
                type: object
              summaryVideos:
                description: |-
                  SummaryVideos is whether this install makes summary videos and product
                  owner announcements at all: platform admins switch it in Infrared, in
                  Settings, Install features. Off (or unset), no org can make one, and an
                  org's Settings says why. The chart provisions what the videos need (the
                  API's media volume, the pipeline's images, the Gemini key's Secret name;
                  summaryvideo.enabled); this only switches them on.
                properties:
                  enabled:
                    description: |-
                      Enabled lets orgs that turn summary videos on make them. Each video
                      spends the platform's Gemini credit, beside the org's own model key.
                    type: boolean
                type: object
              tokenVerified:
                description: TokenVerified is set once the one-time setup token has
                  been presented.
                type: boolean
              tunnel:
                description: |-
                  Tunnel is the Cloudflare Tunnel a Gateway edge is reached through
                  (infrared-docs-internal ADR 0064). Set, the gitops template binds no
                  node's ports: Envoy's Service is a ClusterIP, cloudflared routes
                  Infrared's own name and *.<previews domain> to it, the edge's
                  certificate comes from a certificate authority inside the cluster, and
                  neither external-dns nor Cloudflare's origin issuer runs. The edge's
                  names are proxied CNAMEs to the tunnel, made once by a person. Only a
                  Gateway edge reads it; empty, nothing changes. The operator fills it
                  from INFRARED_TUNNEL while it is empty, and never overwrites a value
                  someone set.
                properties:
                  credentialsKey:
                    default: cloudflare-tunnel-credentials
                    description: |-
                      CredentialsKey is the key of the Secret infrared-platform-tokens that
                      holds the tunnel's credentials file, the JSON cloudflared runs the
                      tunnel with. The chart's platformTokens.cloudflareTunnelCredentials
                      writes it under the default, cloudflare-tunnel-credentials.
                    maxLength: 253
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  id:
                    description: |-
                      ID is the tunnel's UUID, lower case, as Cloudflare names it, e.g.
                      6ff42ae2-765d-4adf-8112-31c55c1551ef. It is not a secret: the edge's
                      names are proxied CNAMEs to <id>.cfargotunnel.com.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - id
                type: object
            type: object
          status:
            description: InstallationStatus is the observed state of the install.
            properties:
              backup:
                description: |-
                  Backup is the newest backup, mirror run and point the operator has
                  seen in the destination.
                properties:
                  lastBackup:
                    description: LastBackup is the stamp of the newest complete backup.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastBackupAt:
                    description: |-
                      LastBackupAt is when the newest complete backup was made: the time its
                      stamp names.
                    format: date-time
                    type: string
                  lastMirrorRun:
                    description: LastMirrorRun is the stamp of the mirror's newest
                      run.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastPoint:
                    description: |-
                      LastPoint is the stamp of the newest point: the newest complete backup
                      a mirror run followed, which a restore brings back whole.
                    pattern: ^[0-9]{8}T[0-9]{6}Z$
                    type: string
                  lastPointAt:
                    description: |-
                      LastPointAt is when the newest point's backup was made: the time its
                      stamp names.
                    format: date-time
                    type: string
                  message:
                    description: Message says what happened last, or why the backups
                      are not healthy.
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: InstallationPhase is the setup wizard step the install
                  is waiting on.
                enum:
                - AwaitingToken
                - AwaitingAdmin
                - AwaitingOrg
                - AwaitingCluster
                - AwaitingGitProvider
                - AwaitingGitopsRepo
                - Syncing
                - Ready
                type: string
              postgresServerName:
                description: |-
                  PostgresServerName is the server name the platform's Postgres archives
                  under in the backup bucket, chosen once and never changed for the life
                  of the install: postgres-<stamp of when the operator chose it> on a
                  fresh install, the restore's new name on a restore, or postgres on an
                  install that archived before the field existed. Empty until the
                  operator has chosen.
                pattern: ^[a-z][A-Za-z0-9._-]{0,62}$
                type: string
              version:
                description: Version of the Infrared control plane.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: the Installation must be named infrared
          rule: self.metadata.name == 'infrared'
    served: true
    storage: true
    subresources:
      status: {}
