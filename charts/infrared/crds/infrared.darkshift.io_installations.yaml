                    format: date-time
                    type: string
                  message:
                    description: Message says what happened last, or why the backups
                      are not healthy.
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: InstallationPhase is the setup wizard step the install
                  is waiting on.
                enum:
                - AwaitingToken
                - AwaitingAdmin
                - AwaitingOrg
                - AwaitingCluster
                - AwaitingGitProvider
                - AwaitingGitopsRepo
                - Syncing
                - Ready
                type: string
              postgresServerName:
                description: |-
                  PostgresServerName is the server name the platform's Postgres archives
                  under in the backup bucket, chosen once and never changed for the life
                  of the install: postgres-<stamp of when the operator chose it> on a
                  fresh install, the restore's new name on a restore, or postgres on an
                  install that archived before the field existed. Empty until the
                  operator has chosen.
                pattern: ^[a-z][A-Za-z0-9._-]{0,62}$
                type: string
              storage:
                description: |-
                  Storage is the stores' layout and what the operator applies of
                  spec.storage (ADR 0087).
                properties:
                  applied:
                    description: Applied is what the operator last applied of spec.storage.
                    properties:
                      at:
                        description: At is when the stores last confirmed it.
                        format: date-time
                        type: string
                      hash:
                        description: |-
                          Hash is the Hash of the spec.storage applied. While it differs from the
                          spec's own, the spec's latest change is still being applied.
                        maxLength: 64
                        type: string
                      message:
                        description: Message says what was applied, or why the last
                          attempt failed.
                        type: string
                    type: object
                  enforcing:
                    description: |-
                      Enforcing is true while the operator applies storage policies: the
                      chart's stores.policies.enabled is on and the stores are laid out by
                      org and kind. infrared-api refuses a policy write while it is false.
                    type: boolean
                  layout:
                    description: |-
                      Layout is how the stores lay their files out now: empty for the layout
                      before ADR 0087, org once a migration has copied every repository's
                      files into it and verified them there, with Zot stopped; the
                      migration's later steps (Zot started at its new root, the tags
                      checked, the references rewritten, the old copies deleted) are in
                      Migration. The gitops template follows it, never the chart's value, so
                      Zot moves to its new root only after its files.
                    enum:
                    - ""
                    - org
                    type: string
                  migration:
                    description: Migration is the move between layouts in progress,
                      or the last one.
                    properties:
                      finishedAt:
                        description: |-
                          FinishedAt is when it finished, or when it stopped; its message says
