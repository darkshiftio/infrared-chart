---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: installations.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Installation
    listKind: InstallationList
    plural: installations
    shortNames:
    - irinst
    singular: installation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.platformOrg
      name: Org
      type: string
    - jsonPath: .spec.managementCluster
      name: Cluster
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Installation is the singleton that tracks setup of this Infrared
          control plane.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              admin:
                description: InstallationAdmin is the first platform admin, created
                  by the setup wizard.
                properties:
                  email:
                    format: email
                    type: string
                  passwordSecretRef:
                    description: PasswordSecretRef holds the bcrypt hash of the admin
                      password.
                    properties:
                      key:
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - email
                - passwordSecretRef
                type: object
              edge:
                description: |-
                  Edge is how traffic reaches Infrared and its zones: traefik, through
                  Traefik Ingresses as before, or gateway, through one shared Gateway run
                  by Envoy Gateway. Empty means traefik. The gitops template installs the
                  edge it names. The operator fills it from INFRARED_EDGE while it is
                  empty, and never overwrites a value someone set.
                enum:
                - ""
                - traefik
                - gateway
                type: string
              gitProviderRef:
                description: GitProviderRef is the platform org's git provider.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              gitopsRepoRef:
                description: GitopsRepoRef is the platform org's gitops repo.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              managementCluster:
                description: ManagementCluster is the Cluster Infrared runs on.
                type: string
              platformOrg:
                description: PlatformOrg is the Organization that administers this
                  control plane.
                type: string
              previews:
                description: |-
                  Previews give pre-release zones a URL behind Infrared sign-in. The
                  operator fills it from INFRARED_PREVIEWS while it is unset.
                properties:
                  cloudflareTokenSecret:
                    description: |-
                      CloudflareTokenSecret names a Secret in Infrared's namespace whose
                      api-token key may edit DNS for the managed roots.
                    type: string
                  domain:
                    description: |-
                      Domain previews live under: zone z is https://<z>.<domain>. A wildcard DNS
                      record for the domain must point at the management cluster's ingress.
                    minLength: 1
                    type: string
                  ingressHost:
                    description: |-
                      IngressHost is the name customers point their own domains at with a
                      CNAME, e.g. ingress.apps.example.com; it resolves to the ingress.
                    type: string
                  ingressIP:
                    description: IngressIP is the ingress's public address, for A
                      records on root domains.
                    type: string
                  managedRoots:
                    description: |-
                      ManagedRoots are domains Infrared manages in Cloudflare, under which any
                      org can claim a subdomain (e.g. darkshift.io gives acme.darkshift.io).
                    items:
                      type: string
                    type: array
                  signInURL:
                    description: |-
                      SignInURL is Infrared's public URL, where preview visitors sign in,
                      e.g. https://infrared.example.com.
                    pattern: ^https://
                    type: string
                required:
                - domain
                - signInURL
                type: object
              tokenVerified:
                description: TokenVerified is set once the one-time setup token has
                  been presented.
                type: boolean
            type: object
          status:
            description: InstallationStatus is the observed state of the install.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: InstallationPhase is the setup wizard step the install
                  is waiting on.
                enum:
                - AwaitingToken
                - AwaitingAdmin
                - AwaitingOrg
                - AwaitingCluster
                - AwaitingGitProvider
                - AwaitingGitopsRepo
                - Syncing
                - Ready
                type: string
              version:
                description: Version of the Infrared control plane.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: the Installation must be named infrared
          rule: self.metadata.name == 'infrared'
    served: true
    storage: true
    subresources:
      status: {}
