---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: organizations.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Organization
    listKind: OrganizationList
    plural: organizations
    shortNames:
    - irorg
    singular: organization
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.platform
      name: Platform
      type: boolean
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.addressLabel
      name: Address label
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Organization is an Infrared org.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'OrganizationSpec defines an org: the tenancy and RBAC boundary
              in Infrared.'
            properties:
              accessGroups:
                description: |-
                  AccessGroups give people access to the org: the people of a group's
                  Workspace group when they sign in with Google, and its members by
                  GitHub login (infrared-docs-internal ADR 0042, renamed from teams by ADR
                  0049). The root user, and API tokens with no owner or the root user's,
                  have full access without one.
                items:
                  description: |-
                    AccessGroup is a named group of people with one role in the org: what
                    ADR 0042 called a team. It grants a role and nothing else; it is not the
                    Team of ADR 0049, where humans and agents work.
                  properties:
                    description:
                      type: string
                    emails:
                      description: |-
                        Emails are members by the address of their Google account, which Google verified at sign-in:
                        people who sign in with Google and hold no Workspace group or linked login, such as a hosted
                        control plane's tenants (infrared-docs-internal ADR 0057). Lower-case. Adding an address is the
                        invitation; taking it off ends the role at the person's next request. It matches an address, not
                        a stable subject: a person who changes their Google address needs the new one added.
                      items:
                        maxLength: 254
                        pattern: ^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$
                        type: string
                      maxItems: 200
                      type: array
                      x-kubernetes-list-type: set
                    githubTeam:
                      description: |-
                        GitHubTeam is the GitHub team, by slug, in the org's GitHub organization (its GitProvider github),
                        that Infrared keeps in step with this team. Gitea and GitLab teams take sibling fields later.
                      maxLength: 100
                      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                      type: string
                    googleGroup:
                      description: |-
                        GoogleGroup is the Google Workspace group whose people hold this team's role when they sign in
                        with Google, by its address. Its people's linked GitHub logins then count, and the team's
                        Members count only for people who sign in with GitHub (ADR 0042).
                      maxLength: 254
                      pattern: ^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$
                      type: string
                    members:
                      description: |-
                        Members by GitHub login: people who sign in with GitHub, and people
                        who sign in with Google and linked that login, on a team without a
                        GoogleGroup.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    name:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    role:
                      enum:
                      - platform-admin
                      - org-admin
                      - member
                      - viewer
                      type: string
                  required:
                  - name
                  - role
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              addressLabel:
                description: |-
                  AddressLabel is the label the org asks for under the previews domain,
                  where the Installation's spec.previews.orgLabels is on: its zones then
                  answer at <zone>.<addressLabel>.<domain> (infrared-docs-internal ADR
                  0097). A DNS label, lower case, 3 to 32 characters, one org's alone
                  across the install. Empty, the operator generates one. The label in
                  effect is status.addressLabel: a label another org holds, or a
                  reserved one, is refused there (the condition AddressLabelReady).
                maxLength: 32
                minLength: 3
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              agentSteps:
                description: |-
                  AgentSteps says where the org's agentRole steps run: as runner Jobs in
                  the cluster (the default), leased to RunnerPools on people's Macs
                  (localred plan, phase 2), or as Agent Substrate actors in the cluster
                  (infrared-docs-internal ADR 0089).
                properties:
                  fallback:
                    description: |-
                      Fallback is what a step placed on the pools or on actors does when no
                      pool that takes it is alive, or no actor's worker has room: jobs (run
                      it as a Job, the default) or wait.
                    enum:
                    - jobs
                    - wait
                    type: string
                  placement:
                    default: jobs
                    description: |-
                      Placement is jobs (runner Jobs in the cluster), pools (AgentVMs the
                      org's RunnerPools lease) or actors (Agent Substrate actors in the
                      cluster). A step that publishes, delivers to Slack or names an MCP
                      server runs as a Job on pools.
                    enum:
                    - jobs
                    - pools
                    - actors
                    type: string
                  products:
                    description: |-
                      Products, when set, are the org's Products whose steps follow the
                      placement; a step of another Product, or of no Product (an org's or a
                      Team's scheduled run), runs as a Job. Empty: every step of the org
                      follows it. An org moves one Product to a placement first, then the
                      others (workspace TODO 721).
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: set
                type: object
              announcements:
                description: |-
                  Announcements configures announcement drafting (release notes, blog,
                  newsletter, social posts). Drafts go to the org's Slack channel; nothing
                  is published.
                properties:
                  accounts:
                    description: |-
                      Accounts are the social accounts drafts are written for. They may be
                      pretend accounts while the org practises: Infrared never posts to them.
                    items:
                      description: SocialAccount is one account announcement drafts
                        are written for.
                      properties:
                        handle:
                          description: Handle, e.g. @zippy.
                          minLength: 1
                          type: string
                        network:
                          description: Network, e.g. x, linkedin, bluesky, mastodon.
                          minLength: 1
                          type: string
                        voice:
                          description: Voice is how posts on this account should sound.
                          type: string
                      required:
                      - handle
                      - network
                      type: object
                    type: array
                  backdropLibrary:
                    description: |-
                      BackdropLibrary is how many backdrops each Product keeps: every one made
                      for its announcements is saved, and once it has this many, an
                      announcement reuses the one used longest ago instead of paying for a
                      new one (the owner, 2026-10-24). Zero means DefaultBackdropLibrary.
                    format: int32
                    maximum: 200
                    minimum: 0
                    type: integer
                  freshStage:
                    description: |-
                      FreshStage makes a new studio stage with Google's image model for each
                      announcement (ADR 0055, the owner, 2026-10-24): the picture on each X,
                      LinkedIn and Bluesky draft and post, with the official logo and the
                      headline drawn on it, and the stage a product owner announcement's
                      presenter stands on. Each stage costs about StageUSD, counted against
                      spec.summaryVideos' monthly cap.
                    type: boolean
                  requireApproval:
                    description: |-
                      RequireApproval makes a person approve every draft before it posts to
                      any of the org's Socials, whatever a Social's plan or a Product's
                      schedule says: window and auto review act as approve (ADR 0055, the
                      owner, 2026-10-23). Post now still posts: a person asked.
                    type: boolean
                  signupAddress:
                    description: |-
                      SignupAddress is the shared mailbox new social accounts are made with,
                      so none belongs to one person (ADR 0055 D7), e.g. social@example.com.
                      The new-accounts helper suggests social+<platform>@ forms of it.
                    maxLength: 254
                    type: string
                type: object
              budgets:
                description: |-
                  Budgets are the org's own weekly limits for its AgentWorkflows' budget
                  groups (workspace TODO 700): a group named here takes the limit set
                  here, and an override in force, rather than its workflows'
                  spec.budget.weeklyUSD, so raising a limit never edits a workflow.
                items:
                  description: OrgBudget is an org's limit for one budget group of
                    its AgentWorkflows.
                  properties:
                    group:
                      description: Group is the budget group, as the workflows' spec.budget.group
                        names it.
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    override:
                      description: |-
                        Override is a limit for a while: it applies until Until, then the group
                        goes back to WeeklyUSD, or its workflows' limit, by itself.
                      properties:
                        by:
                          description: By is who set it, as the API names them.
                          type: string
                        until:
                          description: Until is when the override ends.
                          format: date-time
                          type: string
                        weeklyUSD:
                          description: WeeklyUSD is the group's limit while the override
                            lasts.
                          pattern: ^[0-9]+(\.[0-9]{1,2})?$
                          type: string
                      required:
                      - until
                      - weeklyUSD
                      type: object
                    weeklyUSD:
                      description: |-
                        WeeklyUSD replaces the workflows' own limit for the group, as a decimal
                        string; empty keeps theirs.
                      pattern: ^[0-9]+(\.[0-9]{1,2})?$
                      type: string
                  required:
                  - group
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - group
                x-kubernetes-list-type: map
              buildRegistry:
                description: |-
                  BuildRegistry is the Registry, in the org's namespace, its Products
                  build into; empty means the install's own registry (infrared-docs-internal
                  ADR 0033). A Product follows it from its next scaffold; images already
                  released stay where they are.
                maxLength: 253
                type: string
              clusterAllowlist:
                description: Clusters this org may deliver zones to. Managed by the
                  platform org.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              clusterSelfService:
                description: |-
                  ClusterSelfService lets the org's admins register and build workload
                  clusters of their own (infrared-docs-internal ADR 0052): by kubeconfig,
                  or from a cluster template through one of the org's own cloud accounts.
                  Set by a platform admin. Off by default.
                type: boolean
              displayName:
                minLength: 1
                type: string
              limits:
                description: |-
                  Limits bounds what the org may hold, beyond the licence's install-wide
                  limits: set at a self-service sign-up from the install's
                  signIn.google.selfSignUp (infrared-docs-internal ADR 0057), changed by
                  a platform admin. Unset means none.
                properties:
                  customDomains:
                    description: |-
                      CustomDomains caps the org's own (external) Domains, the domains it
                      proves it controls and serves its environments at: unset means no cap,
                      and 0 means none, the free tier's on a hosted plane, where a custom
                      domain is part of a paid plan. A Domain the org has already stays. The
                      API refuses the Domain past it, saying what to do; a platform admin may
                      add Domains past it. An install that sets no limit, a self-hosted one,
                      caps nothing.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  newTeams:
                    description: |-
                      NewTeams caps the Teams the org may make besides the catalog's
                      default Teams: unset means no cap, and 0 means none, the free tier's
                      (it keeps its default Teams). A default Team the org removed may
                      always be made again. The API refuses the Team past it, saying what to
                      do; a platform admin may make Teams past it.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  people:
                    description: |-
                      People caps the people the org names, counted in each place: its
                      access groups' distinct addresses and GitHub logins, and its Humans.
                      0 means no cap; the free tier is 1, its owner. AgentRoles are not
                      people. While capped, an access group names no Workspace group or
                      GitHub team it did not name before, since their people cannot be
                      counted. The API refuses the person past it, saying what to do; a
                      platform admin may add people past it.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  products:
                    description: |-
                      Products caps the org's Products; 0 means no cap. The API refuses the
                      Product past it, saying what to do.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  publicEnvironments:
                    description: |-
                      PublicEnvironments says whether the org may make an environment
                      public, open to anyone without Infrared sign-in (a zone's public):
                      unset allows it, and false refuses it, the free tier's, since a
                      public zone would serve a stranger's site at the install's preview
                      domain. A zone public already stays public. The API refuses making
                      one public, saying what to do; a platform admin may.
                    type: boolean
                type: object
              modelProvider:
                description: |-
                  ModelProvider is where the org's agent steps reach Claude. Unset is the
                  Anthropic API with the org's key. Bedrock is honoured only where the
                  install turns it on (INFRARED_BEDROCK); a Bedrock org's ModelTiers name
                  Bedrock model IDs or inference profiles.
                properties:
                  bedrock:
                    description: |-
                      Bedrock runs the org's agent steps on AWS Bedrock; unset, on the
                      Anthropic API.
                    properties:
                      cloudAccount:
                        description: CloudAccount names an AWS CloudAccount in the
                          org's namespace.
                        maxLength: 253
                        minLength: 1
                        type: string
                      region:
                        description: Region is the AWS region Bedrock is called in,
                          e.g. us-east-1.
                        pattern: ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$
                        type: string
                    required:
                    - cloudAccount
                    - region
                    type: object
                type: object
              modelTiers:
                description: |-
                  ModelTiers overrides the Installation's tier-to-model mapping for this
                  org. Unset fields use the Installation's.
                properties:
                  balanced:
                    type: string
                  fast:
                    type: string
                  frontier:
                    type: string
                type: object
              platform:
                description: Platform marks the org that administers the control plane.
                type: boolean
              scheduling:
                description: |-
                  Scheduling turns on AgentWorkflows' cron triggers for the org. Off by
                  default: scheduled runs spend model tokens every day.
                properties:
                  enabled:
                    description: Enabled starts runs on the AgentWorkflows' cron schedules.
                    type: boolean
                  timeZone:
                    description: TimeZone the cron schedules are read in, e.g. America/New_York;
                      empty means UTC.
                    type: string
                required:
                - enabled
                type: object
              securityEvidence:
                description: |-
                  SecurityEvidence is the org's setting for the security evidence of its
                  releases (infrared-operator#119): which builds get it, and how long it
                  is kept. Unset, customer releases get it and it is kept
                  DefaultEvidenceRetentionDays, so an org made before the setting needs
                  no write.
                properties:
                  builds:
                    description: |-
                      Builds says which of the org's builds get security evidence:
                      customer-releases, each customer release's images (the default when
                      unset), or none. There is no value for main-line builds.
                    enum:
                    - customer-releases
                    - none
                    type: string
                  retentionDays:
                    description: |-
                      RetentionDays is how long the evidence of each image is kept, in whole
                      days counted from when it was made, from 7 to 3650. Unset means
                      DefaultEvidenceRetentionDays, so an org that never chose keeps 90 days.
                      A shorter retention lets go of what is already past it; a longer one
                      keeps longer what is still there, and brings back nothing.
                    format: int32
                    maximum: 3650
                    minimum: 7
                    type: integer
                type: object
              sessions:
                description: |-
                  Sessions says whether the org's people's own Claude Code sessions are
                  recorded as Sessions and measured as series (infrared-docs-internal
                  ADR 0071 D4). A field left unset takes the install's default
                  (Installation.spec.observability.sessions); unset there too, it is on.
                properties:
                  record:
                    description: |-
                      Record keeps a Session per session, shown in the Changelog and counted
                      in the week in review and the person's activity.
                    type: boolean
                  telemetry:
                    description: |-
                      Telemetry exports the sessions' figures as series, which the install's
                      metrics stack carries to the telemetry plane.
                    type: boolean
                type: object
              slack:
                description: |-
                  Slack is the org's Slack workspace connection: the workspace, and the
                  channel product announcements and summary videos go to. The bot token
                  lives in Secret SlackBotSecret in the org's namespace.
                properties:
                  channelID:
                    description: ChannelID and ChannelName are the single-workspace
                      announcements channel.
                    type: string
                  channelName:
                    type: string
                  connectedAt:
                    format: date-time
                    type: string
                  connectedBy:
                    description: ConnectedBy is who connected the single workspace,
                      and ConnectedAt when.
                    type: string
                  destinations:
                    description: Destinations are where Infrared posts about the org's
                      Products, and what.
                    items:
                      description: SlackDestination is a channel in a connected workspace
                        and what goes there.
                      properties:
                        channelID:
                          description: ChannelID is the Slack channel ID, e.g. C0123456789.
                          minLength: 1
                          type: string
                        channelName:
                          description: 'ChannelName is the channel''s name without
                            the #, for display.'
                          type: string
                        kinds:
                          description: |-
                            Kinds are what is posted there: summary (summary videos), announcement
                            (product owner announcements), drafts (announcement and GTM drafts),
                            support (the org's support desk conversations, a thread each). Empty
                            means summary, announcement and drafts: support goes only where it is
                            named.
                          items:
                            type: string
                          type: array
                        name:
                          description: Name is an optional label, e.g. "community".
                          type: string
                        teamID:
                          description: TeamID is the workspace (one of the org's Workspaces).
                          type: string
                      required:
                      - channelID
                      - teamID
                      type: object
                    type: array
                  postVideos:
                    description: |-
                      PostVideos is whether videos went to the single-workspace channel;
                      omitted means yes.
                    type: boolean
                  teamID:
                    description: |-
                      TeamID and TeamName are the single-workspace connection (its token in
                      Secret SlackBotSecret).
                    type: string
                  teamName:
                    type: string
                  workspaces:
                    description: Workspaces are the connected workspaces, each with
                      its own bot token.
                    items:
                      description: SlackWorkspace is one Slack workspace connected
                        to the installation's app.
                      properties:
                        connectedAt:
                          format: date-time
                          type: string
                        connectedBy:
                          description: ConnectedBy is who connected it, and ConnectedAt
                            when.
                          type: string
                        teamID:
                          description: TeamID and TeamName identify the workspace.
                          type: string
                        teamName:
                          type: string
                        tokenSecret:
                          description: TokenSecret is the Secret in the org's namespace
                            holding the bot token (key token).
                          type: string
                      required:
                      - teamID
                      - tokenSecret
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - teamID
                    x-kubernetes-list-type: map
                type: object
              storage:
                description: |-
                  Storage is the org's own storage policies (infrared-docs-internal ADR
                  0087), which platform admins write: each replaces the platform's
                  (Installation.spec.storage) for its kind, for this org's files alone.
                  Unset, the platform's apply.
                properties:
                  policies:
                    description: |-
                      Policies are the org's own policies, one per kind: each replaces the
                      platform's for its kind, whole, for this org's files alone. Deleting
                      one returns the kind to the platform's. Other is the platform's alone.
                    items:
                      description: |-
                        StoragePolicy is what keeps or deletes one kind of file, how many copies of
                        it there are, and whether new ones may be written. Each kind takes its own
                        fields (ADR 0087 D8): images, charts and artifacts keepTags, keepNewest,
                        deleteUntagged and copies; snapshots and other expireAfter and copies; the
                        media kinds expireAfter, copies and writes. A field left unset keeps what
                        the store does today.
                      properties:
                        copies:
                          description: |-
                            Copies is how many copies of each new file the stores keep, 1 to 3,
                            and at most the number of volume servers. Unset keeps the bucket's
                            own: two, or one on a single node.
                          format: int32
                          maximum: 3
                          minimum: 1
                          type: integer
                        deleteUntagged:
                          description: |-
                            DeleteUntagged is whether Zot deletes an image no tag names, the
                            install-wide untaggedAfter after it lost its last tag. Unset is true,
                            as today. Registry kinds only.
                          type: boolean
                        expireAfter:
                          description: |-
                            ExpireAfter is how long a file of the kind is kept after it is written:
                            never (unset), 7d, 30d, 90d or 1y. SeaweedFS writes it into the file's
                            volume, so a file keeps the expiry it was written with: shortening one
                            frees nothing until the files written after it age out, and no later
                            change saves a file written under it. Not for a registry kind. A
                            snapshots expiry spares golden snapshots and tags. Other's is the age
                            past which the filer's own log is pruned.
                          enum:
                          - ""
                          - 7d
                          - 30d
                          - 90d
                          - 1y
                          type: string
                        keepNewest:
                          description: |-
                            KeepNewest is how many of each repository's most recently pushed tags
                            are kept, whatever their names: 0 keeps none for being new. Registry
                            kinds only.
                          format: int32
                          maximum: 1000
                          minimum: 0
                          type: integer
                        keepTags:
                          description: |-
                            KeepTags are regular expressions (RE2, as Zot reads them): a tag that
                            matches one is kept in every repository of the kind. A tag that
                            matches none, and is not among its repository's keepNewest newest, is
                            deleted at Zot's next garbage collection. With neither keepTags nor
                            keepNewest, Zot keeps every tag. Registry kinds only.
                          items:
                            maxLength: 200
                            minLength: 1
                            pattern: ^[ -~]+$
                            type: string
                          maxItems: 20
                          type: array
                          x-kubernetes-list-type: atomic
                        kind:
                          description: Kind is what the policy governs.
                          enum:
                          - images
                          - charts
                          - artifacts
                          - snapshots
                          - summary-videos
                          - incident-videos
                          - pictures
                          - other
                          type: string
                        updatedAt:
                          description: UpdatedAt is when they set it.
                          format: date-time
                          type: string
                        updatedBy:
                          description: UpdatedBy is the login of the person who last
                            set the policy.
                          maxLength: 254
                          type: string
                        writes:
                          description: |-
                            Writes false makes the kind's prefix take no new file; reads and
                            deletes go on. Unset is true. Media kinds only.
                          type: boolean
                      required:
                      - kind
                      type: object
                      x-kubernetes-validations:
                      - message: 'keepTags, keepNewest and deleteUntagged are for
                          a registry kind: images, charts or artifacts'
                        rule: self.kind in ['images', 'charts', 'artifacts'] || (!has(self.keepTags)
                          && !has(self.keepNewest) && !has(self.deleteUntagged))
                      - message: 'images, charts and artifacts take no expireAfter:
                          Zot''s retention keeps or deletes them by tag (ADR 0087
                          D10)'
                        rule: '!(self.kind in [''images'', ''charts'', ''artifacts''])
                          || !has(self.expireAfter)'
                      - message: 'writes is for a media kind: summary-videos, incident-videos
                          or pictures'
                        rule: self.kind in ['summary-videos', 'incident-videos', 'pictures']
                          || !has(self.writes)
                    maxItems: 7
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: 'other is SeaweedFS''s own files, the platform''s alone:
                        an org''s policies leave it out'
                      rule: self.all(p, p.kind != 'other')
                type: object
              summaryVideos:
                description: |-
                  SummaryVideos turns on a short summary video for each Change that
                  finishes or stops (a narrated title card, a scene per step, a sign-off
                  card). Off by default: each video spends a few cents of model credit.
                properties:
                  enabled:
                    description: Enabled makes a summary video for each Change that
                      finishes or stops.
                    type: boolean
                  monthlyCapUSD:
                    description: |-
                      MonthlyCapUSD stops making videos once this calendar month's videos
                      have cost this much, as a decimal string. Empty means $5.
                    pattern: ^[0-9]+(\.[0-9]{1,2})?$
                    type: string
                  owner:
                    description: |-
                      Owner is the org's announcement presenter as it was first set, under
                      the name product owner. It is read as Presenter while Presenter is
                      unset, and infrared-operator copies it to Presenter.

                      Deprecated: use Presenter (ADR 0049 D6, revised 2026-10-14).
                    properties:
                      consentAt:
                        format: date-time
                        type: string
                      consentBy:
                        description: |-
                          ConsentBy is who confirmed they are this person or have their
