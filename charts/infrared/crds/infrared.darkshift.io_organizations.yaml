---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: organizations.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Organization
    listKind: OrganizationList
    plural: organizations
    shortNames:
    - irorg
    singular: organization
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.platform
      name: Platform
      type: boolean
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Organization is an Infrared org.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'OrganizationSpec defines an org: the tenancy and RBAC boundary
              in Infrared.'
            properties:
              announcements:
                description: |-
                  Announcements configures announcement drafting (release notes, blog,
                  newsletter, social posts). Drafts go to the org's Slack channel; nothing
                  is published.
                properties:
                  accounts:
                    description: |-
                      Accounts are the social accounts drafts are written for. They may be
                      pretend accounts while the org practises: Infrared never posts to them.
                    items:
                      description: SocialAccount is one account announcement drafts
                        are written for.
                      properties:
                        handle:
                          description: Handle, e.g. @zippy.
                          minLength: 1
                          type: string
                        network:
                          description: Network, e.g. x, linkedin, bluesky, mastodon.
                          minLength: 1
                          type: string
                        voice:
                          description: Voice is how posts on this account should sound.
                          type: string
                      required:
                      - handle
                      - network
                      type: object
                    type: array
                type: object
              buildRegistry:
                description: |-
                  BuildRegistry is the Registry, in the org's namespace, its Products
                  build into; empty means the install's own registry (infrared-docs-internal
                  ADR 0033). A Product follows it from its next scaffold; images already
                  released stay where they are.
                maxLength: 253
                type: string
              clusterAllowlist:
                description: Clusters this org may deliver zones to. Managed by the
                  platform org.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              displayName:
                minLength: 1
                type: string
              modelTiers:
                description: |-
                  ModelTiers overrides the Installation's tier-to-model mapping for this
                  org. Unset fields use the Installation's.
                properties:
                  balanced:
                    type: string
                  fast:
                    type: string
                  frontier:
                    type: string
                type: object
              platform:
                description: Platform marks the org that administers the control plane.
                type: boolean
              scheduling:
                description: |-
                  Scheduling turns on AgentWorkflows' cron triggers for the org. Off by
                  default: scheduled runs spend model tokens every day.
                properties:
                  enabled:
                    description: Enabled starts runs on the AgentWorkflows' cron schedules.
                    type: boolean
                  timeZone:
                    description: TimeZone the cron schedules are read in, e.g. America/New_York;
                      empty means UTC.
                    type: string
                required:
                - enabled
                type: object
              slack:
                description: |-
                  Slack is the org's Slack workspace connection: the workspace, and the
                  channel product announcements and summary videos go to. The bot token
                  lives in Secret SlackBotSecret in the org's namespace.
                properties:
                  channelID:
                    description: ChannelID and ChannelName are the single-workspace
                      announcements channel.
                    type: string
                  channelName:
                    type: string
                  connectedAt:
                    format: date-time
                    type: string
                  connectedBy:
                    description: ConnectedBy is who connected the single workspace,
                      and ConnectedAt when.
                    type: string
                  destinations:
                    description: Destinations are where Infrared posts about the org's
                      Products, and what.
                    items:
                      description: SlackDestination is a channel in a connected workspace
                        and what goes there.
                      properties:
                        channelID:
                          description: ChannelID is the Slack channel ID, e.g. C0123456789.
                          minLength: 1
                          type: string
                        channelName:
                          description: 'ChannelName is the channel''s name without
                            the #, for display.'
                          type: string
                        kinds:
                          description: |-
                            Kinds are what is posted there: summary (summary videos), announcement
                            (product owner announcements), drafts (announcement and GTM drafts).
                            Empty means all of them.
                          items:
                            type: string
                          type: array
                        name:
                          description: Name is an optional label, e.g. "community".
                          type: string
                        teamID:
                          description: TeamID is the workspace (one of the org's Workspaces).
                          type: string
                      required:
                      - channelID
                      - teamID
                      type: object
                    type: array
                  postVideos:
                    description: |-
                      PostVideos is whether videos went to the single-workspace channel;
                      omitted means yes.
                    type: boolean
                  teamID:
                    description: |-
                      TeamID and TeamName are the single-workspace connection (its token in
                      Secret SlackBotSecret).
                    type: string
                  teamName:
                    type: string
                  workspaces:
                    description: Workspaces are the connected workspaces, each with
                      its own bot token.
                    items:
                      description: SlackWorkspace is one Slack workspace connected
                        to the installation's app.
                      properties:
                        connectedAt:
                          format: date-time
                          type: string
                        connectedBy:
                          description: ConnectedBy is who connected it, and ConnectedAt
                            when.
                          type: string
                        teamID:
                          description: TeamID and TeamName identify the workspace.
                          type: string
                        teamName:
                          type: string
                        tokenSecret:
                          description: TokenSecret is the Secret in the org's namespace
                            holding the bot token (key token).
                          type: string
                      required:
                      - teamID
                      - tokenSecret
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - teamID
                    x-kubernetes-list-type: map
                type: object
              summaryVideos:
                description: |-
                  SummaryVideos turns on a short summary video for each Change that
                  finishes or stops (a narrated title card, a scene per step, a sign-off
                  card). Off by default: each video spends a few cents of model credit.
                properties:
                  enabled:
                    description: Enabled makes a summary video for each Change that
                      finishes or stops.
                    type: boolean
                  monthlyCapUSD:
                    description: |-
                      MonthlyCapUSD stops making videos once this calendar month's videos
                      have cost this much, as a decimal string. Empty means $5.
                    pattern: ^[0-9]+(\.[0-9]{1,2})?$
                    type: string
                  owner:
                    description: |-
                      Owner is the product owner a product owner announcement opens with:
                      their image is kept by the API (never at a public URL), with consent.
                    properties:
                      consentAt:
                        format: date-time
                        type: string
                      consentBy:
                        description: |-
                          ConsentBy is who confirmed they are this person or have their
                          permission to animate the image, and ConsentAt when.
                        type: string
                      contentType:
                        description: 'ContentType is the image''s type: image/png
                          or image/jpeg.'
                        type: string
                      name:
                        description: Name and Title go on the announcement's lower
                          third.
                        type: string
                      title:
                        type: string
                    required:
                    - consentAt
                    - consentBy
                    - contentType
                    - name
                    type: object
                  timeZone:
                    description: |-
                      TimeZone is the IANA zone a video's greeting uses for the day and time
                      of day the Change finished, e.g. "America/New_York" (the default).
                    type: string
                type: object
              teams:
                description: |-
                  Teams give people access to the org, by GitHub login. The platform
                  admin and API tokens have full access without a team.
                items:
                  description: Team is a named group of people with one role in the
                    org.
                  properties:
                    description:
                      type: string
                    members:
                      description: Members by GitHub login.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    name:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    role:
                      enum:
                      - platform-admin
                      - org-admin
                      - member
                      - viewer
                      type: string
                  required:
                  - name
                  - role
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - displayName
            type: object
          status:
            description: OrganizationStatus is the observed state of an org.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespace:
                description: Namespace that holds the org's resources, ir-org-<name>.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: org names are at most 56 characters so ir-org-<name> fits a namespace
          rule: size(self.metadata.name) <= 56
        - message: 'this name is one of the reserved organization names: Infrared,
            the platform and the install''s registry use them (ReservedOrgNames)'
          rule: '!(self.metadata.name in [''platform'', ''infrared'', ''argocd'',
            ''builds'', ''build-credentials'', ''default'', ''system'', ''admin'',
            ''root'', ''public'', ''public-docs'', ''cert-manager'', ''kpack'', ''monitoring'',
            ''products'', ''new''])'
    served: true
    storage: true
    subresources:
      status: {}
