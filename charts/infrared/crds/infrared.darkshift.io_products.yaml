---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: products.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Product
    listKind: ProductList
    plural: products
    shortNames:
    - irproduct
    singular: product
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.currentRelease
      name: Release
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Product is the unit Infrared builds, releases and manages change
          for.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'ProductSpec defines a Product: one or more repos released
              together.'
            properties:
              currentRelease:
                description: CurrentRelease is the release in progress, e.g. "2.4".
                type: string
              delivery:
                description: |-
                  Delivery is how the Product's releases ship: which build they come from
                  and the zones they are promoted through, in order. Without it Infrared
                  starts no releases for the Product.
                properties:
                  buildImage:
                    description: |-
                      BuildImage is the kpack Image in namespace builds that builds Repo;
                      empty means the Product's name.
                    type: string
                  repo:
                    description: |-
                      Repo is the Product repo whose commits are released; empty means the
                      first repo. Releases tag this repo vX.Y.Z.
                    type: string
                  zones:
                    description: |-
                      Zones in promotion order. A release reaches a zone only after every
                      zone before it runs it Healthy.
                    items:
                      description: DeliveryZone is one zone a release is promoted
                        to.
                      properties:
                        applicationPath:
                          description: |-
                            ApplicationPath is the zone's Argo CD Application in the gitops repo,
                            whose chart source is pinned to the release tag; empty means
                            registry/clusters/<cluster>/components/product-<zone>.yaml.
                          type: string
                        approval:
                          description: |-
                            Approval is auto (promote as soon as the zones before it are Healthy)
                            or human (wait for someone to approve the promotion). Empty means auto
                            for pre-release and human for release.
                          enum:
                          - auto
                          - human
                          type: string
                        environment:
                          default: pre-release
                          description: Environment is pre-release or release.
                          enum:
                          - pre-release
                          - release
                          type: string
                        name:
                          description: 'Name of the zone: its namespace, e.g. checkout-rc.'
                          minLength: 1
                          type: string
                        valuesPath:
                          description: |-
                            ValuesPath is the zone's values file in the gitops repo, holding the
                            image pin; empty means products/<product>/zones/<zone>/values.yaml.
                          type: string
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                required:
                - zones
                type: object
              description:
                type: string
              displayName:
                minLength: 1
                type: string
              logo:
                description: |-
                  Logo says where the Product's logo lives. Omit it to detect the logo in
                  the first repo.
                properties:
                  path:
                    description: |-
                      Path pins the logo to one file in the repo, e.g. "docs/brand/logo.svg".
                      Empty means detect it from the usual places (logo.svg, .github/logo.png, ...).
                    type: string
                  repo:
                    description: |-
                      Repo is the name of one of spec.repos that holds the logo; empty means
                      the first entry of spec.repos.
                    type: string
                type: object
              repos:
                items:
                  description: ProductRepo is one git repo that makes up a Product.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    owner:
                      description: Owner is the provider org; empty means the org's
                        GitProvider owner.
                      type: string
                    role:
                      default: app
                      description: Role of the repo in the Product.
                      enum:
                      - app
                      - chart
                      - umbrella
                      - library
                      - docs
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              slos:
                description: |-
                  SLOs are the Product's service level objectives. Infrared records
                  each one's error ratio in VictoriaMetrics and alerts when the error
                  budget burns too fast; alerts open Incidents.
                items:
                  description: SLO is one service level objective, measured per zone.
                  properties:
                    description:
                      description: Description says what the objective promises, in
                        plain words.
                      type: string
                    indicator:
                      description: Indicator is how good and bad events are counted.
                      properties:
                        availability:
                          description: Availability counts failed requests against
                            all requests.
                          properties:
                            errors:
                              default: code=~"5.."
                              description: Errors is the label matcher that marks
                                a failed request.
                              type: string
                            filter:
                              description: |-
                                Filter narrows which requests count, as label matchers, e.g.
                                route!="/metrics". Matchers are comma-separated, without braces.
                              type: string
                            metric:
                              description: Metric is the request counter, e.g. http_requests_total.
                              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                              type: string
                          required:
                          - metric
                          type: object
                        latency:
                          description: Latency counts requests slower than a threshold
                            against all requests.
                          properties:
                            filter:
                              description: Filter narrows which requests count, as
                                comma-separated label matchers.
                              type: string
                            histogram:
                              description: |-
                                Histogram is the histogram's base name, e.g. http_request_duration_seconds;
                                its _bucket and _count series are read.
                              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                              type: string
                            threshold:
                              description: 'Threshold is a bucket boundary (le) in
                                seconds: requests at or under it are good, e.g. "0.25".'
                              pattern: ^[0-9]+(\.[0-9]+)?$
                              type: string
                          required:
                          - histogram
                          - threshold
                          type: object
                      type: object
                    name:
                      description: Name, e.g. availability or latency.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    objective:
                      description: Objective is the target share of good events, in
                        percent, e.g. "99.5".
                      pattern: ^(100|[0-9]{1,2}(\.[0-9]{1,3})?)$
                      type: string
                    window:
                      default: 168h
                      description: |-
                        Window the objective is measured over; the error budget is 100% minus
                        the objective over this window. It must fit in the metrics retention.
                      type: string
                    zones:
                      description: Zones the objective applies to; empty means every
                        delivery zone.
                      items:
                        type: string
                      type: array
                  required:
                  - indicator
                  - name
                  - objective
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              statusPage:
                description: StatusPage configures the Product's status page.
                properties:
                  public:
                    description: |-
                      Public serves the page to anyone at /status/<org>/<product>, signed in
                      or not. It shows zone status, SLO attainment and incidents, nothing else.
                    type: boolean
                  zones:
                    description: Zones shown; empty means the release zones.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - displayName
            - repos
            type: object
          status:
            description: ProductStatus is the observed state of a Product.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              logo:
                description: Logo is the Product's logo; absent when none was found.
                properties:
                  bytes:
                    description: Bytes is the logo's size.
                    format: int64
                    type: integer
                  contentType:
                    description: ContentType is the logo's media type, e.g. image/svg+xml.
                    type: string
                  message:
                    description: Message is the last logo error in plain words; empty
                      when the last sync worked.
                    type: string
                  path:
                    description: Path of the logo in the repo.
                    type: string
                  pending:
                    description: Pending is true while an upload is staged and not
                      yet committed to the repo.
                    type: boolean
                  repo:
                    description: Repo the logo was read from.
                    type: string
                  sha:
                    description: SHA is the git blob sha of the logo.
                    type: string
                  source:
                    description: Source says whether the logo was detected in the
                      repo or uploaded through Infrared.
                    enum:
                    - detected
                    - uploaded
                    type: string
                  syncedAt:
                    description: SyncedAt is when the cached logo was last written
                      from git.
                    format: date-time
                    type: string
                required:
                - bytes
                - contentType
                - path
                - repo
                - sha
                - source
                type: object
              observability:
                description: Observability reports the alerting rules Infrared keeps
                  for the SLOs.
                properties:
                  message:
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  ready:
                    description: Ready is true when the rules match the SLOs.
                    type: boolean
                  rules:
                    description: Rules is the VMRule holding the recording and alerting
                      rules.
                    type: string
                required:
                - ready
                type: object
              observedGeneration:
                format: int64
                type: integer
              zones:
                description: |-
                  Zones is what each delivery zone runs, as recorded by the Releases
                  that promoted to it.
                items:
                  description: ZoneState is what a zone runs now.
                  properties:
                    image:
                      description: Image is the pin the zone runs, repository:tag@sha256:...
                      type: string
                    name:
                      type: string
                    promotedAt:
                      description: PromotedAt is when that release became Healthy
                        in the zone.
                      format: date-time
                      type: string
                    release:
                      description: Release is the Release that last promoted to the
                        zone.
                      type: string
                    version:
                      description: Version is the release the zone runs, e.g. v0.1.1.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
