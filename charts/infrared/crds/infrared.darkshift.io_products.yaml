---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: products.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Product
    listKind: ProductList
    plural: products
    shortNames:
    - irproduct
    singular: product
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.currentRelease
      name: Release
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Product is the unit Infrared builds, releases and manages change
          for.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'ProductSpec defines a Product: one or more repos released
              together.'
            properties:
              currentRelease:
                description: CurrentRelease is the release in progress, e.g. "2.4".
                type: string
              delivery:
                description: |-
                  Delivery is how the Product's releases ship: which build they come from
                  and the zones they are promoted through, in order. Without it Infrared
                  starts no releases for the Product.
                properties:
                  buildImage:
                    description: |-
                      BuildImage is the kpack Image in namespace builds that builds Repo;
                      empty means the Product's name.
                    type: string
                  charts:
                    description: |-
                      Charts says where an umbrella release's images and chart go: the
                      release and chart registries, the chart it wraps, its first version.
                      Read for a Product with a control plane zone, which needs it.
                    properties:
                      buildsNamespace:
                        description: |-
                          BuildsNamespace holds the kpack Images that build the components.
                          Infrared reads them and never changes them. Empty means infrared-builds.
                        type: string
                      chartRegistry:
                        description: |-
                          ChartRegistry is the OCI repository the umbrella chart is published
                          to, without oci://.
                        minLength: 1
                        type: string
                      firstVersion:
                        description: |-
                          FirstVersion is the umbrella's first release version when it has
                          none yet. Later versions add one to its last number.
                        pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                        type: string
                      historyFrom:
                        description: |-
                          HistoryFrom is the subchart's oldest release recorded in the
                          Product's history: each of its git tags from this one on becomes a
                          recorded Release.
                        type: string
                      releaseRegistry:
                        description: |-
                          ReleaseRegistry is where released images are copied to, by digest,
                          tagged with the release version, e.g.
                          us-central1-docker.pkg.dev/darkshift-preprod/infrared.
                        minLength: 1
                        type: string
                      subchart:
                        description: |-
                          Subchart is the chart the umbrella wraps, whose values the umbrella
                          nests under its name.
                        properties:
                          name:
                            description: Name is the subchart's chart name, e.g. infrared-core.
                            minLength: 1
                            type: string
                          path:
                            description: Path is the chart's folder in Repo. Empty
                              means charts/<name>.
                            type: string
                          repo:
                            description: Repo is the git repo that holds it, among
                              spec.repos.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - repo
                        type: object
                    required:
                    - chartRegistry
                    - firstVersion
                    - releaseRegistry
                    - subchart
                    type: object
                  components:
                    description: |-
                      Components are the parts an umbrella release pins, one per image, each
                      built by its own kpack Image in charts.buildsNamespace or carried from
                      release to release. Read for a Product with a control plane zone; any
                      other umbrella Product pins one image per repo (ADR 0046 phase 5).
                    items:
                      description: PlatformComponent is one part of a platform Product.
                      properties:
                        buildImage:
                          description: |-
                            BuildImage is the kpack Image in the builds namespace. Empty means the
                            component is not built here: its pin is carried from release to
                            release.
                          type: string
                        name:
                          description: Name, e.g. operator.
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        repo:
                          description: Repo is the component's repo among spec.repos.
                          minLength: 1
                          type: string
                        repository:
                          description: |-
                            Repository is the image repository under the release registry. Empty
                            means infrared-<name>.
                          type: string
                        valuesKey:
                          description: |-
                            ValuesKey is the subchart values key that pins the image,
                            <key>.image.tag and <key>.image.digest. Empty means the name.
                          type: string
                      required:
                      - name
                      - repo
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  repo:
                    description: |-
                      Repo is the Product repo whose commits are released; empty means the
                      first repo. Releases tag this repo vX.Y.Z.
                    type: string
                  scaffold:
                    description: |-
                      Scaffold has Infrared write the Product's build, a generic web chart and
                      its zones' files into the gitops repo, then start its first Release.
                    properties:
                      kind:
                        description: 'Kind of app: static (files served by nginx),
                          node or go.'
                        enum:
                        - static
                        - node
                        - go
                        type: string
                      root:
                        description: Root is the directory of a static site within
                          the repo; empty means the top.
                        type: string
                    required:
                    - kind
                    type: object
                  strategy:
                    description: |-
                      Strategy is isolated (the default: a Release ships one commit of Repo
                      and pins its image into each zone's chart) or umbrella (a Release ships
                      one version of the Product's umbrella chart in its org's charts repo,
                      each repo's newest build changed or its previous pin carried, and each
                      zone deploys that chart version) (ADR 0046 D2).
                    enum:
                    - isolated
                    - umbrella
                    type: string
                  zones:
                    description: |-
                      Zones in promotion order. A release reaches a zone only after every
                      zone before it runs it Healthy.
                    items:
                      description: DeliveryZone is one zone a release is promoted
                        to.
                      properties:
                        addresses:
                          description: |-
                            Addresses the zone is also served at, beyond its address on the platform
                            domain: a name under a domain the org can use (its own verified Domains,
                            the platform org's shared ones, or the platform domain). Who can open
                            them follows the zone's access.
                          items:
                            description: 'ZoneAddress is one more address of a zone:
                              name.domain, or domain itself.'
                            properties:
                              domain:
                                description: Domain, e.g. acme.com or acme.darkshift.io.
                                pattern: ^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
                                type: string
                              name:
                                description: |-
                                  Name under the domain, e.g. www or shop; empty is the domain itself.
                                  It may hold more than one label (docs.infrared under darkshift.io) only
                                  under the platform org's managed root, which the API enforces.
                                pattern: ^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*)?$
                                type: string
                              redirect:
                                description: |-
                                  Redirect sends visitors to the zone's first address that doesn't
                                  redirect (a permanent redirect that keeps the path), e.g. www to the
                                  bare domain.
                                type: boolean
                            required:
                            - domain
                            type: object
                          maxItems: 10
                          type: array
                        applicationPath:
                          description: |-
                            ApplicationPath is the zone's Argo CD Application in the gitops repo,
                            whose chart source is pinned to the release tag; empty means
                            registry/clusters/<cluster>/components/product-<zone>.yaml.
                          type: string
                        approval:
                          description: |-
                            Approval is auto (promote as soon as the zones before it are Healthy)
                            or human (wait for someone to approve the promotion). Empty means auto
                            for pre-release and human for release.
                          enum:
                          - auto
                          - human
                          type: string
                        cluster:
                          description: |-
                            Cluster is the Cluster the zone runs on; empty means the gitops repo's
                            management cluster. The Cluster must be on the org's cluster allowlist.
                          type: string
                        controlPlane:
                          description: ControlPlane are the upgrade's settings for
                            a control plane zone.
                          properties:
                            application:
                              description: |-
                                Application is the Argo CD Application that installs the chart.
                                Empty means infrared.
                              type: string
                            guardTimeout:
                              description: |-
                                GuardTimeout is how long the upgrade guard waits for every check to
                                pass before it rolls the upgrade back. Empty means 15m.
                              type: string
                          type: object
                        env:
                          description: |-
                            Env are the zone's plain environment variables, written to its values
                            file in the gitops repo (so they're reviewed and versioned like the rest).
                          items:
                            description: ZoneEnvVar is one plain environment variable
                              of a zone.
                            properties:
                              name:
                                description: Name, a C identifier such as API_URL.
                                maxLength: 128
                                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                type: string
                              value:
                                maxLength: 32768
                                type: string
                            required:
                            - name
                            type: object
                          maxItems: 100
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        environment:
                          default: pre-release
                          description: Environment is pre-release or release.
                          enum:
                          - pre-release
                          - release
                          type: string
                        guard:
                          description: |-
                            Guard is the zone's release guard (ADR 0046): after a Release reaches
                            the zone, the zone must run it Synced and Healthy, pass every check and
                            stay that way for the hold before the Release moves on. Empty means a
                            hold of 5 minutes, Verify as the only check, and notify.
                          properties:
                            checks:
                              description: |-
                                Checks are HTTP checks the zone must pass, after Verify when both are
                                set. Each is tried up to three times, 30 seconds apart, after its soak,
                                and once more at the end of the hold.
                              items:
                                description: |-
                                  ZoneVerify is an HTTP smoke check of a zone, made by the operator from inside
                                  the management cluster.
                                properties:
                                  contains:
                                    description: Contains is text the response body
                                      must contain.
                                    type: string
                                  expectStatus:
                                    description: ExpectStatus is the HTTP status that
                                      passes; 0 means 200.
                                    format: int32
                                    type: integer
                                  soak:
                                    description: Soak is how long the zone must stay
                                      Healthy before the check; empty means 2m.
                                    type: string
                                  url:
                                    description: URL to GET, e.g. http://zippy.zippy-rc.svc/healthz
                                      or the zone's public URL.
                                    pattern: ^https?://
                                    type: string
                                required:
                                - url
                                type: object
                              maxItems: 10
                              type: array
                            hold:
                              description: |-
                                Hold is how long the zone must stay Synced and Healthy on the Release,
                                its checks passing, before the Release moves on: empty means 5m, 0s
                                none.
                              type: string
                            rollback:
                              description: |-
                                Rollback is what the guard does when the zone fails it. rollback puts
                                back what the zone ran before, through a pull request to the gitops
                                repo, and stops the Release there; notify reports the failure and leaves
                                the zone on the new release. Neither touches data: volumes, databases
                                and buckets keep what the new release wrote. Empty means notify; the
                                API sets rollback on a zone it adds (ADR 0046).
                              enum:
                              - notify
                              - rollback
                              type: string
                          type: object
                        name:
                          description: 'Name of the zone: its namespace, e.g. checkout-rc.'
                          minLength: 1
                          type: string
                        preview:
                          description: |-
                            Preview gives the zone a URL, https://<zone>.<installation previews domain>,
                            behind Infrared sign-in.
                          type: boolean
                        primaryAddress:
                          description: |-
                            PrimaryAddress is the address the zone is opened at in Infrared (its
                            tile, its picture, its main link): custom, the first of Addresses that
                            doesn't redirect, while it serves; or automatic, the zone's address on
                            the platform domain. Empty means custom.
                          enum:
                          - custom
                          - automatic
                          type: string
                        public:
                          description: |-
                            Public opens a preview zone to anyone, without Infrared sign-in. Only
                            org admins may set it. It applies to preview zones on the management
                            cluster, whose chart honours preview.public.
                          type: boolean
                        replicas:
                          description: |-
                            Replicas is how many pods run the app in the zone; empty leaves the
                            chart's default.
                          format: int32
                          maximum: 20
                          minimum: 0
                          type: integer
                        resources:
                          description: Resources reserved for each of the app's pods;
                            empty leaves the chart's defaults.
                          properties:
                            cpu:
                              description: CPU requested, e.g. 100m or 1.
                              pattern: ^([0-9]+m|[0-9]+(\.[0-9]+)?)$
                              type: string
                            memory:
                              description: Memory requested and its limit, e.g. 256Mi
                                or 1Gi.
                              pattern: ^[0-9]+(Mi|Gi)$
                              type: string
                          type: object
                        secretEnv:
                          description: |-
                            SecretEnv names the zone's secret environment variables. Their values
                            never reach git: they live in the Secret <product>-<zone>-env in the org's
                            namespace, which Infrared copies into the zone's namespace as
                            <product>-env, and the app reads them with envFrom.
                          items:
                            description: |-
                              ZoneSecretEnv names one secret environment variable of a zone; its value is
                              in the zone's env Secret, never in the spec.
                            properties:
                              name:
                                maxLength: 128
                                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                type: string
                            required:
                            - name
                            type: object
                          maxItems: 100
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        storage:
                          description: |-
                            Storage is persistent volumes mounted into the app. Each zone has its own;
                            removing one from the list leaves its data in the cluster.
                          items:
                            description: ZoneVolume is a persistent volume mounted
                              into the app.
                            properties:
                              mountPath:
                                description: MountPath is where the app sees it, e.g.
                                  /data.
                                pattern: ^/[A-Za-z0-9._/-]*$
                                type: string
                              name:
                                description: Name of the volume, unique in the zone.
                                pattern: ^[a-z0-9]([-a-z0-9]{0,28}[a-z0-9])?$
                                type: string
                              size:
                                description: Size, e.g. 1Gi.
                                pattern: ^[0-9]+(Mi|Gi)$
                                type: string
                            required:
                            - mountPath
                            - name
                            - size
                            type: object
                          maxItems: 8
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        target:
                          description: |-
                            Target is what the zone deploys to: empty for a namespace of the
                            Product's, or controlPlane, the install's own control plane (ADR 0046
                            D5). A release upgrades the control plane to the umbrella chart's
                            version behind the upgrade guard, a Job running the operator that was
                            there before, which rolls a bad upgrade back. Only the install's
                            platform org may hold such a zone, as the Product's one zone, with
                            umbrella delivery, components and charts. The zone's name is the
                            management cluster's, unless cluster names it; its checks (verify and
                            guard.checks) are the guard's own HTTP checks.
                          enum:
                          - controlPlane
                          type: string
                        valuesPath:
                          description: |-
                            ValuesPath is the zone's values file in the gitops repo, holding the
                            image pin; empty means products/<product>/zones/<zone>/values.yaml.
                          type: string
                        verify:
                          description: |-
                            Verify is a smoke check that must pass after Argo CD reports the zone
                            Healthy, before the Release moves on to the next zone. It is the release
                            guard's first check; guard.checks adds more.
                          properties:
                            contains:
                              description: Contains is text the response body must
                                contain.
                              type: string
                            expectStatus:
                              description: ExpectStatus is the HTTP status that passes;
                                0 means 200.
                              format: int32
                              type: integer
                            soak:
                              description: Soak is how long the zone must stay Healthy
                                before the check; empty means 2m.
                              type: string
                            url:
                              description: URL to GET, e.g. http://zippy.zippy-rc.svc/healthz
                                or the zone's public URL.
                              pattern: ^https?://
                              type: string
                          required:
                          - url
                          type: object
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: controlPlane belongs to a zone whose target is controlPlane
                        rule: '!has(self.controlPlane) || (has(self.target) && self.target
                          == ''controlPlane'')'
                    minItems: 1
                    type: array
                required:
                - zones
                type: object
              description:
                type: string
              displayName:
                minLength: 1
                type: string
              humanApprovals:
                description: |-
                  HumanApprovals says whether people approve the Product's Changes and
                  promotions. When false, the human steps of its AgentWorkflowRuns (triage
                  and approval) and its zones that take Releases after approval approve
                  themselves. A reviewer's BLOCK, a failed step and a dead-lettered step
                  still stop and wait for a person. Omitted means true.
                type: boolean
              kind:
                description: |-
                  Kind is app (the default) or platform: Infrared itself, released as
                  one version of an umbrella chart and delivered by upgrading the
                  control plane (ADR 0038). Only the platform org may have one.
                  Deprecated: nothing sets it since ADR 0046 phase 5. A Product with
                  umbrella delivery and a zone whose target is controlPlane does what
                  platform did; a platform Product may be converted to one, which clears
                  kind and platform.
                enum:
                - app
                - platform
                type: string
              logo:
                description: |-
                  Logo says where the Product's logo lives. Omit it to detect the logo in
                  the first repo.
                properties:
                  path:
                    description: |-
                      Path pins the logo to one file in the repo, e.g. "docs/brand/logo.svg".
                      Empty means detect it from the usual places (logo.svg, .github/logo.png, ...).
                    type: string
                  repo:
                    description: |-
                      Repo is the name of one of spec.repos that holds the logo; empty means
                      the first entry of spec.repos.
                    type: string
                type: object
              owner:
                description: |-
                  Owner is the Product's product owner: a Human's name in the org. A
                  product owner announcement uses their presenter image, name and job
                  role, and their avatar's voice (infrared-docs-internal ADR 0049 D6).
                  Without one, no announcement is made.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              platform:
                description: |-
                  Platform says how a platform Product is built, released and delivered.
                  Deprecated: see Kind; spec.delivery's components, charts and control
                  plane zone replace it (ADR 0046 phase 5).
                properties:
                  buildsNamespace:
                    default: infrared-builds
                    description: |-
                      BuildsNamespace holds the kpack Images that build the components.
                      Infrared reads them and never changes them.
                    type: string
                  chartRegistry:
                    description: |-
                      ChartRegistry is the OCI repository the umbrella chart is published
                      to, without oci://, e.g. us-central1-docker.pkg.dev/darkshift-preprod/infrared/charts.
                    minLength: 1
                    type: string
                  components:
                    description: Components are the parts released together, one per
                      built image.
                    items:
                      description: PlatformComponent is one part of a platform Product.
                      properties:
                        buildImage:
                          description: |-
                            BuildImage is the kpack Image in the builds namespace. Empty means the
                            component is not built here: its pin is carried from release to
                            release.
                          type: string
                        name:
                          description: Name, e.g. operator.
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        repo:
                          description: Repo is the component's repo among spec.repos.
                          minLength: 1
                          type: string
                        repository:
                          description: |-
                            Repository is the image repository under the release registry. Empty
                            means infrared-<name>.
                          type: string
                        valuesKey:
                          description: |-
                            ValuesKey is the subchart values key that pins the image,
                            <key>.image.tag and <key>.image.digest. Empty means the name.
                          type: string
                      required:
                      - name
                      - repo
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  firstVersion:
                    description: |-
                      FirstVersion is the umbrella's first release version when it has
                      none yet, e.g. 0.1.0-rc.147. Later versions add one to its last
                      number.
                    pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                    type: string
                  historyFrom:
                    description: |-
                      HistoryFrom is the subchart's oldest release recorded in the
                      Product's history, e.g. 0.1.0-alpha.146: each of its git tags from
                      this one on becomes a recorded Release.
                    type: string
                  releaseRegistry:
                    description: |-
                      ReleaseRegistry is where released images are copied to, by digest,
                      tagged with the release version, e.g.
                      us-central1-docker.pkg.dev/darkshift-preprod/infrared.
                    minLength: 1
                    type: string
                  subchart:
                    description: |-
                      Subchart is the chart the umbrella wraps, whose values the umbrella
                      nests under its name.
                    properties:
                      name:
                        description: Name is the subchart's chart name, e.g. infrared-core.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the chart's folder in Repo. Empty means
                          charts/<name>.
                        type: string
                      repo:
                        description: Repo is the git repo that holds it, among spec.repos.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - repo
                    type: object
                  target:
                    description: Target is the control plane a release upgrades.
                    properties:
                      application:
                        default: infrared
                        description: Application is the Argo CD Application that installs
                          the chart.
                        type: string
                      cluster:
                        description: Cluster is the management cluster's name, as
                          the gitops repo knows it.
                        minLength: 1
                        type: string
                      guardTimeout:
                        default: 15m
                        description: |-
                          GuardTimeout is how long the upgrade guard waits for every check to
                          pass before it rolls the upgrade back.
                        type: string
                      verify:
                        description: |-
                          Verify are the checks the upgrade guard makes, besides Argo CD, the
                          Deployments and the gitops repo, before it calls an upgrade good.
                        items:
                          description: |-
                            ZoneVerify is an HTTP smoke check of a zone, made by the operator from inside
                            the management cluster.
                          properties:
                            contains:
                              description: Contains is text the response body must
                                contain.
                              type: string
                            expectStatus:
                              description: ExpectStatus is the HTTP status that passes;
                                0 means 200.
                              format: int32
                              type: integer
                            soak:
                              description: Soak is how long the zone must stay Healthy
                                before the check; empty means 2m.
                              type: string
                            url:
                              description: URL to GET, e.g. http://zippy.zippy-rc.svc/healthz
                                or the zone's public URL.
                              pattern: ^https?://
                              type: string
                          required:
                          - url
                          type: object
                        type: array
                    required:
                    - cluster
                    type: object
                required:
                - chartRegistry
                - components
                - firstVersion
                - releaseRegistry
                - subchart
                - target
                type: object
              providerRef:
                description: |-
                  ProviderRef names the GitProvider, in the org's namespace, that holds the
                  Product's repos: github or gitea. Empty means the org's forge (gitea when
                  the org has one, else github). It lets an org with two forges, such as a
                  platform org on Gitea that also connected a GitHub organization, keep
                  each Product on one of them. It cannot change once set.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: providerRef.name must be github or gitea
                  rule: self.name in ['github', 'gitea']
              repos:
                items:
                  description: ProductRepo is one git repo that makes up a Product.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    owner:
                      description: Owner is the provider org; empty means the org's
                        GitProvider owner.
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
