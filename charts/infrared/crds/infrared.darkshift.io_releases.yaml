---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: releases.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Release
    listKind: ReleaseList
    plural: releases
    shortNames:
    - irrel
    singular: release
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.productRef.name
      name: Product
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Release ships one commit of a Product: Infrared waits for its build, tags
          the repo and the image vX.Y.Z, and promotes the pin through the Product's
          delivery zones with a pull request to the gitops repo per zone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReleaseSpec asks Infrared to release one commit of a Product.
            properties:
              commit:
                description: |-
                  Commit to release, a full SHA on the delivery repo's default branch.
                  Empty means the branch's head when the Release starts.
                pattern: ^([0-9a-f]{40})?$
                type: string
              image:
                description: |-
                  Image says where the released image comes from. Empty means kpack's
                  build of the commit, as before.
                properties:
                  fromStep:
                    description: |-
                      FromStep releases an image that an AgentWorkflowRun step published to
                      the install's registry, in place of kpack's build: Infrared takes its
                      digest from the step's status.published, tags it with the version and
                      promotes it as it would a build.
                    properties:
                      ref:
                        description: |-
                          Ref is the image as the step's status.published lists it,
                          <registry>/<repository>@sha256:<hex>. Its repository alone also names
                          it when the step published one image there; empty means the step's one
                          image.
                        type: string
                      run:
                        description: Run is the AgentWorkflowRun, in the Release's
                          namespace.
                        minLength: 1
                        type: string
                      step:
                        description: Step is the run's step that published the image.
                        minLength: 1
                        type: string
                    required:
                    - run
                    - step
                    type: object
                type: object
              notes:
                description: |-
                  Notes for the GitHub release; empty means the commits since the
                  previous release.
                type: string
              productRef:
                description: LocalRef names another Infrared resource in the same
                  namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              recorded:
                description: |-
                  Recorded marks a release made outside Infrared, by hand: Infrared
                  fills its status from the chart's tag and never acts on it.
                type: boolean
              runRef:
                description: RunRef is the AgentWorkflowRun whose Change this Release
                  ships.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              version:
                description: |-
                  Version to release, vX.Y.Z. Empty means the next version after the
                  repo's newest vX.Y.Z tag: minor for a feat commit or a breaking change,
                  patch otherwise.
                pattern: ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)?$
                type: string
            required:
            - productRef
            type: object
          status:
            description: ReleaseStatus is the observed state of a Release.
            properties:
              attempts:
                description: 'Attempts counts how many times the Release has run:
                  1, plus one per retry.'
                format: int32
                type: integer
              build:
                description: |-
                  Build is the kpack Build that produced the image, or for an image a
                  step published, step <step> of AgentWorkflowRun <run>.
                type: string
              builtAt:
                description: BuiltAt is when the build was ready and its digest tagged
                  with the version.
                format: date-time
                type: string
              chart:
                description: Chart is the umbrella chart a platform Release published.
                properties:
                  commit:
                    description: Commit and Tag are the git commit and tag of the
                      chart's version.
                    type: string
                  name:
                    description: Name and Version are the chart's.
                    type: string
                  published:
                    description: Published is the pushed chart, oci://<registry>/<name>:<version>@sha256:...
                    type: string
                  publishedAt:
                    format: date-time
                    type: string
                  repo:
                    description: Repo is owner/name of the repo that holds the chart.
                    type: string
                  subchart:
                    description: Subchart and SubchartVersion are the chart the umbrella
                      wraps.
                    type: string
                  subchartVersion:
                    type: string
                  summary:
                    description: Summary is the release's one line.
                    type: string
                  tag:
                    type: string
                  url:
                    description: URL is the chart's version on the forge.
                    type: string
                  version:
                    type: string
                type: object
              commit:
                description: Commit is the commit this Release tags, resolved from
                  spec.commit.
                type: string
              components:
                description: |-
                  Components are a platform Release's components: each one's image and
                  commit, and whether it changed since the previous release.
                items:
                  description: ReleaseComponent is one component in a platform Release.
                  properties:
                    build:
                      description: Build is the kpack Build that made it.
                      type: string
                    changed:
                      description: |-
                        Changed is true when the Release carries a new image, false when it
                        keeps the previous release's.
                      type: boolean
                    commit:
                      description: Commit is the commit its image was built from,
                        when known.
                      type: string
                    commits:
                      description: |-
                        Commits counts the commits between the previous image's commit and
                        this one's, when both are known.
                      format: int32
                      type: integer
                    image:
                      description: Image is the released image, repository:tag@sha256:...
                      type: string
                    name:
                      type: string
                    previousImage:
                      description: PreviousImage is the previous release's image.
                      type: string
                    repo:
                      description: Repo is owner/name.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cutDispatched:
                description: CutDispatched is true once the release.cut event has
                  been sent.
                type: boolean
              cutRuns:
                description: |-
                  CutRuns are the AgentWorkflowRuns started when the tag was cut (the
                  org's enabled AgentWorkflows with a release.cut event trigger).
                items:
                  type: string
                type: array
              finishedAt:
                format: date-time
                type: string
              guard:
                description: Guard is the upgrade guard's Job.
                type: string
              image:
                description: Image is the released image, repository:version@sha256:...
                type: string
              message:
                description: Message says in plain words what the Release is doing
                  or waiting for.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ReleasePhase is where a Release is on its way to every
                  zone.
                enum:
                - Pending
                - Building
                - Tagged
                - Promoting
                - AwaitingApproval
                - Released
                - Failed
                type: string
              previousVersion:
                description: PreviousVersion is the newest release tag before this
                  one.
                type: string
              releaseURL:
                description: ReleaseURL is the GitHub release.
                type: string
              repo:
                description: Repo is owner/name of the delivery repo.
                type: string
              retriedBy:
                description: RetriedBy is who asked for the latest retry.
                type: string
              rolledBackTo:
                description: |-
                  RolledBackTo is the version the upgrade guard rolled the control plane
                  back to, when the upgrade failed its checks; for an app Product, the
                  version a zone's release guard put back (zones[].rolledBackTo).
                type: string
              startedAt:
                format: date-time
                type: string
              taggedAt:
                description: TaggedAt is when the GitHub release (and so the git tag)
                  was created.
                format: date-time
                type: string
              version:
                description: Version is the version this Release tags, resolved from
                  spec.version.
                type: string
              zones:
                items:
                  description: ZoneRelease is the Release's progress in one zone.
                  properties:
                    approval:
                      type: string
                    approvedBy:
                      description: ApprovedBy is who approved a human promotion.
                      type: string
                    environment:
                      type: string
                    guard:
                      description: Guard is what the zone's release guard found (ADR
                        0046).
                      properties:
                        checks:
                          description: Checks are each check's latest answer, in the
                            zone's order.
                          items:
                            description: GuardCheckResult is one release guard check's
                              latest answer.
                            properties:
                              at:
                                description: At is when it was last tried.
                                format: date-time
                                type: string
                              attempts:
                                description: Attempts counts tries that did not pass.
                                format: int32
                                type: integer
                              message:
                                description: Message says what the latest try found.
                                type: string
                              passed:
                                description: Passed is true once the latest try passed.
                                type: boolean
                              status:
                                description: Status is the HTTP status of the latest
                                  try; 0 when it got none.
                                format: int32
                                type: integer
                              url:
                                type: string
                            required:
                            - url
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        failedAt:
                          description: FailedAt is when the guard failed.
                          format: date-time
                          type: string
                        hold:
                          description: Hold is the hold the guard applied.
                          type: string
                        holdStartedAt:
                          description: HoldStartedAt is when the zone had passed its
                            checks and the hold began.
                          format: date-time
                          type: string
                        passedAt:
                          description: PassedAt is when the zone held for its hold
                            with every check passing.
                          format: date-time
                          type: string
                        reason:
                          description: Reason says why the guard failed.
                          type: string
                        result:
                          description: Result is Watching while the guard runs, then
                            Passed or Failed.
                          enum:
                          - Watching
                          - Passed
                          - Failed
                          type: string
                        rollback:
                          description: |-
                            Rollback is the zone's rollback mode when the guard started: notify or
                            rollback.
                          type: string
                        slos:
                          description: |-
                            SLOs are the error budget check's latest reading of each SLO of the
                            zone (ADR 0046 phase 6).
                          items:
                            description: |-
                              GuardSLOResult is the error budget check's latest reading of one SLO.
                              Ratios and burn rates are decimal strings.
                            properties:
                              at:
                                description: At is when it was read.
                                format: date-time
                                type: string
                              baseline:
                                description: Baseline is the share of bad events in
                                  the hour before the release.
                                type: string
                              burnRate:
                                description: BurnRate is ErrorRatio divided by the
                                  SLO's error budget.
                                type: string
                              errorRatio:
                                description: |-
                                  ErrorRatio is the share of bad events over Window; empty when there
                                  were too few events to judge.
                                type: string
                              message:
                                description: Message says what the reading found.
                                type: string
                              name:
                                description: Name is the SLO's name, e.g. uptime or
                                  edge-errors.
                                type: string
                              objective:
                                description: Objective is the SLO's objective, in
                                  percent.
                                type: string
                              passed:
                                description: Passed is false once the SLO burned past
                                  the threshold.
                                type: boolean
                              threshold:
                                description: Threshold is the burn rate that fails
                                  the zone.
                                type: string
                              window:
                                description: Window is how much of the hold the reading
                                  covers.
                                type: string
                            required:
                            - name
                            - passed
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        unhealthySince:
                          description: |-
                            UnhealthySince is when Argo CD last stopped reporting the zone Synced
                            and Healthy on the release during the hold; a minute of that fails it.
                          format: date-time
                          type: string
                      required:
                      - result
                      type: object
                    healthyAt:
                      description: |-
                        HealthyAt is when Argo CD reported the zone Synced and Healthy on the
                        release's image.
                      format: date-time
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: ZonePhase is where a Release is in one zone.
                      enum:
                      - Pending
                      - AwaitingApproval
                      - Promoting
                      - Syncing
                      - Verifying
                      - Holding
                      - Healthy
                      - Failed
                      - RollingBack
                      - RolledBack
                      type: string
                    previous:
                      description: |-
                        Previous is what the zone ran before this Release: what a rollback
                        puts back.
                      properties:
                        chart:
                          description: |-
                            Chart is the umbrella chart's tag, <chart>-<version>, for umbrella
                            delivery: the zone's Application deploys the chart at that tag.
                          type: string
                        image:
                          type: string
                        release:
                          description: Release is the Release that put them there.
                          type: string
                        version:
                          type: string
                      required:
                      - image
                      - version
                      type: object
                    pullRequest:
                      description: PullRequest is the pull request on the gitops repo
                        that promoted to the zone.
                      format: int32
                      type: integer
                    pullRequestURL:
                      type: string
                    rollback:
                      description: Rollback is the rollback's progress in the zone.
                      properties:
                        finishedAt:
                          description: FinishedAt is when Argo CD ran the previous
                            image Synced and Healthy.
                          format: date-time
                          type: string
                        pullRequest:
                          description: |-
                            PullRequest is the pull request on the gitops repo that put the
                            previous pin back.
                          format: int32
                          type: integer
                        pullRequestURL:
                          type: string
                        startedAt:
                          format: date-time
                          type: string
                      type: object
                    rolledBackTo:
                      description: |-
                        RolledBackTo is the version the release guard put back in the zone
                        after the zone failed it.
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                    verifiedAt:
                      description: VerifiedAt is when the zone's smoke check passed.
                      format: date-time
                      type: string
                    verifyAttempts:
                      description: VerifyAttempts counts smoke checks that did not
                        pass.
                      format: int32
                      type: integer
                  required:
                  - name
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
