---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: runnerpools.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: RunnerPool
    listKind: RunnerPoolList
    plural: runnerpools
    shortNames:
    - irpool
    singular: runnerpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .spec.room
      name: Room
      type: integer
    - jsonPath: .status.active
      name: Active
      type: integer
    - jsonPath: .status.lastSeen
      name: Last seen
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RunnerPool is room on one Mac for an org's agentRole steps: how many
          AgentVMs at once, which RunnerTemplates and which step modes. Agent
          Substrate's WorkerPool, without a scheduler (localred plan, phase 2).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RunnerPoolSpec is room on one Mac for agentRole steps, owned by one person
              (localred plan, phase 2; infrared-docs-internal ADR 0044). The Mac's node
              agent, `ir local pool`, leases the org's AgentVMs the pool takes and runs
              each in a VM of Apple's container runtime.
            properties:
              agentVersion:
                description: |-
                  AgentVersion is the node agent's contract version the pool was
                  connected with.
                maxLength: 64
                type: string
              owner:
                description: Owner is the GitHub login of the person whose Mac runs
                  the pool.
                pattern: ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
                type: string
              room:
                default: 2
                description: Room is how many AgentVMs the pool runs at once.
                format: int32
                maximum: 16
                minimum: 1
                type: integer
              takes:
                description: |-
                  Takes are the step modes the pool takes: build, review, issue, resolve
                  and report. Empty means all five. A step that publishes, delivers to
                  Slack or names an MCP server always runs in the cluster.
                items:
                  enum:
                  - build
                  - review
                  - issue
                  - resolve
                  - report
                  type: string
                maxItems: 5
                type: array
                x-kubernetes-list-type: set
              templates:
                description: |-
                  Templates are the RunnerTemplates, by name, the pool may run. Empty
                  means reviewer and builder-step.
                items:
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
            required:
            - owner
            type: object
          status:
            description: RunnerPoolStatus is what the API records as the node agent
              talks to it.
            properties:
              active:
                description: Active is how many of the pool's AgentVMs are Leased
                  or Running.
                format: int32
                type: integer
              agent:
                description: Agent is the node agent as it last reported itself.
                properties:
                  container:
                    description: Container is the version of Apple's container CLI
                      the agent runs.
                    maxLength: 64
                    type: string
                  version:
                    description: Version is the node agent's version (the ir CLI's).
                    maxLength: 64
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSeen:
                description: |-
                  LastSeen is when the node agent last asked for work or sent a
                  heartbeat. The pool is alive while it is within RunnerPoolAliveWindow.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
