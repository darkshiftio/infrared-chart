---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: runnertemplates.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: RunnerTemplate
    listKind: RunnerTemplateList
    plural: runnertemplates
    shortNames:
    - irtpl
    singular: runnertemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .spec.cpus
      name: CPUs
      type: integer
    - jsonPath: .spec.memory
      name: Memory
      type: string
    - jsonPath: .spec.image
      name: Image
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RunnerTemplate is what an AgentVM is made from: the runner image by
          digest, its CPUs and memory, its network, the stack's authority and forge,
          and never the Mac's SSH agent (localred plan, phase 2).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RunnerTemplateSpec is what an AgentVM is made from. Agent Substrate's
              ActorTemplate (localred plan, phase 2).
            properties:
              authority:
                description: |-
                  Authority mounts the stack's certificate authority read-only, so the
                  VM trusts the stack's HTTPS names (the forge's among them).
                type: boolean
              class:
                description: |-
                  Class says what the template is for: reviewer (review, issue and report
                  steps), builder-step (build and resolve steps) or agent (an ad hoc,
                  interactive Claude Code).
                enum:
                - reviewer
                - builder-step
                - agent
                type: string
              contract:
                description: Contract is the version of the runner contract the image
                  speaks.
                maxLength: 64
                type: string
              cpus:
                description: CPUs is how many CPUs an AgentVM of the template gets.
                format: int32
                maximum: 16
                minimum: 1
                type: integer
              forgeURL:
                description: |-
                  ForgeURL is the stack's forge as a VM reaches it, e.g.
                  https://gitea.localred-2.localred.laptop. It replaces the in-cluster
                  address a runner Job is given.
                maxLength: 512
                pattern: ^https?://
                type: string
              image:
                description: |-
                  Image is the runner image as the Mac's runtime pulls it, by digest:
                  <registry>/<repository>@sha256:<hex>.
                maxLength: 512
                pattern: ^[^@\s]+@sha256:[0-9a-f]{64}$
                type: string
              memory:
                anyOf:
                - type: integer
                - type: string
                description: Memory is how much memory an AgentVM of the template
                  gets, e.g. 1Gi.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              mounts:
                description: |-
                  Mounts are the Mac's directories an ad hoc AgentVM of the template may
                  mount, as path prefixes. Only for class agent.
                items:
                  type: string
                maxItems: 16
                type: array
              network:
                default: default
                description: Network is the runtime's network an AgentVM joins.
                enum:
                - default
                type: string
              ssh:
                description: |-
                  SSH would forward the Mac's SSH agent into the VM. Never: an AgentVM
                  holds none of the person's keys.
                type: boolean
                x-kubernetes-validations:
                - message: ssh is never forwarded into an AgentVM
                  rule: self == false
            required:
            - class
            - cpus
            - image
            - memory
            type: object
          status:
            description: RunnerTemplateStatus is the template's observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
