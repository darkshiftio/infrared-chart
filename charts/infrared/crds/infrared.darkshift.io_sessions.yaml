---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: sessions.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    shortNames:
    - irsess
    singular: session
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.productRef.name
      name: Product
      type: string
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .spec.who
      name: Who
      type: string
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.startedAt
      name: Started
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Session is one run of a person's own Claude Code in a Product repo, or in
          another repository of the org's forge account, as its hooks reported it:
          who, where, what it committed and what it cost, never what was said.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SessionSpec is what a session is: set once, by the API, when the hooks
              report the session's start.
            properties:
              agentRole:
                description: |-
                  AgentRole is the AgentRole the session runs as, when ir local work
                  started it; empty for a session started by hand.
                maxLength: 63
                type: string
              branch:
                description: Branch is the branch the session worked on.
                maxLength: 255
                type: string
              client:
                description: Client is the Claude Code version that ran the session.
                maxLength: 64
                type: string
              host:
                description: |-
                  Host is the forge's host the repo is on, such as github.com, for the
                  org's own session; empty for a Product's, whose GitProvider says it.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              issue:
                description: |-
                  Issue is the issue the session works on, <repo>#<number>, when the
                  branch or the brief names one.
                maxLength: 120
                type: string
              paidBy:
                description: |-
                  PaidBy is who pays for the session's model calls: plan, the person's
                  own Claude plan, or api, an API key.
                enum:
                - plan
                - api
                type: string
              platform:
                description: |-
                  Platform is the telemetry platform of the stack the Mac has connected,
                  when it has one (ADR 0044): <login>-<stack>.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                type: string
              productRef:
                description: |-
                  ProductRef is the Product whose repo the session worked in. None for the
                  org's own session: one in a repository of the org's forge account that
                  no Product names, which repo and host then say.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              repo:
                description: |-
                  Repo is the repo the session worked in: by name, for a Product with
                  several; as owner/name for the org's own session.
                maxLength: 141
                type: string
              startedAt:
                description: StartedAt is when the session started.
                format: date-time
                type: string
              who:
                description: |-
                  Who is the person, as records name them (a GitHub login, a Human's name,
                  root): the byline of the token that reported the session, never an
                  address.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - startedAt
            - who
            type: object
          status:
            description: |-
              SessionStatus is what the session did, as its hooks reported it, and where
              it is.
            properties:
              agents:
                items:
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              commits:
                description: Commits are the commits the session made, oldest first.
                items:
                  description: SessionCommit is one commit a session made.
                  properties:
                    conventional:
                      description: Conventional says whether the subject is a conventional
                        commit's.
                      type: boolean
                    sha:
                      description: SHA is the commit, in full.
                      maxLength: 64
                      minLength: 7
                      type: string
                    subject:
                      description: Subject is the commit's first line, as the forge
                        holds it.
                      maxLength: 200
                      type: string
                  required:
                  - sha
                  type: object
                maxItems: 200
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              edits:
                description: Edits counts the files the session edited or wrote.
                format: int32
                type: integer
              endedAt:
                description: |-
                  EndedAt is when the session ended, as reported, or, for a Lost one, its
                  last report.
                format: date-time
                type: string
              lastReportAt:
                description: LastReportAt is when the hooks last reported.
                format: date-time
                type: string
              message:
                description: |-
                  Message says in plain words what happened to the record: why it is
                  Lost, or that its usage could not be read.
                maxLength: 1000
                type: string
              phase:
                description: SessionPhase is where a Session is.
                enum:
                - Running
                - Ended
                - Lost
                type: string
              plugins:
                description: |-
                  Plugins, Skills and Agents name what the session ran with: the plugins
                  loaded, the skills invoked and the agents started.
                items:
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              pullRequest:
                description: |-
                  PullRequest is the number of the pull request the session opened, when
                  it opened one.
                format: int32
                type: integer
              pushes:
                description: Pushes counts the pushes the session made.
                format: int32
                type: integer
              skills:
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              toolCalls:
                description: ToolCalls counts the session's tool calls by tool.
                items:
                  description: SessionToolCalls counts one tool's calls in a session.
                  properties:
                    count:
                      format: int32
                      minimum: 0
                      type: integer
                    tool:
                      description: 'Tool is the tool''s name, as Claude Code names
                        it: Read, Edit, Bash.'
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - count
                  - tool
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - tool
                x-kubernetes-list-type: map
              usage:
                description: |-
                  Usage is the session's tokens by model and kind, its cost as Claude
                  Code estimates it at list prices, its turns and how long it ran.
                properties:
                  byModel:
                    description: |-
                      ByModel splits the usage by the model that served it, as the Agent SDK
                      reports it.
                    items:
                      description: ModelUsage is one model's share of a step's usage.
                      properties:
                        cacheReadTokens:
                          format: int64
                          type: integer
                        cacheWriteTokens:
                          format: int64
                          type: integer
                        costUSD:
                          description: CostUSD as a decimal string.
                          type: string
                        inputTokens:
                          format: int64
                          type: integer
                        model:
                          type: string
                        outputTokens:
                          format: int64
                          type: integer
                      required:
                      - model
                      type: object
                    type: array
                  cacheReadTokens:
                    format: int64
                    type: integer
                  cacheWriteTokens:
                    format: int64
                    type: integer
                  costUSD:
                    description: CostUSD as a decimal string.
                    type: string
                  durationMs:
                    description: DurationMs is how long the agent ran, in milliseconds.
                    format: int64
                    type: integer
                  inputTokens:
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                  turns:
                    format: int32
                    type: integer
                type: object
              usageFrom:
                description: |-
                  UsageFrom says where the tokens and cost came from: transcript, or none
                  when the transcript could not be read.
                enum:
                - transcript
                - none
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
