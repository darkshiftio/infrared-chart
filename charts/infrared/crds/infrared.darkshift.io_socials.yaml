---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: socials.infrared.darkshift.io
spec:
  group: infrared.darkshift.io
  names:
    kind: Social
    listKind: SocialList
    plural: socials
    shortNames:
    - irsocial
    singular: social
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.connection.accountName
      name: Account
      type: string
    - jsonPath: .status.conditions[?(@.type=="Connected")].status
      name: Connected
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Social is an account an org announces to, connected by signing in, with
          its announcement plan (ADR 0055); or an identity platform each Human may
          have a handle on: a forge, Google, a Slack workspace (ADR 0049). It lives
          in the org's namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SocialSpec is an account an org announces to, or a platform its people
              have handles on (ADR 0049, ADR 0055).
            properties:
              audience:
                description: 'Audience is who reads an announcing Social: public,
                  customers or team.'
                enum:
                - public
                - customers
                - team
                type: string
              connection:
                description: Connection is the account an announcing Social posts
                  as.
                properties:
                  accountID:
                    description: AccountID is the platform's id for the account, e.g.
                      an X user id.
                    maxLength: 128
                    type: string
                  accountName:
                    description: |-
                      AccountName is the account as people know it, e.g. @goodguycorp or
                      #goodguy-updates.
                    maxLength: 128
                    type: string
                  channelID:
                    description: ChannelID is the Slack channel a slack-channel Social
                      posts in.
                    maxLength: 63
                    type: string
                  connectedAt:
                    description: ConnectedAt is when.
                    format: date-time
                    type: string
                  connectedBy:
                    description: ConnectedBy is who signed in or picked it, by their
                      Infrared login.
                    maxLength: 254
                    type: string
                  repo:
                    description: |-
                      Repo is the owner/name of the site's repo a blog Social opens pull
                      requests on.
                    maxLength: 200
                    type: string
                  teamID:
                    description: TeamID is the connected Slack workspace a slack-channel
                      Social posts in.
                    maxLength: 63
                    type: string
                  tokenSecret:
                    description: |-
                      TokenSecret names the Secret in the org's namespace that holds the
                      token (keys token, refresh-token, expires-at) or, for a webhook, the
                      address (key url).
                    maxLength: 253
                    type: string
                  url:
                    description: URL is the account's public address, e.g. https://x.com/goodguycorp.
                    maxLength: 512
                    type: string
                type: object
              displayName:
                description: DisplayName is the platform's name as people see it,
                  e.g. Slack.
                maxLength: 63
                minLength: 1
                type: string
              handlePattern:
                description: |-
                  HandlePattern is a regular expression every handle on this Social must
                  match, e.g. ^U[A-Z0-9]{8,}$ for a Slack member ID. Empty takes any.
                maxLength: 256
                type: string
              icon:
                description: Icon names the platform's mark in the app, e.g. slack.
                maxLength: 32
                type: string
              kind:
                description: |-
                  Kind is what it is. Announcing: slack-channel, x, linkedin, bluesky,
                  youtube, blog, github-releases, gitlab-releases, gitea-releases or
                  webhook. Identity: github, gitlab, gitea, google or slack. Kept for
                  Socials made before ADR 0055: mastodon and custom.
                enum:
                - slack
                - linkedin
                - x
                - bluesky
                - mastodon
                - github
                - gitlab
                - gitea
                - google
                - custom
                - slack-channel
                - youtube
                - blog
                - github-releases
                - gitlab-releases
                - gitea-releases
                - webhook
                type: string
              plan:
                description: Plan is its announcement plan.
                properties:
                  avoidAudienceDays:
                    description: |-
                      AvoidAudienceDays keeps it off the days the audience's other Socials
                      post, so nobody reads the same news twice in a day.
                    type: boolean
                  cadence:
                    default: weekly
                    description: |-
                      Cadence is how often it posts: with each Release, or a digest daily,
                      weekly, every other week or monthly.
                    enum:
                    - release
                    - daily
                    - weekly
                    - biweekly
                    - monthly
                    type: string
                  day:
                    description: Day is the weekday a weekly or every-other-week digest
                      posts.
                    enum:
                    - mon
                    - tue
                    - wed
                    - thu
                    - fri
                    - sat
                    - sun
                    type: string
                  distinctWording:
                    description: |-
                      DistinctWording words the same news differently from the audience's
                      other Socials.
                    type: boolean
                  leadWithBiggest:
                    description: |-
                      LeadWithBiggest gives features and large fixes the words, and counts
                      the small ones.
                    type: boolean
                  notes:
                    description: Notes are read by the writer before every draft for
                      this Social.
                    maxLength: 2000
                    type: string
                  resurface:
                    description: |-
                      Resurface lets a draft bring back an earlier highlight this Social has
                      not covered.
                    type: boolean
                  review:
                    default: approve
                    description: 'Review is what happens before a draft posts: approve,
                      window or auto.'
                    enum:
                    - approve
                    - window
                    - auto
                    type: string
                  time:
                    description: Time is when a digest posts, HH:MM in the org's scheduling
                      time zone.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                  voice:
                    description: Voice is the writer's register.
                    enum:
                    - plain
                    - technical
                    - playful
                    type: string
                  windowHours:
                    description: |-
                      WindowHours is how long a draft waits to be held under the window
                      review.
                    format: int32
                    maximum: 72
                    minimum: 1
                    type: integer
                type: object
              products:
                description: |-
                  Products are the Products an announcing Social speaks for. Empty:
                  every Product in the org.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              profileURLTemplate:
                description: |-
                  ProfileURLTemplate links a handle to its profile: the URL with
                  {handle} where the handle goes, e.g. https://x.com/{handle}.
                maxLength: 512
                type: string
              slackWorkspace:
                description: |-
                  SlackWorkspace names the org's connected Slack workspace a slack Social
                  reaches people through, so the app can message a handle.
                maxLength: 63
                type: string
            required:
            - displayName
            - kind
            type: object
            x-kubernetes-validations:
            - message: profileURLTemplate must contain {handle}, e.g. https://x.com/{handle}
              rule: '!has(self.profileURLTemplate) || size(self.profileURLTemplate)
                == 0 || self.profileURLTemplate.contains(''{handle}'')'
            - message: connection, plan and audience are for Socials an org announces
                to, not identity Socials
              rule: (!has(self.connection) && !has(self.plan) && !has(self.audience))
                || self.kind in ['slack-channel','x','linkedin','bluesky','youtube','blog','github-releases','gitlab-releases','gitea-releases','webhook']
          status:
            description: SocialStatus is what the Social controller found.
            properties:
              conditions:
                description: 'Conditions: Connected, and Ready, Progressing, Degraded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
