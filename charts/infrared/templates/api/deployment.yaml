{{- $c := .Values.api }}
{{- $ctx := dict "root" . "c" $c "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrared.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "infrared.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infrared.componentLabels" $ctx | nindent 8 }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "infrared.podCommon" $ctx | nindent 6 }}
      containers:
        - name: api
          {{- include "infrared.containerCommon" $ctx | nindent 10 }}
          {{- with $c.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: INFRARED_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFRARED_GITOPS_TEMPLATE_VERSION
              value: {{ .Values.gitops.templateVersion | quote }}
            {{- with .Values.externalURL }}
            - name: INFRARED_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.metricsURL }}
            - name: INFRARED_METRICS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.registry.address }}
            # The install's own registry, where steps publish and Releases take images from.
            - name: INFRARED_REGISTRY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gitea.enabled }}
            # The Gitea this chart runs, and the Secret with its site admin,
            # which the setup wizard's forge step makes an org's bot user with.
            - name: INFRARED_GITEA_URL
              value: {{ include "infrared.giteaURL" . | quote }}
            - name: INFRARED_GITEA_ADMIN_SECRET
              value: "infrared-gitea-admin"
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- include "infrared.probes" (dict "port" "http") | nindent 10 }}
