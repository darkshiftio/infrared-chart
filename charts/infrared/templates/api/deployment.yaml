{{- if and .Values.gitea.browserURL (not .Values.gitea.enabled) }}
{{- fail "gitea.browserURL is the address browsers open the Gitea this chart runs at: it needs gitea.enabled" }}
{{- end }}
{{- $c := .Values.api }}
{{- if .Values.summaryvideo.enabled }}
{{- /* The media volume is the disk's own (root's on GKE's persistent disks): an
fsGroup makes it the pod's group's to write, whatever uid the image runs as. */}}
{{- $c = deepCopy .Values.api }}
{{- $_ := set $c "podSecurityContext" (merge (dict "fsGroup" 65532 "fsGroupChangePolicy" "OnRootMismatch") (deepCopy (default .Values.podSecurityContext .Values.api.podSecurityContext))) }}
{{- /* The media volume is ReadWriteOnce: one node, any number of pods on it.
A rollout's new pod goes to the node the running pod is on, so it mounts the
volume beside it and takes requests before the old pod stops. */}}
{{- if not $c.affinity }}
{{- $sel := dict "app.kubernetes.io/name" (include "infrared.name" .) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "api" }}
{{- $_ := set $c "affinity" (dict "podAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "labelSelector" (dict "matchLabels" $sel) "topologyKey" "kubernetes.io/hostname")))) }}
{{- end }}
{{- end }}
{{- $ctx := dict "root" . "c" $c "component" "api" }}
{{- if .Values.summaryvideo.enabled }}
{{- $_ := set $ctx "volumes" (list (dict "name" "media" "persistentVolumeClaim" (dict "claimName" (include "infrared.componentName" (dict "root" . "component" "media"))))) }}
{{- $_ := set $ctx "volumeMounts" (list (dict "name" "media" "mountPath" "/var/lib/infrared/media")) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrared.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 3
  # A rollout starts the new pod and stops the old one only once the new one is
  # ready, so the edge always has a ready pod (with the media volume, the new
  # pod goes to the same node: see the affinity above).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "infrared.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infrared.componentLabels" $ctx | nindent 8 }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "infrared.podCommon" $ctx | nindent 6 }}
      containers:
        - name: api
          {{- include "infrared.containerCommon" $ctx | nindent 10 }}
          {{- with $c.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: INFRARED_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.license.existingSecret }}
            # The Secret the install's licence is in (license.existingSecret);
            # unset, infrared-license.
            - name: INFRARED_LICENSE_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: INFRARED_GITOPS_TEMPLATE_VERSION
              value: {{ .Values.gitops.templateVersion | quote }}
            {{- with include "infrared.cloudIdentity" . }}
            # The install's identity for cloud accounts: what an admin grants
            # (GET /v1/cloud-identity).
            - name: INFRARED_CLOUD_IDENTITY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.externalURL }}
            - name: INFRARED_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            # The root user's password sign-in (signIn.password.enabled):
            # false turns it off once Sign in with Google has worked here.
            - name: INFRARED_SIGN_IN_PASSWORD
              value: {{ ternary "true" "false" (ne .Values.signIn.password.enabled false) | quote }}
            {{- with $c.clientAddressHeader }}
            # The header that carries a caller's address, which the password
            # sign-in's limits count failures by (api.clientAddressHeader).
            - name: INFRARED_CLIENT_ADDRESS_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- with $c.directory }}
            # Workspace groups as roles (api.directory, ADR 0042): the Google
            # service account the API reads them as, the API it reads them
            # through, how often, and how long a read counts. Each only when set.
            {{- with .serviceAccount }}
            - name: INFRARED_DIRECTORY_SERVICE_ACCOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- with .api }}
            - name: INFRARED_DIRECTORY_API
              value: {{ . | quote }}
            {{- end }}
            {{- with .interval }}
            - name: INFRARED_DIRECTORY_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .maxAge }}
            - name: INFRARED_DIRECTORY_MAX_AGE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            # Infrared as the OpenID Connect provider of the install's own tools
            # (oidc.enabled, ADR 0053), at the Installation's sign-in URL's
            # /api/v1/oidc. It writes the signing key and each client's secret.
            - name: INFRARED_OIDC
              value: "true"
            {{- end }}
            {{- with .Values.oidc.grafanaURL }}
            # Grafana's address in a browser (oidc.grafanaURL): set, the
            # provider has the client grafana.
            - name: INFRARED_OIDC_GRAFANA_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- with .Values.oidc.mcpURL }}
            # Where MCP clients reach the code tools, signed in through Infrared
            # (oidc.mcpURL): set, the provider has the public client mcp, whose
            # access tokens are for this address too.
            - name: INFRARED_OIDC_MCP_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- if .Values.summaryvideo.enabled }}
            - name: INFRARED_MEDIA_DIR
              value: /var/lib/infrared/media
            # Settings, Install features, says whether this Secret has the Gemini key.
            - name: INFRARED_SUMMARY_VIDEO_GEMINI_SECRET
              value: {{ .Values.summaryvideo.geminiSecret | quote }}
            {{- end }}
            {{- with .Values.observability.metricsURL }}
            - name: INFRARED_METRICS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.metricsWriteURL }}
            - name: INFRARED_METRICS_WRITE_URL
              value: {{ . | quote }}
            {{- end }}
            # The API's own Prometheus metrics, on a port of their own off the public listener (ADR 0044).
            - name: INFRARED_METRICS_ADDR
              value: {{ printf ":%d" (int .Values.api.metricsPort) | quote }}
            {{- with .Values.registry.address }}
            # The install's own registry, where steps publish and Releases take images from.
            - name: INFRARED_REGISTRY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gitea.enabled }}
            # The Gitea this chart runs, and the Secret with its site admin,
            # which the setup wizard's forge step makes an org's bot user with.
            - name: INFRARED_GITEA_URL
              value: {{ include "infrared.giteaURL" . | quote }}
            - name: INFRARED_GITEA_ADMIN_SECRET
              value: "infrared-gitea-admin"
            {{- with .Values.gitea.browserURL }}
            # ...and the address browsers open it at (gitea.browserURL): set, the
            # API may register its own OAuth application there, a Gitea
            # connector people link their Gitea accounts with (ADR 0042).
            - name: INFRARED_GITEA_BROWSER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if not .Values.codeIndex.enabled }}
            # No code index runs (codeIndex.enabled is false): the code
            # endpoints answer 501. On, the API reaches it at its default,
            # http://code-index.code-index.svc:8080.
            - name: INFRARED_CODE_INDEX_URL
              value: "off"
            {{- end }}
            {{- with include "infrared.restore" . }}
            # This install is a restore: the API refuses the setup wizard and
            # every run's start until the restore is complete.
            - name: INFRARED_RESTORE
              value: {{ . | quote }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.api.metricsPort }}
              protocol: TCP
          {{- include "infrared.probes" (dict "port" "http") | nindent 10 }}
