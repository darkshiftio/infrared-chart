{{- if and .Values.gitea.browserURL (not .Values.gitea.enabled) }}
{{- fail "gitea.browserURL is the address browsers open the Gitea this chart runs at: it needs gitea.enabled" }}
{{- end }}
{{- if and (include "infrared.edgeProofOn" .) (not .Values.api.clientAddressHeader) }}
{{- fail "api.clientAddressProof.enabled needs api.clientAddressHeader: the edge's proof says when the API may believe that header, such as CF-Connecting-IP behind Cloudflare, and none is named" }}
{{- end }}
{{- $store := .Values.summaryvideo.store | default "volume" }}
{{- if and (ne $store "volume") (not .Values.stores.enabled) }}
{{- fail (printf "summaryvideo.store %s keeps the videos and pictures in the stores' bucket media, which needs stores.enabled (infrared-docs-internal ADR 0087 D4); volume keeps them on the API's own volume" $store) }}
{{- end }}
{{- if and (ne $store "volume") (not .Values.summaryvideo.enabled) }}
{{- fail (printf "summaryvideo.store %s copies the API's media volume into the bucket media, and summaryvideo.enabled is false: there is no volume and no video; set summaryvideo.store back to volume" $store) }}
{{- end }}
{{- $c := .Values.api }}
{{- if .Values.summaryvideo.enabled }}
{{- /* The media volume is the disk's own (root's on GKE's persistent disks): an
fsGroup makes it the pod's group's to write, whatever uid the image runs as. */}}
{{- $c = deepCopy .Values.api }}
{{- $_ := set $c "podSecurityContext" (merge (dict "fsGroup" 65532 "fsGroupChangePolicy" "OnRootMismatch") (deepCopy (default .Values.podSecurityContext .Values.api.podSecurityContext))) }}
{{- /* The media volume is ReadWriteOnce: one node, any number of pods on it.
A rollout's new pod goes to the node the running pod is on, so it mounts the
volume beside it and takes requests before the old pod stops. */}}
{{- if not $c.affinity }}
{{- $sel := dict "app.kubernetes.io/name" (include "infrared.name" .) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "api" }}
{{- $_ := set $c "affinity" (dict "podAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "labelSelector" (dict "matchLabels" $sel) "topologyKey" "kubernetes.io/hostname")))) }}
{{- end }}
{{- end }}
{{- $ctx := dict "root" . "c" $c "component" "api" }}
{{- $volumes := list }}
{{- $mounts := list }}
{{- if .Values.summaryvideo.enabled }}
{{- $volumes = append $volumes (dict "name" "media" "persistentVolumeClaim" (dict "claimName" (include "infrared.componentName" (dict "root" . "component" "media")))) }}
{{- if eq $store "objectStore" }}
{{- /* objectStore (infrared-docs-internal ADR 0087 D7): new files go to the
bucket media alone, and the volume stays mounted, read-only, so the API still
reads any file whose copy it has not verified in the bucket, and nothing
writes or deletes there; its claim stays until a person deletes it, after a
release that stops mounting it. */}}
{{- $mounts = append $mounts (dict "name" "media" "mountPath" "/var/lib/infrared/media" "readOnly" true) }}
{{- else }}
{{- $mounts = append $mounts (dict "name" "media" "mountPath" "/var/lib/infrared/media") }}
{{- end }}
{{- end }}
{{- with .Values.supportChat.hmacKeySecret.name }}
{{- /* The support desk's inbox's key (supportChat.hmacKeySecret, workspace TODO
668): optional, so an install without the Secret, or without its key, still
starts, and the API answers 404 for the chat until it is there. The API reads
the file at every call and the kubelet writes a changed Secret into its volume,
so a key put in place or rotated later needs no restart; never a subPath, which
the kubelet does not update. */}}
{{- $volumes = append $volumes (dict "name" "support-chat" "secret" (dict "secretName" . "items" (list (dict "key" $.Values.supportChat.hmacKeySecret.key "path" "hmac-key")) "optional" true)) }}
{{- $mounts = append $mounts (dict "name" "support-chat" "mountPath" "/var/run/infrared/support-chat" "readOnly" true) }}
{{- end }}
{{- with $volumes }}
{{- $_ := set $ctx "volumes" . }}
{{- end }}
{{- with $mounts }}
{{- $_ := set $ctx "volumeMounts" . }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrared.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 3
  # By default a rollout starts the new pod and stops the old one only once the
  # new one is ready, so the edge always has a ready pod (with the media volume,
  # the new pod goes to the same node: see the affinity above); api.strategy
  # chooses Recreate where no node has room for a second API (its rollingUpdate
  # block is left out then: the API server refuses one beside Recreate).
  strategy:
    type: {{ $c.strategy.type }}
    {{- if and (eq $c.strategy.type "RollingUpdate") $c.strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $c.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "infrared.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infrared.componentLabels" $ctx | nindent 8 }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "infrared.podCommon" $ctx | nindent 6 }}
      containers:
        - name: api
          {{- include "infrared.containerCommon" $ctx | nindent 10 }}
          {{- with $c.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: INFRARED_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.license.existingSecret }}
            # The Secret the install's licence is in (license.existingSecret);
            # unset, infrared-license.
            - name: INFRARED_LICENSE_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: INFRARED_GITOPS_TEMPLATE_VERSION
              value: {{ .Values.gitops.templateVersion | quote }}
            # The template this chart was released with, from its Chart.yaml
            # annotation, which no values file overrides (templateFollowsChart).
            - name: INFRARED_GITOPS_TEMPLATE_RELEASE
              value: {{ index .Chart.Annotations "infrared.darkshift.io/gitops-template" | quote }}
            {{- with include "infrared.cloudIdentity" . }}
            # The install's identity for cloud accounts: what an admin grants
            # (GET /v1/cloud-identity).
            - name: INFRARED_CLOUD_IDENTITY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.externalURL }}
            - name: INFRARED_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            # The root user's password sign-in (signIn.password.enabled):
            # false turns it off once Sign in with Google has worked here.
            - name: INFRARED_SIGN_IN_PASSWORD
              value: {{ ternary "true" "false" (ne .Values.signIn.password.enabled false) | quote }}
            {{- with $c.clientAddressHeader }}
            # The header that carries a caller's address, which the password
            # sign-in's limits count failures by (api.clientAddressHeader).
            - name: INFRARED_CLIENT_ADDRESS_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- if include "infrared.edgeProofOn" . }}
            # The edge's proof (api.clientAddressProof.enabled, workspace TODO
            # 473, F4): the header above counts only on a request that carries
            # this Secret's value, which the edge stamps; the API makes it.
            - name: INFRARED_EDGE_PROOF_SECRET
              value: {{ include "infrared.edgeProofSecret" . | quote }}
            {{- end }}
            {{- with $c.directory }}
            # Workspace groups as roles (api.directory, ADR 0042): the Google
            # service account the API reads them as, the API it reads them
            # through, how often, and how long a read counts. Each only when set.
            {{- with .serviceAccount }}
            - name: INFRARED_DIRECTORY_SERVICE_ACCOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- with .api }}
            - name: INFRARED_DIRECTORY_API
              value: {{ . | quote }}
            {{- end }}
            {{- with .interval }}
            - name: INFRARED_DIRECTORY_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .maxAge }}
            - name: INFRARED_DIRECTORY_MAX_AGE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            # Infrared as the OpenID Connect provider of the install's own tools
            # (oidc.enabled, ADR 0053), at the Installation's sign-in URL's
            # /api/v1/oidc. It writes the signing key and each client's secret.
            - name: INFRARED_OIDC
              value: "true"
            {{- end }}
            {{- with .Values.oidc.grafanaURL }}
            # Grafana's address in a browser (oidc.grafanaURL): set, the
            # provider has the client grafana.
            - name: INFRARED_OIDC_GRAFANA_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- with .Values.oidc.mcpURL }}
            # Where MCP clients reach the code tools, signed in through Infrared
            # (oidc.mcpURL): set, the provider has the public client mcp, whose
            # access tokens are for this address too.
            - name: INFRARED_OIDC_MCP_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- if .Values.summaryvideo.enabled }}
            - name: INFRARED_MEDIA_DIR
              value: /var/lib/infrared/media
            # Settings, Install features, says whether this Secret has the Gemini key.
            - name: INFRARED_SUMMARY_VIDEO_GEMINI_SECRET
              value: {{ .Values.summaryvideo.geminiSecret | quote }}
            {{- if ne $store "volume" }}
            # Where the videos and pictures are kept (summaryvideo.store, ADR
            # 0087 D4 and D7): both copies the volume into the stores' bucket
            # media and verifies each copy; objectStore keeps new files there.
            # The API serves every file itself, never at a presigned URL.
            - name: INFRARED_MEDIA_STORE
              value: {{ $store | quote }}
            - name: INFRARED_MEDIA_S3_ENDPOINT
              value: "http://seaweedfs-s3.stores.svc:8333"
            - name: INFRARED_MEDIA_S3_BUCKET
              value: "media"
            # The S3 identity media's key, which the gitops template copies
            # here; optional, so the API starts without it and says why.
            - name: INFRARED_MEDIA_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: infrared-media-s3
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: INFRARED_MEDIA_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: infrared-media-s3
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            {{- end }}
            {{- end }}
            {{- if .Values.stores.enabled }}
            # The S3 identity storage-reader's key, which the gitops template
            # copies here: List on each bucket, for the storage views' figures
            # by org and their listings where the filer refuses the API (ADR
            # 0087), wherever the API keeps its videos and pictures. Optional,
            # so the API starts without it and says why.
            - name: INFRARED_STORAGE_READER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: infrared-storage-reader-s3
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: INFRARED_STORAGE_READER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: infrared-storage-reader-s3
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            {{- end }}
            {{- with .Values.observability.metricsURL }}
            - name: INFRARED_METRICS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.metricsWriteURL }}
            - name: INFRARED_METRICS_WRITE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.platformProduct }}
            # The platform org's Product the install's own Incidents open on
            # (observability.platformProduct, ADR 0069 T9): what the gitops
            # template's Alertmanager sends to /v1/webhooks/alertmanager/_platform.
            # Unset, such an Incident is install-wide.
            - name: INFRARED_PLATFORM_PRODUCT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.plane }}
            # The telemetry plane this install registers with and writes to
            # (telemetry.plane, ADR 0069 T1 and T3): the home unless the install
            # names another; empty, the API's own default, the same address.
            - name: INFRARED_TELEMETRY_PLANE
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- with .Values.telemetry.publicURL }}
            # On a plane of record, the base of every write path it hands out
            # (telemetry.publicURL, workspace TODO 745); unset, the address each
            # request came to.
            - name: INFRARED_TELEMETRY_PUBLIC_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- with $c.callersURL }}
            # Where callers outside the install reach its API: the base of the
            # Slack app's request URLs and a new GitHub App's webhook URL
            # (api.callersURL, workspace TODO 745); unset, the address each
            # request came to.
            - name: INFRARED_CALLERS_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- /* The chat with the install's support desk (supportChat, workspace TODO
            668), behind the API's rollout flag supportChat: each value only when set,
            and the API answers 404 until every one is, the key is in its file and an
            org is listed. */}}
            {{- with .Values.supportChat.baseUrl }}
            # The support desk's address in a browser (supportChat.baseUrl).
            - name: INFRARED_SUPPORT_CHAT_BASE_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- with .Values.supportChat.websiteToken }}
            # Its website inbox's token, public by design (supportChat.websiteToken).
            - name: INFRARED_SUPPORT_CHAT_WEBSITE_TOKEN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.supportChat.install }}
            # This install's name to the desk (supportChat.install).
            - name: INFRARED_SUPPORT_CHAT_INSTALL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.supportChat.orgs }}
            # The orgs that opted in to the chat (supportChat.orgs).
            - name: INFRARED_SUPPORT_CHAT_ORGS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.supportChat.hmacKeySecret.name }}
            # The desk's inbox's key, from the Secret supportChat.hmacKeySecret names.
            - name: INFRARED_SUPPORT_CHAT_HMAC_KEY_FILE
              value: "/var/run/infrared/support-chat/hmac-key"
            {{- end }}
            # The API's own Prometheus metrics, on a port of their own off the public listener (ADR 0044).
            - name: INFRARED_METRICS_ADDR
              value: {{ printf ":%d" (int .Values.api.metricsPort) | quote }}
            {{- with .Values.registry.address }}
            # The install's own registry, where steps publish and Releases take images from.
            - name: INFRARED_REGISTRY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gitea.enabled }}
            # The Gitea this chart runs, and the Secret with its site admin,
            # which the setup wizard's forge step makes an org's bot user with.
            - name: INFRARED_GITEA_URL
              value: {{ include "infrared.giteaURL" . | quote }}
            - name: INFRARED_GITEA_ADMIN_SECRET
              value: "infrared-gitea-admin"
            {{- with .Values.gitea.browserURL }}
            # ...and the address browsers open it at (gitea.browserURL): set, the
            # API may register its own OAuth application there, a Gitea
            # connector people link their Gitea accounts with (ADR 0042).
            - name: INFRARED_GITEA_BROWSER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if not .Values.codeIndex.enabled }}
            # No code index runs (codeIndex.enabled is false): the code
            # endpoints answer 501. On, the API reaches it at its default,
            # http://code-index.code-index.svc:8080.
            - name: INFRARED_CODE_INDEX_URL
              value: "off"
            {{- end }}
            {{- with include "infrared.restore" . }}
            # This install is a restore: the API refuses the setup wizard and
            # every run's start until the restore is complete.
            - name: INFRARED_RESTORE
              value: {{ . | quote }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.api.metricsPort }}
              protocol: TCP
          {{- include "infrared.probes" (dict "port" "http") | nindent 10 }}
