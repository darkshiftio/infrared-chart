apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "infrared.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
rules:
  # Every Infrared resource (Organization, Cluster, GitopsRepo, AgentRole,
  # AgentWorkflow, AgentWorkflowRun, ...) and its status.
  - apiGroups: ["infrared.darkshift.io"]
    resources: ["*", "*/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Product logos: the API serves the operator's cache (<product>-logo) and
  # stages uploads (<product>-logo-upload) in ir-org-* namespaces.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Product builds: the API reads each Product's kpack Image in namespace builds.
  - apiGroups: ["kpack.io"]
    resources: ["images"]
    verbs: ["get", "list"]
  # AgentWorkflowRun step logs: the API finds a step's runner pod by label and
  # streams its log.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Product environments: the API reads each zone's Argo CD Application (sync and
  # health) and the app's Deployment (ready pods).
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # The platform by layer: besides the Deployments above, the API reads Argo
  # CD's application controller (a StatefulSet), the stores' Postgres (a
  # CloudNativePG Cluster and its Backups: its WAL archive and how old its last
  # base backup is, which CloudNativePG records only on the Backup when a
  # plugin takes it) and the CronJob that copies the buckets, to say whether
  # each layer is ready.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list"]
  # Environment detail: each zone's persistent volume claims and recent events.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "events"]
    verbs: ["get", "list"]
  # Product links: the API reads the Ingresses in each zone's namespace to list
  # where people can open the zone.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  # ...and on a Gateway edge each zone's HTTPRoute <product>-preview, its
  # hostnames and who may open it.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get"]
  # Organizations live in ir-org-* namespaces, which the API creates.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  # The API reads and writes Secrets in the release namespace (infrared-setup,
  # infrared-session, infrared-api-tokens) and in ir-org-* namespaces. RBAC
  # cannot match a namespace prefix, so this is cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "infrared.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "infrared.componentName" (dict "root" . "component" "api") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "infrared.componentName" (dict "root" . "component" "api") }}
    namespace: {{ .Release.Namespace }}
