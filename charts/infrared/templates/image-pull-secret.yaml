{{- /*
The Secret named by imagePullSecrets[0], from imageCredentials: one
kubernetes.io/dockerconfigjson entry for imageCredentials.registry. Rendered
only when a username and password are set; otherwise that Secret must already
exist, as before. The operator reads its ghcr.io entry for Argo CD's chart
repository Secret and copies the Secret into each org namespace for runner Jobs.
Kept on uninstall, and when the values stop carrying the password (Argo CD
renders the chart without it after adoption), like the generated Secrets.
*/}}
{{- $c := .Values.imageCredentials }}
{{- $user := trim (default "" $c.username) }}
{{- $pass := trim (default "" $c.password) }}
{{- if or $user $pass }}
{{- if not (and $user $pass) }}
{{- fail "imageCredentials needs both username and password: pass the password with --set-file imageCredentials.password=<file>" }}
{{- end }}
{{- $name := include "infrared.firstPullSecret" . }}
{{- if not $name }}
{{- fail "imageCredentials needs imagePullSecrets[0].name, the name of the Secret it renders" }}
{{- end }}
{{- $auth := dict "username" $user "password" $pass "auth" (printf "%s:%s" $user $pass | b64enc) }}
{{- $config := dict "auths" (dict $c.registry $auth) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ toJson $config | b64enc | quote }}
{{- end }}
