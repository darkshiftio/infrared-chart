{{- include "infrared.codeIndexCheck" . }}
{{- $c := .Values.operator }}
{{- $ctx := dict "root" . "c" $c "component" "operator" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrared.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "infrared.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infrared.componentLabels" $ctx | nindent 8 }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "infrared.podCommon" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: operator
          {{- include "infrared.containerCommon" $ctx | nindent 10 }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:{{ .Values.operator.metricsPort }}
            {{- if not .Values.operator.metricsSecure }}
            # Plain HTTP in the cluster, as the API's metrics are, so the metrics stack and the telemetry vmagent
            # scrape it without a client certificate or a token review (controller-runtime serves HTTPS with
            # authentication by default, which answers a plain scrape with 400).
            - --metrics-secure=false
            {{- end }}
            {{- with $c.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: INFRARED_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.license.existingSecret }}
            # The Secret the install's licence is in (license.existingSecret);
            # unset, infrared-license.
            - name: INFRARED_LICENSE_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: INFRARED_CLUSTER_NAME
              value: {{ .Values.managementCluster.name | quote }}
            {{- with .Values.installation.edge }}
            # The Installation's spec.edge, written while it is empty.
            - name: INFRARED_EDGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.installation.previews }}
            # The Installation's spec.previews, written while it is empty.
            - name: INFRARED_PREVIEWS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.installation.tunnel }}
            # The Installation's spec.tunnel, written while it is empty: the
            # Cloudflare Tunnel a Gateway edge is reached through (ADR 0064).
            - name: INFRARED_TUNNEL
              value: {{ toJson . | quote }}
            {{- end }}
            # Under an umbrella chart, its version is Infrared's (ADR 0038).
            - name: INFRARED_VERSION
              value: {{ include "infrared.deployedAppVersion" . | quote }}
            # An umbrella chart's version when one wraps this chart (ADR 0038).
            - name: INFRARED_CHART_VERSION
              value: {{ include "infrared.deployedChartVersion" . | quote }}
            {{- if include "infrared.underUmbrella" . }}
            # The name the umbrella knows this chart by: the gitops repo's
            # infrared Application nests its values under it from the first
            # hydration, so they reach this chart.
            - name: INFRARED_CHART_SUBCHART
              value: {{ .Chart.Name | quote }}
            {{- end }}
            # The operator's own image, which the backup CronJob runs.
            - name: INFRARED_OPERATOR_IMAGE
              value: {{ include "infrared.operatorImage" . | quote }}
            - name: INFRARED_IMAGE_PULL_SECRET
              value: {{ include "infrared.firstPullSecret" . | quote }}
            {{- with include "infrared.cloudIdentity" . }}
            # The install's identity for cloud accounts (ServiceAccount
            # infrared-cloud): the check Jobs' pod spec follows it.
            - name: INFRARED_CLOUD_IDENTITY
              value: {{ . | quote }}
            {{- end }}
            # Where the org registries' credential Jobs write their tokens.
            - name: INFRARED_REGISTRY_CREDENTIALS_NAMESPACE
              value: {{ .Values.registryCredentials.namespace | quote }}
            - name: INFRARED_TOFU_STATE_NAMESPACE
              value: {{ .Values.tofuState.namespace | quote }}
            # Infrared's chart repository, which Argo CD pulls the chart from.
            - name: INFRARED_CHART_REPO
              value: {{ include "infrared.chartRepository" . | quote }}
            {{- with include "infrared.registryToken" . }}
            {{- /* Or ECR's token on AWS (registryToken.aws), the same way. */}}
            # The registry token: the pull secret above is an access token of
            # this Google service account, rewritten every 30 minutes; and
            # Substrate's images come from beside Infrared's own.
            - name: INFRARED_REGISTRY_TOKEN
              value: {{ . | quote }}
            - name: INFRARED_SUBSTRATE_REGISTRY
              value: {{ printf "%s/substrate" (include "infrared.registry" $) | quote }}
            {{- end }}
            {{- with include "infrared.handedRegistry" . }}
            # Images from a registry other than the default: the operator hands
            # the registry and every pin to the gitops template.
            - name: INFRARED_IMAGE_REGISTRY
              value: {{ . | quote }}
            - name: INFRARED_IMAGES
              value: {{ include "infrared.imagePins" $ | quote }}
            {{- end }}
            - name: INFRARED_BUILD_REGISTRY
              value: {{ .Values.builds.registry | quote }}
            {{- with .Values.registry.address }}
            # The install's own registry: a user, rule and push credential per
            # organization, steps that publish, and the gitops template's Registry.
            - name: INFRARED_REGISTRY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.operator.moveIssueToHydratedRepo }}
            # A Change follows the Product repo its hydration names.
            - name: INFRARED_MOVE_ISSUE_TO_HYDRATED_REPO
              value: "true"
            {{- end }}
            {{- if .Values.tenancy.networkPolicies.enabled }}
            # The network fence (tenancy.networkPolicies.enabled, ADR 0066 D1):
            # every org's namespaces fenced, and the template's side handed on.
            - name: INFRARED_NETWORK_POLICIES
              value: "true"
            {{- end }}
            {{- if .Values.tenancy.registryPulls.enabled }}
            # The registry by identity (tenancy.registryPulls.enabled, ADR 0066
            # D3): each zone pulls as its org, and the template's registry reads
            # for no one without a login.
            - name: INFRARED_REGISTRY_PULLS
              value: "true"
            {{- end }}
            {{- if .Values.tenancy.storesSecurity.enabled }}
            # The stores' own security (tenancy.storesSecurity.enabled, ADR 0066
            # D3), handed on to the template.
            - name: INFRARED_STORES_SECURITY
              value: "true"
            {{- end }}
            {{- with .Values.tenancy.tenantPods }}
            {{- if .enabled }}
            # Tenants' pods (tenancy.tenantPods, ADR 0066 D4, D5): no Kubernetes
            # token, and the placement, in every zone of an org but the platform's.
            - name: INFRARED_TENANT_PODS
              value: {{ dict "placement" (.placement | default dict) | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.tenancy.quotas }}
            {{- if .enabled }}
            # Quotas (tenancy.quotas, ADR 0066 D4): one org's budget, split over its
            # zones here, and its builds' cap.
            - name: INFRARED_TENANT_QUOTAS
              value: {{ dict "zones" .zones "builds" .builds | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.tenancy.admissionPolicies.enabled }}
            # The admission policies on tenants' namespaces (ADR 0066 D6).
            - name: INFRARED_ADMISSION_POLICIES
              value: "true"
            {{- end }}
            {{- if .Values.tenancy.denyLogging.enabled }}
            # GKE logs the denies of tenants' namespaces (ADR 0066 D10).
            - name: INFRARED_DENY_LOGGING
              value: "true"
            {{- end }}
            {{- if .Values.tenancy.argoCD.restrictDefaultProject }}
            # Argo CD's default project takes the platform's root alone (ADR 0066 D10).
            - name: INFRARED_ARGOCD_RESTRICT_DEFAULT_PROJECT
              value: "true"
            {{- end }}
            {{- with .Values.tenancy.buildCaps }}
            {{- if .enabled }}
            # Build caps (tenancy.buildCaps, workspace TODO 473): each tenant
            # build's deadline, and its org's build minutes a UTC day.
            - name: INFRARED_BUILD_CAPS
              value: {{ dict "deadlineMinutes" (int .deadlineMinutes) "minutesPerOrgPerDay" (int .minutesPerOrgPerDay) | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.tenancy.tenantStorage }}
            {{- if .enabled }}
            # Tenants' storage (tenancy.tenantStorage, workspace TODO 473): the
            # cap on every tenant org's volumes together.
            - name: INFRARED_TENANT_STORAGE
              value: {{ dict "capGi" (int .capGi) "minDiskGi" (int .minDiskGi) | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.stores.enabled }}
            # The platform's stores, which the gitops template installs.
            - name: INFRARED_STORES
              value: "true"
            {{- if .Values.stores.singleNode }}
            # On the cluster's one node: one object store server of each kind.
            - name: INFRARED_STORES_SINGLE_NODE
              value: "true"
            {{- end }}
            {{- end }}
            {{- with include "infrared.backup" . }}
            # The bucket outside the cluster the backups go to, which seeds the
            # Installation's spec.backup.destination.
            - name: INFRARED_BACKUP
              value: {{ . | quote }}
            {{- end }}
            {{- with include "infrared.disabledComponents" . }}
            # The gitops template's components the install leaves out, Substrate's
            # test actors among them unless substrate.testActors is true.
            - name: INFRARED_DISABLED_COMPONENTS
              value: {{ . | quote }}
            {{- end }}
            {{- with include "infrared.copies" . }}
            # The rest of the install's backups, which seeds the Installation's
            # spec.backup: the schedules, the retention, the age recipients and
            # Postgres's archive.
            - name: INFRARED_COPIES
              value: {{ . | quote }}
            {{- end }}
            {{- with include "infrared.registryRetention" . }}
            # Zot's garbage collection and retention, for the gitops template.
            - name: INFRARED_REGISTRY_RETENTION
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.codeIndex.enabled }}
            # Agent steps get Infrared's MCP server, the code tools among its
            # tools, at its in-cluster listener, with the access Secret's token
            # behind the runner's proxy: only while the code index runs.
            - name: INFRARED_MCP_URL
              value: {{ printf "http://%s.%s.svc:8081/mcp" (include "infrared.componentName" (dict "root" . "component" "mcp")) .Release.Namespace | quote }}
            - name: INFRARED_MCP_ACCESS_SECRET
              value: {{ include "infrared.mcpAccessSecret" . | quote }}
            {{- end }}
            {{- with include "infrared.restore" . }}
            # This install is a restore: the operator starts no controller
            # until the Job infrared-restore has restored Infrared's objects.
            - name: INFRARED_RESTORE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gitea.enabled }}
            # The Gitea this chart runs: the operator gives an org's GitProvider
            # its bot's token only when spec.gitea.url is this one.
            - name: INFRARED_GITEA_URL
              value: {{ include "infrared.giteaURL" . | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            # Infrared as the OpenID Connect provider of the install's own tools
            # (oidc.enabled, ADR 0053): with Grafana's address, the gitops
            # template signs people in to Grafana through Infrared.
            - name: INFRARED_OIDC
              value: "true"
            {{- end }}
            {{- with .Values.oidc.grafanaURL }}
            # Grafana's address in a browser (oidc.grafanaURL), the template's
            # GrafanaURL.
            - name: INFRARED_OIDC_GRAFANA_URL
              value: {{ trimSuffix "/" . | quote }}
            {{- end }}
            {{- if .Values.summaryvideo.enabled }}
            - name: INFRARED_SUMMARY_VIDEO_IMAGE
              value: {{ include "infrared.image" (dict "root" . "image" .Values.summaryvideo.image) | quote }}
            - name: INFRARED_SUMMARY_VIDEO_BROWSER_IMAGE
              value: {{ .Values.summaryvideo.browserImage | quote }}
            - name: INFRARED_SUMMARY_VIDEO_FFMPEG_IMAGE
              value: {{ .Values.summaryvideo.ffmpegImage | quote }}
            - name: INFRARED_SUMMARY_VIDEO_GEMINI_SECRET
              value: {{ .Values.summaryvideo.geminiSecret | quote }}
            - name: INFRARED_UI_URL
              value: {{ printf "http://%s.%s.svc:%d" (include "infrared.fullname" .) .Release.Namespace (int .Values.ui.service.port) | quote }}
            {{- end }}
            - name: INFRARED_RUNNER_IMAGE
              value: {{ include "infrared.image" (dict "root" . "image" .Values.runner.image) | quote }}
            - name: INFRARED_GO_TOOLCHAIN_IMAGE
              value: {{ .Values.runner.goToolchainImage | quote }}
            - name: INFRARED_HELM_IMAGE
              value: {{ .Values.runner.helmImage | quote }}
            - name: INFRARED_GOLANGCI_LINT_IMAGE
              value: {{ .Values.runner.golangciLintImage | quote }}
            - name: INFRARED_RUNNER_NETWORK_POLICY
              value: {{ .Values.runner.networkPolicy.enabled | quote }}
            - name: INFRARED_RUNNER_EGRESS_CIDRS
              value: {{ join "," .Values.runner.networkPolicy.extraEgressCIDRs | quote }}
            # Where builds and agent steps run: a node pool of their own (builds.placement, runner.placement).
            - name: INFRARED_BUILD_PLACEMENT
              value: {{ .Values.builds.placement | default dict | toJson | quote }}
            - name: INFRARED_AGENT_STEP_PLACEMENT
              value: {{ .Values.runner.placement | default dict | toJson | quote }}
            {{- with .Values.observability.metricsURL }}
            # The release guard's error budget check reads VictoriaMetrics (ADR 0046 phase 6).
            - name: INFRARED_METRICS_URL
              value: {{ . | quote }}
            {{- end }}
            # Alertmanager sends SLO alerts here (/v1/webhooks/alertmanager/<org>).
            - name: INFRARED_API_URL
              value: {{ printf "http://%s.%s.svc:%d" (include "infrared.componentName" (dict "root" . "component" "api")) .Release.Namespace (int .Values.api.service.port) | quote }}
            {{- with .Values.installation.telemetry }}
            {{- with .url }}
            # The telemetry plane (ADR 0044): written to the Installation's spec.observability.telemetry.
            - name: INFRARED_TELEMETRY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .platform }}
            - name: INFRARED_TELEMETRY_PLATFORM
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.operator.metricsPort }}
              protocol: TCP
          {{- include "infrared.probes" (dict "port" "health") | nindent 10 }}
