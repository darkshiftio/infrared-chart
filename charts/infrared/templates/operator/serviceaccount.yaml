apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infrared.componentName" (dict "root" . "component" "operator") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "operator") | nindent 4 }}
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
