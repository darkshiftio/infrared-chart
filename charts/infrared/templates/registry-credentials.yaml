{{- /*
The org registries' credentials (Registry, infrared-docs-internal ADR 0033 phase
3). The operator's credential Jobs run as infrared-cloud, the install's cloud
identity, and write each registry's short-lived token into this namespace as
registry-cred-<org>-<registry>. RBAC cannot limit a create to a name, so the Jobs
get a namespace of their own where they may create and update Secrets and do
nothing else: no get, so they read none back, and no right anywhere else. The
operator reads them (its ClusterRole covers Secrets) and copies each to the
builds and zone namespaces.
*/}}
{{- $ctx := dict "root" . "component" "registry-credentials" }}
{{- $ns := .Values.registryCredentials.namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" $ctx | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infrared-cloud-registry-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infrared-cloud-registry-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infrared-cloud-registry-credentials
subjects:
  - kind: ServiceAccount
    name: infrared-cloud
    namespace: {{ .Release.Namespace }}
