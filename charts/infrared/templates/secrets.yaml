{{- /*
Generated Secrets. Order of precedence for each value:
  1. existingSecret set -> nothing is rendered; the named Secret must exist.
  2. an explicit value (setup.token, session.key, mcp.token).
  3. the value already in the cluster (lookup), so upgrades keep it.
  4. a new random value.
Under Argo CD, `lookup` returns nothing, so step 3 never happens there: after
Argo CD adopts the release the gitops values must set every existingSecret.
All carry helm.sh/resource-policy: keep so that switching to existingSecret
(or uninstalling) never deletes a live credential.
The names infrared-setup, infrared-session and infrared-api-tokens are fixed:
the API reads them by name from the release namespace.
*/}}
{{- $ns := .Release.Namespace }}

{{- if not .Values.setup.existingSecret }}
{{- $prev := (lookup "v1" "Secret" $ns "infrared-setup") | default dict }}
{{- $token := .Values.setup.token }}
{{- if and (not $token) $prev.data }}{{ $token = index $prev.data "token" | default "" | b64dec }}{{ end }}
{{- if not $token }}{{ $token = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: infrared-setup
  namespace: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
---
{{- end }}

{{- if not .Values.session.existingSecret }}
{{- $prev := (lookup "v1" "Secret" $ns "infrared-session") | default dict }}
{{- $key := .Values.session.key }}
{{- if and (not $key) $prev.data }}{{ $key = index $prev.data "key" | default "" | b64dec }}{{ end }}
{{- if not $key }}{{ $key = randAlphaNum 64 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: infrared-session
  namespace: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ $key | b64enc | quote }}
---
{{- end }}

{{- if not .Values.mcp.existingSecret }}
{{- $name := include "infrared.mcpTokenSecret" . }}
{{- $prev := (lookup "v1" "Secret" $ns $name) | default dict }}
{{- $token := .Values.mcp.token }}
{{- if and (not $token) $prev.data }}{{ $token = index $prev.data "token" | default "" | b64dec }}{{ end }}
{{- if not $token }}{{ $token = randAlphaNum 48 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
---
# The API's token store: key = token name, value = hex sha256 of the token.
# Beside each hash, the API writes the admin a token was minted for under owner.<name>.
# Tokens the API added since the last upgrade are kept; only `mcp` is set here.
{{- $tokens := dict }}
{{- with (lookup "v1" "Secret" $ns "infrared-api-tokens") }}{{ $tokens = deepCopy (.data | default dict) }}{{ end }}
{{- $_ := set $tokens "mcp" ($token | sha256sum | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: infrared-api-tokens
  namespace: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $tokens }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

{{- if not .Values.mcp.access.existingSecret }}
{{- $name := include "infrared.mcpAccessSecret" . }}
{{- $prev := (lookup "v1" "Secret" $ns $name) | default dict }}
{{- $token := .Values.mcp.access.token }}
{{- if and (not $token) $prev.data }}{{ $token = index $prev.data "token" | default "" | b64dec }}{{ end }}
{{- if not $token }}{{ $token = randAlphaNum 48 }}{{ end }}
---
# The bearer token MCP clients send to /mcp.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
