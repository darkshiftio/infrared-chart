# The primary Service: named after the fullname (`infrared` for a release
# named infrared), so `kubectl -n infrared port-forward svc/infrared 8080:80`
# reaches the UI, which proxies the API and MCP.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrared.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "infrared.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
