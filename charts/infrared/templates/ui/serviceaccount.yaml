apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infrared.componentName" (dict "root" . "component" "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrared.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
  {{- with .Values.ui.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
