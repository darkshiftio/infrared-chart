# Default values for the infrared chart.
# Every key here is described in values.schema.json and in the README values table.

# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix. With a release named `infrared`
# the prefix is `infrared`, so the UI Service is `svc/infrared`.
fullnameOverride: ""

managementCluster:
  # -- Name of the management cluster this installation runs on (INFRARED_CLUSTER_NAME).
  name: infrared-mgmt

# -- Public URL of the UI/API, if it is exposed (INFRARED_EXTERNAL_URL). Optional.
externalURL: ""

# What the operator writes to the Installation when it starts, so nobody patches
# it after the install. It writes each field only while that field is empty, and
# never overwrites one.
installation:
  # -- The edge the gitops template routes through (INFRARED_EDGE, operator):
  # `traefik`, an Ingress per route as before, or `gateway`, routes on the shared
  # Envoy Gateway. Empty means traefik. Written to the Installation's `spec.edge`.
  edge: ""
  # -- Preview settings (INFRARED_PREVIEWS, operator, as JSON): `domain` and
  # `signInURL`, and optionally `ingressHost`, `ingressIP`, `managedRoots` and
  # `cloudflareTokenSecret`. Written to the Installation's `spec.previews`.
  # Empty leaves previews to a person, as before.
  previews: {}
  #   domain: preview.example.com              # zone z answers at https://<z>.<domain>
  #   signInURL: https://infrared.example.com  # where preview visitors sign in

gitops:
  # -- Version of infrared-gitops-template the API asks the operator to render
  # (INFRARED_GITOPS_TEMPLATE_VERSION): a tag, or a full 40-character commit SHA
  # to install from a branch of the template.
  templateVersion: v0.1.10

builds:
  # -- Registry prefix product images are built into by kpack, e.g.
  # `123456789012.dkr.ecr.us-east-1.amazonaws.com/acme` (INFRARED_BUILD_REGISTRY).
  # Empty leaves the gitops template's builds component out.
  registry: ""

registry:
  # -- The install's own registry, as builds and nodes reach it: host and port,
  # no scheme, e.g. `10.43.0.50:5000` (Zot, over plain HTTP inside the
  # cluster; INFRARED_REGISTRY, operator and API). The operator keeps a
  # registry user, rule and push credential per organization, builds as each
  # organization's builder, lets steps whose AgentRole may publish push to it,
  # and hands it to the gitops template (its `Registry`). Empty: none of them.
  address: ""

stores:
  # -- Install the platform's stores through the gitops template: one Postgres
  # and one object store in the cluster (INFRARED_STORES, operator). Off leaves
  # them out, as before.
  enabled: false

# The bucket outside the cluster that copies of the stores go to (INFRARED_BACKUP,
# operator, as JSON): all three, or none. Empty means no copies. The bucket's key
# comes from platformTokens.
backup:
  # -- Bucket name.
  bucket: ""
  # -- The bucket's S3 endpoint: https:// and a host, e.g. `https://s3.example.com`.
  endpoint: ""
  # -- The region S3 requests are signed for, e.g. `us-east-1`.
  region: ""

components:
  # -- The gitops template's components the install leaves out, by name, e.g.
  # `[infisical]` (INFRARED_DISABLED_COMPONENTS, operator, as JSON). Empty leaves
  # out none.
  disabled: []

image:
  # -- Registry prefix shared by every component image. Any registry other than
  # this default is handed to the operator with every component's tag and digest
  # (INFRARED_IMAGE_REGISTRY, INFRARED_IMAGES), so the gitops template writes them
  # into the `infrared` Application and Argo CD keeps them when it adopts the release.
  registry: 977456087177.dkr.ecr.us-east-1.amazonaws.com
  # -- Pull policy for every component image.
  pullPolicy: IfNotPresent

# -- Image pull secrets for every pod, e.g. `[{name: ghcr-pull}]`. The first
# name is also handed to the operator (INFRARED_IMAGE_PULL_SECRET) for the
# clusters it bootstraps and for runner Jobs: it copies the Secret into each org
# namespace and sets it on every Job.
imagePullSecrets: []

# The Secret named by imagePullSecrets[0], a kubernetes.io/dockerconfigjson for
# one registry, rendered when a username and password are set. Empty (the
# default) renders none, and that Secret must already exist in the release
# namespace. Pass the password with --set-file so it is never in a values file;
# surrounding whitespace is trimmed. The Secret is kept on uninstall and when the
# values stop carrying the password, as under Argo CD after adoption.
imageCredentials:
  # -- Registry host the credential is for. The operator also reads it for the
  # chart repository on ghcr.io.
  registry: ghcr.io
  # -- Username; required with a password.
  username: ""
  # -- Password or token, e.g. a token that may only read packages; required with a username.
  password: ""

# Generated Secrets. On a plain `helm install`/`helm upgrade` each Secret is
# generated once and kept across upgrades (looked up with `lookup`). Under
# Argo CD `lookup` returns nothing, so once Argo CD adopts the release the
# gitops values must set every `existingSecret` below, or the Secrets would be
# regenerated on every render. The names the API reads are fixed.
setup:
  # -- One-time setup token (Secret `infrared-setup`, key `token`). Empty generates 32 random characters.
  token: ""
  # -- Name of an existing Secret with key `token`; when set, the chart renders no setup Secret.
  existingSecret: ""
session:
  # -- Session signing key (Secret `infrared-session`, key `key`). Empty generates 64 random characters.
  key: ""
  # -- Name of an existing Secret with key `key`; when set, the chart renders no session Secret.
  existingSecret: ""

# Tokens the platform's own components use, kept in one Secret,
# `infrared-platform-tokens`, in the release namespace. The gitops template's
# External Secrets component reads it through the ClusterSecretStore
# `infrared-platform` and copies each token to the namespace that uses it. The
# Secret is rendered when a token is set. Pass each token with --set-file so it is
# never in a values file; surrounding whitespace is trimmed. It is kept on
# uninstall and when the values stop carrying the token, as under Argo CD after
# adoption.
platformTokens:
  # -- Cloudflare API token (key `cloudflare-api-token`), for the edge's DNS
  # records and origin certificates.
  cloudflareApiToken: ""
  # -- Access key ID of the backup bucket's key (key `backup-access-key-id`);
  # required with the secret access key.
  backupAccessKeyId: ""
  # -- Secret access key of the backup bucket's key (key `backup-secret-access-key`);
  # required with the access key ID.
  backupSecretAccessKey: ""
  # -- `infrared-platform-tokens` when that Secret already exists; the chart then
  # renders none. The name is fixed: the template reads it.
  existingSecret: ""

# Gitea's site admin, in the Secret `infrared-gitea-admin` (keys username,
# password and email), when gitea.enabled. The chart generates it once, with a
# random password, and keeps it: on upgrades, on uninstall, and once Argo CD
# adopts the release. Gitea reads the username and password from it and resets
# the admin's password to it at every start; the API reads it
# (INFRARED_GITEA_ADMIN_SECRET) to make an org's bot user. Never printed.
giteaAdmin:
  # -- `infrared-gitea-admin` when that Secret already exists; the chart then
  # renders none, as under Argo CD (the gitops template sets it). The name is fixed.
  existingSecret: ""

# Pod-level defaults shared by every component; each component may override.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -- Extra labels on every resource.
commonLabels: {}

# -- The image the operator runs each AgentWorkflowRun agent step in (infrared-runner,
# the Claude Agent SDK). Steps run as Jobs in the org namespace and need the org's
# Secret model-provider-anthropic (key api-key).
observability:
  # -- Prometheus-compatible query URL the API reads SLO error ratios from (INFRARED_METRICS_URL).
  # The default is the VictoriaMetrics single node the gitops template installs; empty reports every SLO as no-data.
  metricsURL: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428"

runner:
  image:
    # -- Repository under image.registry.
    repository: infrared-runner
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.63
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:c8df0507d918b6b2ce944454621754525ac7f0c193f942309d759ae23628e03e"
  # -- Image an init container copies a Go toolchain from, so agents can build and
  # test Go repos. Pinned by digest.
  goToolchainImage: "golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9"
  # -- Image an init container copies helm from, so agents can lint and
  # template a Product's chart. Pinned by digest.
  helmImage: "alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9"
  networkPolicy:
    # -- Fence runner pods with a NetworkPolicy in each org namespace: DNS and
    # HTTP(S) to the internet only, nothing in the cluster, the VPC or cloud
    # metadata. Turn off only when the cluster's CNI does not enforce NetworkPolicy.
    enabled: true
    # -- Private networks runners may also reach over HTTP(S), e.g. a GitHub
    # Enterprise Server: a list of CIDRs.
    extraEgressCIDRs: []

operator:
  image:
    # -- Repository under image.registry.
    repository: infrared-operator
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.92
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:70c56245065aefa4a6ed02d93d80cc45935abd84e30fb7f057426fe53ced9c86"
  replicas: 1
  # -- Extra container args, appended after --leader-elect and the probe address.
  extraArgs: []
  # -- Extra environment variables.
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  rbac:
    # -- Rules appended to the generated operator ClusterRole.
    extraRules: []
  serviceAccount:
    annotations: {}
  service:
    port: 8081
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

api:
  image:
    repository: infrared-api
    tag: v0.1.0-alpha.101
    digest: "sha256:b3081841e335a532d62a206295fe8ef18c39c454c7c01c4c8eabcd2edded073c"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  serviceAccount:
    annotations: {}
  service:
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ui:
  image:
    repository: infrared-ui
    tag: v0.1.0-alpha.102
    digest: "sha256:a90a3580abadc598a3d5b6dd12c4393e92013b639c59828e68b826e353b34b87"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    annotations: {}
  service:
    # -- Port of the primary Service (named after the release fullname).
    port: 80
    type: ClusterIP
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # -- Extensions: services the org runs that the UI shows in its rail and proxies at
  # /ext/<id>/<path>/, one location per declared path, to signed-in GitHub users only.
  # Anything else under /ext/<id>/ is 404. Empty (the default) leaves the slot off: no
  # ConfigMap, mount or env. `upstream` is an FQDN and port, because nginx's resolver
  # ignores search domains.
  extensions: []
  # - id: ledger
  #   title: Ledger
  #   icon: book            # puzzle (default), book, wallet, receipt, users, key, landmark, scroll
  #   upstream: ledger.ledger.svc.cluster.local:8080
  #   paths: [v1, ui]       # optional, default [v1, ui]
  #   entry: ""             # optional, default /ext/<id>/ui/entry.js
  extensionsProxySecret:
    # -- Name of an existing Secret whose value the UI sends to every extension upstream as
    # X-Infrared-Proxy-Secret (INFRARED_EXT_PROXY_SECRET; 32 or more of A-Z a-z 0-9 _ -).
    # Required when `extensions` is not empty.
    existingSecret: ""
    # -- Key in that Secret.
    key: secret

mcp:
  # -- Token the MCP server presents to the API (Secret `<fullname>-mcp-token`, key `token`). Empty generates one.
  token: ""
  # -- Name of an existing Secret with key `token`; when set, the chart renders neither
  # the MCP token Secret nor `infrared-api-tokens` (both must already exist).
  existingSecret: ""
  access:
    # -- Bearer token clients must send to /mcp (Secret `<fullname>-mcp-access`, key `token`). Empty generates one.
    # Without it the MCP endpoint would answer anyone who can reach the UI.
    token: ""
    # -- Name of an existing Secret with key `token`; when set, the chart renders no access Secret.
    existingSecret: ""
  image:
    repository: infrared-mcp
    tag: v0.1.0-alpha.25
    digest: "sha256:868bd8c2c04da7e20bcea77fb1b975d29c3d3d8a2c335f2bedea201e61f714bd"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    annotations: {}
  service:
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# Gitea, the forge an install may run for its orgs' repos: the chart's `gitea`
# dependency (gitea chart 12.7.0, Gitea 1.27.3), off by default. Every key below
# but `enabled` is the gitea chart's own (https://gitea.com/gitea/helm-gitea),
# preset for one pod: SQLite on one volume, an in-memory cache, a LevelDB queue,
# no ingress and no SSH, sign-in required and no self-registration. The operator
# and the API reach it at http://gitea-http.<release namespace>.svc.cluster.local:3000
# (INFRARED_GITEA_URL), and its site admin is the Secret giteaAdmin describes.
gitea:
  # -- Run Gitea in the release namespace, and hand its address to the operator
  # and the API (INFRARED_GITEA_URL) and its admin Secret to the API
  # (INFRARED_GITEA_ADMIN_SECRET).
  enabled: false
  # -- Fixed: the Deployment is `gitea` and its Service `gitea-http`.
  fullnameOverride: gitea
  replicaCount: 1
  # One pod on a ReadWriteOnce volume: the old pod lets go of it before the new
  # one starts.
  strategy:
    type: Recreate
  image:
    registry: docker.gitea.com
    repository: gitea
    # -- Gitea's version; the chart appends `-rootless`.
    tag: "1.27.3"
    rootless: true
    # -- The image index of docker.gitea.com/gitea:1.27.3-rootless (linux/amd64,
    # arm64 and riscv64), read with crane on 2026-10-02.
    digest: sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
    pullPolicy: IfNotPresent
  service:
    http:
      # A ClusterIP Service, where the gitea chart's default is headless, so
      # Gitea's address does not change when its pod is replaced.
      clusterIP: ""
      port: 3000
  ingress:
    enabled: false
  persistence:
    enabled: true
    # -- StorageClass of Gitea's volume, which holds its database and every
    # repository; empty uses the cluster's default. On Linode,
    # `linode-block-storage-retain` keeps the volume when its claim goes.
    storageClass: ""
    # -- Size of Gitea's volume. Argo CD renders the default once it adopts the
    # release, so a larger size goes in the gitops repo's values file as well.
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # Kept on uninstall, and never pruned or deleted by Argo CD.
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  gitea:
    admin:
      # -- Fixed: the Secret giteaAdmin describes. Gitea reads the admin's
      # username and password from it.
      existingSecret: infrared-gitea-admin
      # -- The admin's username, written to the Secret when the chart generates
      # it. An underscore keeps it apart from every organization and bot name.
      username: gitea_admin
      # Unused while existingSecret is set; the gitea chart's own default is a
      # well-known password.
      password: ""
      # -- The email Gitea creates the admin with, also written to the Secret.
      email: gitea_admin@gitea.local
      # The admin's password is reset to the Secret's at every start.
      passwordMode: keepUpdated
    config:
      server:
        # -- Gitea's own URL: its Service in the release namespace, as
        # INFRARED_GITEA_URL has it, with a trailing slash. Change it with the
        # namespace.
        ROOT_URL: http://gitea-http.infrared.svc.cluster.local:3000/
        DOMAIN: gitea-http.infrared.svc.cluster.local
        # Set here, not left to the gitea chart's defaults, which fill it in
        # only after its Service has rendered with an empty targetPort.
        HTTP_PORT: 3000
        DISABLE_SSH: true
        START_SSH_SERVER: false
        OFFLINE_MODE: true
      database:
        DB_TYPE: sqlite3
      cache:
        ADAPTER: memory
      queue:
        TYPE: level
      service:
        DISABLE_REGISTRATION: true
        REQUIRE_SIGNIN_VIEW: true
        # The API mints the bot's tokens over basic auth.
        ENABLE_BASIC_AUTHENTICATION: true
      cron.update_checker:
        ENABLED: false
  # The gitea chart's databases, caches and test pod: none, with SQLite.
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false
  valkey-cluster:
    enabled: false
  valkey:
    enabled: false
  test:
    enabled: false
