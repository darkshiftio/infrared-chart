# Default values for the infrared chart.
# Every key here is described in values.schema.json and in the README values table.

# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix. With a release named `infrared`
# the prefix is `infrared`, so the UI Service is `svc/infrared`.
fullnameOverride: ""

managementCluster:
  # -- Name of the management cluster this installation runs on (INFRARED_CLUSTER_NAME).
  name: infrared-mgmt

# -- The API's public base URL, ending in /api (e.g. https://infrared.example.com/api), if exposed
# (INFRARED_EXTERNAL_URL). Optional: Infrared works it out from each request.
externalURL: ""

# How people sign in to Infrared. Sign in with Google's OAuth client is
# platformTokens.googleClientId and googleClientSecret; which Google Workspace
# domains may sign in is a setting in Infrared (Settings, Sign-in). Sign in with
# GitHub comes from the platform org's GitHub App. After Argo CD adopts the
# release, set these in the gitops repo's registry/clusters/<cluster>/values/infrared.yaml,
# which Infrared never writes.
signIn:
  password:
    # -- The root user's email and password sign-in (INFRARED_SIGN_IN_PASSWORD,
    # api): the install's first platform admin and its break glass. Its password
    # lives in a vault outside Infrared; Infrared keeps only a bcrypt hash, in the
    # BreakGlass `root` (ADR 0042). false turns it off, but only once Sign in with
    # Google has worked on this install with its configured client; until then the
    # password keeps working, so this value never locks everyone out. Deleting the
    # ConfigMap infrared-sign-in turns it back on until the next Google sign-in.
    enabled: true

# Infrared as the OpenID Connect provider of this install's own tools
# (infrared-docs-internal ADR 0053): Grafana and Gitea sign people in through
# Infrared, which signs them in as it does itself, and their roles there come
# from Infrared's access groups. Off by default, and each tool's client exists
# only while its address is set. The issuer is the Installation's
# spec.previews.signInURL with /api/v1/oidc. infrared-api makes and keeps the
# signing key and each client's secret itself (the Secrets infrared-oidc-signing,
# infrared-oidc-gitea and monitoring/infrared-oidc-grafana); the chart never
# renders them. After Argo CD adopts the release, set these in the gitops repo's
# registry/clusters/<cluster>/values/infrared.yaml, which Infrared never writes.
oidc:
  # -- Turn the provider on (INFRARED_OIDC, api and operator). With grafanaURL,
  # the gitops template signs people in to Grafana through Infrared; with
  # gitea.browserURL and installation.previews.signInURL, this chart signs them
  # in to Gitea (the ConfigMap infrared-gitea-sign-in, under gitea below).
  enabled: false
  # -- Grafana's address in a browser, such as
  # https://grafana.infrared-cp-google.private.darkshift.io
  # (INFRARED_OIDC_GRAFANA_URL, api and operator; a trailing slash is trimmed).
  # Grafana's redirect URI is <grafanaURL>/login/generic_oauth. Empty: no
  # Grafana client.
  grafanaURL: ""
  # -- The address people's MCP clients (Claude Code, ir for localred) reach the
  # code index's tools at, signed in through Infrared: the UI's address followed
  # by /mcp/code, such as https://infrared.darkshift.io/mcp/code (a trailing
  # slash is trimmed). Set, the provider has the public client mcp, whose access
  # tokens are for this address (INFRARED_OIDC_MCP_URL, api), and with enabled,
  # infrared-mcp serves the code tools there, for the platform org alone, to
  # people with a role in the platform org (INFRARED_MCP_CODE_URL, mcp). The
  # UI's /mcp route reaches it. Empty: no client mcp, and the code tools stay
  # inside the cluster.
  mcpURL: ""

# What the operator writes to the Installation when it starts, so nobody patches
# it after the install. It writes each field only while that field is empty, and
# never overwrites one.
installation:
  # -- The edge the gitops template routes through (INFRARED_EDGE, operator):
  # `traefik`, an Ingress per route as before, or `gateway`, routes on the shared
  # Envoy Gateway. Empty means traefik. Written to the Installation's `spec.edge`.
  edge: ""
  # -- Preview settings (INFRARED_PREVIEWS, operator, as JSON): `domain` and
  # `signInURL`, and optionally `ingressHost`, `ingressIP`, `managedRoots`,
  # `cloudflareTokenSecret`, `cloudflareTokenKey`, `customHostnames` (a Gateway
  # edge serves addresses under orgs' own domains as Cloudflare for SaaS custom
  # hostnames), `acmeEmail` and `domainTokenKey` (the key of
  # infrared-platform-tokens that holds a Cloudflare token for `domain`'s zone
  # alone, when that zone is not the sign-in URL host's: a hosted plane's
  # tenants' domain, infrared-docs-internal ADR 0063; on a Gateway edge the
  # certificate and DNS records of `*.<domain>` then use it, and Infrared's own
  # name keeps `cloudflare-api-token`; `cloudflare-domain-api-token` with
  # platformTokens.cloudflareDomainApiToken). Written to the Installation's
  # `spec.previews`. Empty leaves previews to a person, as before.
  previews: {}
  #   domain: preview.example.com              # zone z answers at https://<z>.<domain>
  #   signInURL: https://infrared.example.com  # where preview visitors sign in
  # The telemetry plane (infrared-docs-internal ADR 0044): where an install without
  # the metrics stack sends its numbers, and the platform label every series
  # carries, <login>-<stack> for a Mac's stack (INFRARED_TELEMETRY_URL and
  # INFRARED_TELEMETRY_PLATFORM, operator). Written to the Installation's
  # `spec.observability.telemetry`; the gitops template then renders one vmagent
  # that writes there. Empty: no telemetry component. `ir local telemetry connect`
  # sets both on a local stack and writes the token's Secret.
  telemetry:
    # -- The remote-write address: hosted's `https://<host>/api/v1/telemetry/write`.
    url: ""
    # -- The platform label, lowercase letters, digits and hyphens.
    platform: ""

# -- The control plane's cloud (ADR 0033): "gcp" or "aws"; empty is "gcp". It
# picks the default image registry and chart repository: darkshift's Artifact
# Registry for "gcp" (us-central1-docker.pkg.dev/darkshift-preprod/infrared), its
# ECR for "aws" (977456087177.dkr.ecr.us-east-1.amazonaws.com). Every release is in
# both, by the same digests. image.registry and gitops.chartRepository override it.
# A control plane on AWS also sets registryToken.aws.region, so Argo CD can pull
# the chart and Substrate's images can be copied with an ECR token.
cloud: ""

gitops:
  # -- Version of infrared-gitops-template the API asks the operator to render
  # (INFRARED_GITOPS_TEMPLATE_VERSION): a tag, or a full 40-character commit SHA
  # to install from a branch of the template. Here main's 532ed48 (#34): the
  # platform domain on a Cloudflare token of its own (spec.previews.domainTokenKey,
  # infrared-docs-internal ADR 0063), which only an operator from
  # infrared-operator 9b9090e (api/v0.100.0) or later renders; after #33 (the
  # builder's first group builds a Go service's UI with Node before Go).
  # New gitops repos take it; an existing one keeps its spec.template.version
  # until that is patched.
  templateVersion: 532ed486f9ff22c50b3e8d5bf84676f1614af7cf
  # -- The OCI repository of this chart, host and path with no oci://
  # (INFRARED_CHART_REPO, operator): the gitops template's `infrared` Application
  # pulls the chart from it, and the operator registers it with Argo CD, with the
  # pull secret's credential for its registry. Empty: the cloud's, Artifact
  # Registry's `.../infrared/charts` or ECR's `<ecr>/charts`.
  chartRepository: ""

builds:
  # -- Registry prefix product images are built into by kpack, e.g.
  # `123456789012.dkr.ecr.us-east-1.amazonaws.com/acme` (INFRARED_BUILD_REGISTRY).
  # Empty leaves the gitops template's builds component out.
  registry: ""
  # -- Where the kpack builds of every Product run (INFRARED_BUILD_PLACEMENT, operator, as JSON):
  # a node selector, tolerations and resources the operator writes into each kpack Image's
  # spec.build, the Images already in the gitops repos included, so builds keep off the nodes
  # Infrared runs on, e.g. a node pool of their own. Empty: the scheduler places builds anywhere.
  placement:
    nodeSelector: {}
    tolerations: []
    resources: {}

registry:
  # -- The install's own registry, as builds and nodes reach it: host and port,
  # no scheme, e.g. `10.43.0.50:5000` (Zot, over plain HTTP inside the
  # cluster; INFRARED_REGISTRY, operator and API). The operator keeps a
  # registry user, rule and push credential per organization, builds as each
  # organization's builder, lets steps whose AgentRole may publish push to it,
  # and hands it to the gitops template (its `Registry`). Empty: none of them.
  address: ""
  # Zot's garbage collection and retention (INFRARED_REGISTRY_RETENTION,
  # operator, as JSON, for the gitops template's Zot). Each empty field keeps
  # the template's default, shown with it.
  retention:
    # -- An untagged image goes this long after it was untagged, e.g. `48h`. Empty: `24h`.
    untaggedAfter: ""
    # -- Every tag that matches one of these regular expressions is kept, e.g. `["^v[0-9]"]`. Empty: `["^v[0-9]"]`.
    keepTags: []
    # -- Besides those, each repository keeps its this many newest tags, 1 to 1000. 0: `10`.
    keepNewest: 0
    # -- How often garbage is collected, e.g. `1h`. Empty: `1h`.
    gcInterval: ""
    # -- How long a blob stays after its last use before it may be collected, e.g. `1h`. Empty: `1h`.
    gcDelay: ""

stores:
  # -- Install the platform's stores through the gitops template: one Postgres
  # and one object store in the cluster (INFRARED_STORES, operator). Off leaves
  # them out, as before.
  enabled: false
  # -- With enabled, the object store runs on the cluster's one node: one
  # SeaweedFS server of each kind, every file written once
  # (INFRARED_STORES_SINGLE_NODE, operator), for a cluster that is one machine,
  # such as a local install on a Mac. Off spreads it over three nodes with
  # every file on two of them. It is the install's to say, never derived from
  # the nodes the cluster has at a moment.
  singleNode: false

# The install's backups, written straight to a bucket outside the cluster, one
# encrypted artifact per backup (Installation.spec.backup). The operator seeds
# the Installation's spec.backup from these once, while it is empty
# (INFRARED_BACKUP: the bucket, its endpoint, region and prefix; INFRARED_COPIES:
# the rest; both as JSON), and from then on the setting is Infrared's, changed
# in Settings, Backups. The bucket: all three of bucket, endpoint and region, or
# none; its key comes from platformTokens. Every other field is empty by
# default, which keeps the default beside it. Schedules are UTC; retentions are
# whole days, e.g. 7d.
backup:
  # -- Bucket name. Empty: no backups.
  bucket: ""
  # -- The bucket's S3 endpoint: https:// and a host, e.g. `https://s3.example.com`;
  # `https://storage.googleapis.com` for Google Cloud Storage, which the Jobs
  # reach keyless, as their ServiceAccounts (see `platformTokens.backupAccessKeyId`).
  endpoint: ""
  # -- The region S3 requests are signed for, e.g. `us-east-1`; for Google
  # Cloud Storage the bucket's location, e.g. `us-central1`.
  region: ""
  # -- The path everything is kept under in the bucket, with the bucket only. Empty: managementCluster.name.
  prefix: ""
  # -- A backup, by the operator's CronJob infrared-backup: five cron fields. Empty: `5 * * * *`.
  schedule: ""
  mirror:
    # -- The buckets' mirror to the backup bucket: five cron fields. Empty: `17 * * * *`.
    schedule: ""
  # -- How long each backup, and what the mirror replaced or deleted, is kept. Empty: `7d`.
  retention: ""
  # -- age recipients (public keys, `age1...`) each backup is encrypted to: one
  # or more, and any one of their private keys restores it. Empty (the default)
  # makes no backup, so nothing changes until a person makes the key. Only the
  # public half is ever in values.
  recipients: []
  postgres:
    # -- Barman's WAL archive of the platform's Postgres in the backup bucket,
    # besides the dump in each backup. Off by default.
    archive: false

# Restore at install: this install comes back from one of the backup bucket's
# backups, made by an install of the same name, before anything acts on them.
# Give the install's usual values with restore.enabled, and, with Gitea,
# gitea.replicaCount=0: Gitea starts once its data is back. The age identity
# that opens the backup is the Secret infrared-backup-identity (key identity),
# made with kubectl before helm install, never a value: Helm keeps every value
# in its release record, which outlives the restore. The operator deletes that
# Secret once the restore is complete. Argo CD never renders any of this.
restore:
  # -- Restore this install from the backup bucket (INFRARED_RESTORE, operator
  # and API): the Jobs infrared-restore and, with Gitea, infrared-gitea-restore.
  # Needs stores.enabled and a backup bucket.
  enabled: false
  # -- Restore the newest complete backup at or before this time, RFC 3339 in
  # UTC, e.g. `2026-10-03T05:00:00Z`. Empty, with no point: the newest.
  from: ""
  # -- Restore exactly this backup, by its stamp, e.g. `20261006T010500Z`
  # (what `ir restore --backup-artifact` passes). Not with from.
  point: ""
  # -- The image of the restore Job's Postgres sidecar, which runs pg_restore
  # of each consumer database's dump into the platform's Postgres: the same
  # image the gitops template's Postgres Cluster runs, pinned by digest, so
  # pg_restore and the server share a major. Change it together with the
  # template's `components/postgres/cluster.yaml`.
  postgresImage: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f89a40f4d74aa6e0900917eaf6299b125a6382eb02fd4ee5d46f55bcbf7e5726"

components:
  # -- The gitops template's components the install leaves out, by name, e.g.
  # `[infisical]` (INFRARED_DISABLED_COMPONENTS, operator, as JSON). Empty leaves
  # out none.
  disabled: []

substrate:
  # -- Agent Substrate's test actors, counter-v1 and sandbox-v1, which the gitops
  # template's counter test and fence check run against. sandbox-v1 runs any
  # command it is sent, so they are off by default: with the stores and a
  # registry, where the template can run Substrate, the chart names
  # `substrate-test-actors` among the components the install leaves out
  # (INFRARED_DISABLED_COMPONENTS) unless this is true.
  testActors: false

codeIndex:
  # -- Infrared's code index: Zoekt and the code service, which the gitops
  # template runs in the namespace code-index, reached by infrared-api alone at
  # http://code-index.code-index.svc:8080. Off by default. On, the chart hands
  # its image to the operator among Infrared's own (INFRARED_IMAGES, code-index),
  # and the template runs it; that needs image.registry to name the registry its
  # image is in (ghcr.io/darkshiftio), since the template names the image by it.
  # Its record (knowledge, below) and its credential for private repositories
  # (the GitHub App in platformTokens) go into infrared-platform-tokens at the
  # install, and the template copies them to the namespace code-index: see
  # "The code index".
  enabled: false
  # The code index's record: the knowledge repository it reads its manifest of
  # repositories and its repo cards from. With codeIndex.enabled, the install
  # writes both into infrared-platform-tokens (keys code-index-knowledge-url and
  # code-index-knowledge-ref), which the gitops template copies to the Secret
  # code-index/code-index-settings. Argo CD's render never writes them again, so
  # a later change goes into that Secret, as a token's does.
  knowledge:
    # -- The knowledge repository's URL, https:// or http://, e.g.
    # `https://github.com/darkshiftio/knowledge.git`. Required with
    # codeIndex.enabled wherever the chart renders infrared-platform-tokens.
    url: ""
    # -- The branch, tag or commit the code index reads it at. Empty: `main`.
    ref: ""
  image:
    # -- The image <image.registry>/infrared-codeindex, by tag and digest: a
    # build of darkshiftio/infrared-codeindex main by the kaniko CronJob on
    # infrared-cp-google (darkshiftio/gitops components/infrared-builds), tagged
    # with the platform release it first ships in.
    tag: v0.1.0-rc.216
    # -- Its digest, sha256:...; empty pins by the tag alone.
    digest: sha256:b707ba51164f1319d6f9bf42569e792eecb393dac8f954a9943fe40929b2877a

image:
  # -- Registry prefix shared by every component image. Empty: the cloud's
  # default (see `cloud`). Any registry other than the cloud's default is handed
  # to the operator with every component's tag and digest (INFRARED_IMAGE_REGISTRY,
  # INFRARED_IMAGES), so the gitops template writes them into the `infrared`
  # Application and Argo CD keeps them when it adopts the release.
  registry: ""
  # -- Pull policy for every component image.
  pullPolicy: IfNotPresent

# -- Image pull secrets for every pod, e.g. `[{name: ghcr-pull}]`. The first
# name is also handed to the operator (INFRARED_IMAGE_PULL_SECRET) for the
# clusters it bootstraps and for runner Jobs: it copies the Secret into each org
# namespace and sets it on every Job.
imagePullSecrets: []

# The Secret named by imagePullSecrets[0], a kubernetes.io/dockerconfigjson for
# one registry, rendered when a username and password are set. Empty (the
# default) renders none, and that Secret must already exist in the release
# namespace. Pass the password with --set-file so it is never in a values file;
# surrounding whitespace is trimmed. The Secret is kept on uninstall and when the
# values stop carrying the password, as under Argo CD after adoption.
imageCredentials:
  # -- Registry host the credential is for. The operator also reads it for the
  # chart repository on ghcr.io.
  registry: ghcr.io
  # -- Username; required with a password.
  username: ""
  # -- Password or token, e.g. a token that may only read packages; required with a username.
  password: ""

# The registry token, for a private Artifact Registry in Google Cloud on GKE with
# Workload Identity (no key), or for ECR on AWS with an IAM role (IRSA or the
# node's role). The nodes pull the pods' images as their own
# service account; Argo CD's repo-server (the chart) and the copy of Substrate's
# images into the registry inside the cluster pull themselves, with this. With a
# Google service account set, the chart runs the ServiceAccount registry-token
# (annotated iam.gke.io/gcp-service-account), a Job at the install and every
# upgrade, and a CronJob every 30 minutes, which write that account's access
# token to the Secret registry-token: the install's pull secret
# (INFRARED_IMAGE_PULL_SECRET), so imagePullSecrets and imageCredentials stay
# empty. Substrate's images then come from <image.registry>/substrate
# (INFRARED_SUBSTRATE_REGISTRY). See "The registry token".
registryToken:
  # -- The Google service account whose access token is written, e.g.
  # `registry-reader@darkshift-preprod.iam.gserviceaccount.com`. It needs
  # roles/artifactregistry.reader on the repository, and
  # roles/iam.workloadIdentityUser for `<project>.svc.id.goog[<namespace>/registry-token]`.
  # Empty (the default): no registry token.
  gcpServiceAccount: ""
  # AWS: ECR's token (12 hours) as an IAM role, written the same way; set one of
  # gcpServiceAccount and aws.region. The role needs ecr:GetAuthorizationToken
  # and read on the repositories.
  aws:
    # -- The ECR region, e.g. `us-east-1`. Empty (the default): no ECR token.
    region: ""
    # -- An IAM role for IRSA on EKS, `arn:aws:iam::<account>:role/<name>`, which
    # the ServiceAccount registry-token is annotated with. Empty: the node's role.
    roleArn: ""
    # -- Run the Job on the host's network, for EC2 nodes (such as k3s) whose
    # instance metadata answers only one hop, so a pod reaches the node's role.
    # Handed to the operator, so adoption keeps it.
    hostNetwork: false
  # -- The registry host the token is for. Empty: the image registry's host, e.g.
  # `us-central1-docker.pkg.dev`. The images and gitops.chartRepository must be on it.
  registry: ""
  # -- The Job's image: curl, jq, kubectl and the AWS CLI. alpine/k8s 1.37.0, by digest, as the gitops template's jobs.
  image: "docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4"

# The install's own identity for the cloud accounts orgs add to Infrared
# (CloudAccount, infrared-docs-internal ADR 0033): the ServiceAccount
# infrared-cloud, which the chart always makes and the operator's check Jobs
# run as, is the only identity that reaches an org's cloud. Nothing set: no
# identity, and every cloud account fails its check. Handed to the operator and
# the API as INFRARED_CLOUD_IDENTITY.
cloudIdentity:
  # -- The install's Google service account, bound to infrared-cloud by Workload
  # Identity on GKE: roles/iam.workloadIdentityUser for
  # `<project>.svc.id.goog[<namespace>/infrared-cloud]`. An org grants it
  # roles/iam.serviceAccountTokenCreator on its own service account. Empty: no
  # Google Cloud accounts.
  gcpServiceAccount: ""
  # Where infrared-cloud's AWS credentials come from: at most one of the three.
  # None set: no AWS accounts.
  aws:
    # -- An IAM role for IRSA on EKS, `arn:aws:iam::<account>:role/<name>`, which
    # infrared-cloud is annotated with; it assumes an org's role.
    roleARN: ""
    # -- The node's role through instance metadata, for EC2 nodes (such as k3s)
    # whose metadata answers only one hop: the check Jobs run on the host's network.
    hostNetwork: false
    # -- The cluster's own projected token (audience sts.amazonaws.com), for a
    # control plane outside AWS: an org's role trusts the cluster's OIDC issuer.
    webIdentity: false

# The org registries' credentials (Registry, infrared-docs-internal ADR 0033 phase
# 3): the operator's credential Jobs, as infrared-cloud, write each registry's
# short-lived token into this namespace, which only they may write to (create and
# update on Secrets, nothing else) and only the operator reads; the operator copies
# it to the builds and zone namespaces. Handed to the operator as
# INFRARED_REGISTRY_CREDENTIALS_NAMESPACE.
registryCredentials:
  # -- The namespace the chart makes for them.
  namespace: infrared-registry-credentials

# OpenTofu's state for workload Clusters (spec.provision): each Cluster's state
# Secret and lock Lease, in a namespace of their own so the tofu Job's
# ServiceAccount, infrared-tofu, reaches no other Secret (its backend lists
# Secrets by label, which RBAC cannot limit by name). Handed to the operator as
# INFRARED_TOFU_STATE_NAMESPACE; an older Cluster's state in Infrared's namespace
# moves there before its next run.
tofuState:
  # -- The namespace the chart makes for it.
  namespace: infrared-tofu-state

# Generated Secrets. On a plain `helm install`/`helm upgrade` each Secret is
# generated once and kept across upgrades (looked up with `lookup`). Under
# Argo CD `lookup` returns nothing, so once Argo CD adopts the release the
# gitops values must set every `existingSecret` below, or the Secrets would be
# regenerated on every render. The names the API reads are fixed.
setup:
  # -- One-time setup token (Secret `infrared-setup`, key `token`). Empty generates 32 random characters.
  token: ""
  # -- Name of an existing Secret with key `token`; when set, the chart renders no setup Secret.
  existingSecret: ""
session:
  # -- Session signing key (Secret `infrared-session`, key `key`). Empty generates 64 random characters.
  key: ""
  # -- Name of an existing Secret with key `key`; when set, the chart renders no session Secret.
  existingSecret: ""

# The install's Infrared licence (infrared-docs operate/licensing). The API and
# the operator read it from the Secret `infrared-license`, key `license`, in the
# release namespace, or from the Secret existingSecret names. Without a valid
# licence an install runs a 48-hour trial, then pauses new agent steps and
# promotions to production zones until one is installed. Install one here, in
# Settings, or with `ir license install`.
license:
  # -- A licence from darkshift (one line starting `irl1.`), for the Secret
  # `infrared-license`, key `license`. Pass it with --set-file so it is never in
  # a values file; surrounding whitespace is trimmed. The Secret is rendered only
  # when this is set, and kept on uninstall and when the values stop carrying it
  # (as under Argo CD after adoption), so a licence installed later in Settings
  # stays until a later upgrade passes this again.
  key: ""
  # -- Name of an existing Secret in the release namespace with key `license`
  # (one External Secrets keeps, say). The chart then renders no licence Secret
  # and hands the name to the API and the operator as INFRARED_LICENSE_SECRET;
  # Settings installs a licence into that Secret. Not with key.
  existingSecret: ""

# Tokens the platform's own components use, kept in one Secret,
# `infrared-platform-tokens`, in the release namespace. The gitops template's
# External Secrets component reads it through the ClusterSecretStore
# `infrared-platform` and copies each token to the namespace that uses it. The
# Secret is rendered when a token is set, or with codeIndex.enabled the code
# index's record, which it then holds as well. Pass each token with --set-file
# so it is never in a values file; surrounding whitespace is trimmed. It is kept
# on uninstall and when the values stop carrying the token, as under Argo CD
# after adoption.
platformTokens:
  # -- Cloudflare API token (key `cloudflare-api-token`), for the edge's DNS
  # records and origin certificates.
  cloudflareApiToken: ""
  # -- A Cloudflare token for the zone of `installation.previews.domain` alone
  # (key `cloudflare-domain-api-token`), when that zone is not the one of
  # Infrared's own name and its token is kept apart (a hosted plane's tenants'
  # domain, infrared-docs-internal ADR 0063). With
  # `installation.previews.domainTokenKey: cloudflare-domain-api-token`, a
  # Gateway edge takes the certificate and DNS records of `*.<domain>` with it,
  # and keeps `cloudflareApiToken` for Infrared's own name. It needs Zone Read,
  # DNS Edit and SSL and Certificates Edit on that zone. Pass it with
  # --set-file.
  cloudflareDomainApiToken: ""
  # -- Access key ID of the backup bucket's key (key `backup-access-key-id`);
  # required with the secret access key. Not with Google Cloud Storage
  # (`backup.endpoint` `https://storage.googleapis.com`), which takes no key:
  # the ServiceAccounts infrared-backup, infrared-restore, infrared-gitea-restore,
  # the operator's and the API's are granted the bucket's role outside Infrared,
  # and the chart refuses a key given with it. Pass the pair at install only: once
  # Infrared runs, Settings → Backups writes a new key into these same two
  # keys, and a later helm upgrade that passes them again overwrites that key
  # with this one.
  backupAccessKeyId: ""
  # -- Secret access key of the backup bucket's key (key `backup-secret-access-key`);
  # required with the access key ID.
  backupSecretAccessKey: ""
  # -- The code index's GitHub App, which it mints read-only installation tokens
  # from to read private repositories: the App's ID (key
  # `code-index-github-app-id`), a number. All three or none, and only with
  # codeIndex.enabled; with none the code index reads public repositories only,
  # and the three keys are written empty.
  codeIndexGithubAppId: ""
  # -- The ID of the App's installation (key
  # `code-index-github-app-installation-id`), a number.
  codeIndexGithubAppInstallationId: ""
  # -- The App's private key, PEM (key `code-index-github-app-private-key`).
  codeIndexGithubAppPrivateKey: ""
  # -- Sign in with Google's OAuth client, a Web application client whose
  # redirect URIs are <address>/api/v1/auth/google/callback for every address
  # people open Infrared at: its client ID (key `google-client-id`), with
  # googleClientSecret. The API reads both at use, so a client set or rotated in
  # the Secret later needs no restart.
  googleClientId: ""
  # -- That client's secret (key `google-client-secret`), with googleClientId.
  # Pass it with --set-file.
  googleClientSecret: ""
  # -- `infrared-platform-tokens` when that Secret already exists; the chart then
  # renders none. The name is fixed: the template reads it. With
  # codeIndex.enabled, that Secret holds the code index's five keys too.
  existingSecret: ""

# Gitea's site admin, in the Secret `infrared-gitea-admin` (keys username,
# password and email), when gitea.enabled. The chart generates it once, with a
# random password, and keeps it: on upgrades, on uninstall, and once Argo CD
# adopts the release. Gitea reads the username and password from it and resets
# the admin's password to it at every start; the API reads it
# (INFRARED_GITEA_ADMIN_SECRET) to make an org's bot user. Never printed.
giteaAdmin:
  # -- `infrared-gitea-admin` when that Secret already exists; the chart then
  # renders none, as under Argo CD (the gitops template sets it). The name is fixed.
  existingSecret: ""

# Pod-level defaults shared by every component; each component may override.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -- Extra labels on every resource.
commonLabels: {}

# -- The image the operator runs each AgentWorkflowRun agent step in (infrared-runner,
# the Claude Agent SDK). Steps run as Jobs in the org namespace and need the org's
# Secret model-provider-anthropic (key api-key).
observability:
  # -- Prometheus-compatible query URL the API reads SLO error ratios from, and the operator's
  # release guard reads each zone's error budget from (INFRARED_METRICS_URL, ADR 0046 phase 6).
  # The default is the VictoriaMetrics single node the gitops template installs; empty reports every
  # SLO as no-data and leaves the guard's error budget check off.
  metricsURL: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428"
  # -- Where the API forwards remote-write bodies that arrive at POST /api/v1/telemetry/write
  # (INFRARED_METRICS_WRITE_URL, ADR 0044). Empty: metricsURL plus `/api/v1/write`, the
  # VictoriaMetrics single's own write path. A later ingest elsewhere is a change here alone.
  metricsWriteURL: ""

runner:
  # -- Where agent steps' runner pods run (INFRARED_AGENT_STEP_PLACEMENT, operator, as JSON): a
  # node selector and tolerations, e.g. a node pool of their own away from the nodes Infrared runs
  # on. Each step keeps its own resources. Empty: the scheduler places steps anywhere.
  placement:
    nodeSelector: {}
    tolerations: []
  image:
    # -- Repository under image.registry.
    repository: infrared-runner
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.146
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:bce4b9e127a18df1b585c05eeafe21ec4750d6546408839ed245b65d2f449d53"
  # -- Image an init container copies a Go toolchain and make from, so agents can build
  # and test Go repos: a Go patch release, pinned by digest. Steps build with
  # GOTOOLCHAIN=local, so a repo whose go.mod asks for a newer Go fails to build.
  goToolchainImage: "golang:1.26.10@sha256:24a707af49702fa44f02785475d02fb752f6982d3e9c0afb7696e1f0204e7ce9"
  # -- Image an init container copies helm from, so agents can lint and
  # template a Product's chart. Pinned by digest.
  helmImage: "alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9"
  # -- Image an init container copies golangci-lint from, onto the agents' PATH, so they
  # can lint Go repos: a v2 release built with a Go at least as new as goToolchainImage's.
  # Pinned by digest.
  golangciLintImage: "golangci/golangci-lint:v2.15.0-alpine@sha256:2ba875b990f1d8501ad4ec19be1ea0701e316ec3a4b764f7b129f62f01318bbf"
  networkPolicy:
    # -- Fence runner pods with a NetworkPolicy in each org namespace: DNS and
    # HTTP(S) to the internet only, nothing in the cluster, the VPC or cloud
    # metadata. Turn off only when the cluster's CNI does not enforce NetworkPolicy.
    enabled: true
    # -- Private networks runners may also reach over HTTP(S), e.g. a GitHub
    # Enterprise Server: a list of CIDRs.
    extraEgressCIDRs: []

summaryvideo:
  # -- Provision summary videos of Changes (a narrated scene per step) and product
  # owner announcements: the API's media volume, the operator's pipeline images
  # and the Gemini key's Secret name. Provisioned, they stay off until a platform
  # admin turns them on in Settings, Install features (Installation
  # spec.summaryVideos.enabled), and then each org turns its own on. False: no
  # reconciler, no Job and no media volume, and the API is rolled on upgrade
  # rather than recreated. The pipeline and its clips are in
  # github.com/darkshiftio/infrared-summary-video.
  enabled: true
  image:
    # -- Repository under image.registry: the pipeline and its reusable clips.
    repository: infrared-summaryvideo
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.145
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:47fde16f077c4a6655f4fcbc66d1a3b027102ea222931b1205b39336e0a7349c"
  # -- Runs the pipeline's Node steps with Puppeteer and Chromium. Pinned by digest.
  browserImage: "docker.io/zenika/alpine-chrome@sha256:ee10e24217aa27443e6b58da628f3b09ea9b814459915b8b62fe15a555f9692a"
  # -- Joins the clips and scenes. Pinned by digest.
  ffmpegImage: "docker.io/jrottenberg/ffmpeg@sha256:8ec1ee1f6a0fcd37c97725827b6b7832795c9596e3439b8da56d7700d61ae778"
  # -- Secret in the release namespace with the platform Gemini key (key api-key)
  # that voices the narration. Not created by the chart.
  geminiSecret: gemini-api
  storage:
    # -- The API keeps the videos on this volume.
    size: 5Gi
    # -- Storage class; empty means the cluster's default.
    storageClassName: ""

operator:
  image:
    # -- Repository under image.registry.
    repository: infrared-operator
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.165
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:76d23c7e393346661b6dbf86635fb2b020fd578332af6f018cb783ae2cb297ab"
  replicas: 1
  # -- Extra container args, appended after --leader-elect and the probe address.
  extraArgs: []
  # -- Extra environment variables.
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  rbac:
    # -- Rules appended to the generated operator ClusterRole.
    extraRules: []
  serviceAccount:
    annotations: {}
  service:
    port: 8081
  # -- The manager's metrics endpoint (--metrics-bind-address), served on the Service's port
  # named `metrics`: step attempts, duration, tokens and cost by org, workflow, role and model
  # (ADR 0044). The metrics stack and the telemetry vmagent scrape every port so named.
  metricsPort: 8080
  # -- Serve the manager's metrics over HTTPS with Kubernetes authentication (controller-runtime's default) instead of
  # plain HTTP in the cluster. Off: the metrics stack and the telemetry vmagent scrape the port as they scrape the API's.
  metricsSecure: false
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

api:
  image:
    repository: infrared-api
    tag: v0.1.0-alpha.164
    digest: "sha256:4208afdcd6010405c243707a586a7a42375bcda6cdabf5b1e2870d607e8cc091"
  replicas: 1
  # -- How a new API rolls out. The default starts the new pod beside the old one (on the running
  # pod's node when the media volume is mounted, see summaryvideo) and stops the old one only once
  # the new one is ready, so the edge always has a ready pod: it needs a node with room for a
  # second API. On a shape without that room (three e2-highmem-2, as a hosted control plane's),
  # the new pod waits forever as Pending: set `strategy: {type: Recreate}` there (the rollingUpdate
  # block is dropped from the Deployment), and the old pod
  # stops before the new one starts (a short outage at each upgrade).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # -- Flags (infrared-docs-internal ADR 0058): install-class behaviour declared in infrared-api,
  # with its default in code, and read through GET /v1/flags. Set here, from the install's values
  # file in its gitops repo, they render the ConfigMap infrared-flags, which the API reads every 15
  # seconds: a change rolls nothing. Keys are camelCase, no dots (`signInNotice`); values are a
  # string, a bool or an int, each written as a string. Empty: every flag at its default. A
  # self-hosted install may set any flag, and a flag never opens anything the licence withholds.
  flags: {}
  extraArgs: []
  extraEnv: []
  # The API serves every page's reads: at 50m it waited on CPU up to 23% of the time while builds
  # and agent steps ran beside it (workspace TODO 359).
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      memory: 512Mi
  serviceAccount:
    annotations: {}
  service:
    port: 8080
  # -- The API's own Prometheus metrics (INFRARED_METRICS_ADDR), on a port of their own off the
  # public listener, served on the Service's port named `metrics` (ADR 0044).
  metricsPort: 9090
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # -- The header that carries a caller's address (INFRARED_CLIENT_ADDRESS_HEADER),
  # which the password sign-in's limits count failures by: for example
  # CF-Connecting-IP, where every request from outside comes through Cloudflare.
  # Empty: the first X-Forwarded-For address. A caller can send any header, so
  # name one only when the proxy in front sets it on every request.
  clientAddressHeader: ""
  # Workspace groups as roles (ADR 0042): a team may name a Google Workspace
  # group whose people hold its role when they sign in with Google, and the API
  # reads those groups from Google's directory.
  directory:
    # -- The Google service account the API impersonates to read the groups
    # (INFRARED_DIRECTORY_SERVICE_ACCOUNT), from its own Workload Identity, with
    # no key: <name>@<project>.iam.gserviceaccount.com, holding the Workspace
    # role Groups Reader. Empty: the directory is off, and no Workspace group
    # gives a role.
    serviceAccount: ""
    # -- The Google API that reads them (INFRARED_DIRECTORY_API): `admin`, the
    # Admin SDK Directory API, which also tells a suspended person, who then
    # holds nothing; or `cloud-identity`, the Cloud Identity API, which cannot.
    # `admin` needs admin.googleapis.com enabled in the service account's project.
    api: admin
    # -- How often the groups are read, a Go duration (INFRARED_DIRECTORY_INTERVAL):
    # a person taken out of a group loses its role within about this long.
    interval: 2m
    # -- How long a group's last good read counts (INFRARED_DIRECTORY_MAX_AGE):
    # older, the group gives no role until it is read again. infrared-operator's
    # GitHub team sync keeps its own ten minutes.
    maxAge: 10m

ui:
  image:
    repository: infrared-ui
    tag: v0.1.0-alpha.164
    digest: "sha256:6cc57261c2577a7f8a6b7308a516a5c91d2a3a1582d7ed33c0d2e0e994ee65db"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    annotations: {}
  service:
    # -- Port of the primary Service (named after the release fullname).
    port: 80
    type: ClusterIP
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # -- Extensions: services the org runs that the UI shows in its rail and proxies at
  # /ext/<id>/<path>/, one location per declared path, to signed-in GitHub users only.
  # Anything else under /ext/<id>/ is 404. Empty (the default) leaves the slot off: no
  # ConfigMap, mount or env. `upstream` is an FQDN and port, because nginx's resolver
  # ignores search domains.
  extensions: []
  # - id: back-office
  #   title: Back Office
  #   icon: book            # puzzle (default), book, wallet, receipt, users, key, landmark, scroll
  #   upstream: back-office.back-office.svc.cluster.local:8080
  #   paths: [v1, ui]       # optional, default [v1, ui]
  #   entry: ""             # optional, default /ext/<id>/ui/entry.js
  extensionsProxySecret:
    # -- Name of an existing Secret whose value the UI sends to every extension upstream as
    # X-Infrared-Proxy-Secret (INFRARED_EXT_PROXY_SECRET; 32 or more of A-Z a-z 0-9 _ -).
    # Required when `extensions` is not empty.
    existingSecret: ""
    # -- Key in that Secret.
    key: secret

mcp:
  # -- Token the MCP server presents to the API (Secret `<fullname>-mcp-token`, key `token`). Empty generates one.
  token: ""
  # -- Name of an existing Secret with key `token`; when set, the chart renders neither
  # the MCP token Secret nor `infrared-api-tokens` (both must already exist).
  existingSecret: ""
  access:
    # -- Bearer token clients must send to /mcp (Secret `<fullname>-mcp-access`, key `token`). Empty generates one.
    # Without it the MCP endpoint would answer anyone who can reach the UI.
    token: ""
    # -- Name of an existing Secret with key `token`; when set, the chart renders no access Secret.
    existingSecret: ""
  image:
    repository: infrared-mcp
    tag: v0.1.0-alpha.146
    digest: "sha256:7d1331bbd581352cecd698f8ae37544234e35f0ed86cb53c710375cf5e79a65e"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    annotations: {}
  service:
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# Gitea, the forge an install may run for its orgs' repos: the chart's `gitea`
# dependency (gitea chart 12.7.0, Gitea 1.27.3), off by default. Every key below
# but `enabled` and `browserURL` is the gitea chart's own
# (https://gitea.com/gitea/helm-gitea),
# preset for one pod: SQLite on one volume, an in-memory cache, a LevelDB queue,
# no ingress and no SSH, sign-in required and no self-registration, and with
# oidc.enabled sign-in through Infrared (ADR 0053). The operator and the API
# reach it at http://gitea-http.<release namespace>.svc.cluster.local:3000
# (INFRARED_GITEA_URL), and its site admin is the Secret giteaAdmin describes.
gitea:
  # -- Run Gitea in the release namespace, and hand its address to the operator
  # and the API (INFRARED_GITEA_URL) and its admin Secret to the API
  # (INFRARED_GITEA_ADMIN_SECRET).
  enabled: false
  # -- The address browsers open this Gitea at, such as https://git.example.com
  # (INFRARED_GITEA_BROWSER_URL, api). Gitea's ROOT_URL follows it, with a
  # trailing slash, so the links Gitea makes open in a browser; empty keeps
  # ROOT_URL the Service address below, as for a Gitea only the cluster
  # reaches. Set, a platform admin can have Infrared register its own OAuth
  # application on this Gitea, a git connector people link their Gitea accounts
  # with (ADR 0042); with oidc.enabled and installation.previews.signInURL too,
  # Gitea signs people in through Infrared (ADR 0053). Argo CD, kpack, the
  # operator and the API keep reaching Gitea at its Service. Needs `enabled`.
  browserURL: ""
  # -- Fixed: the Deployment is `gitea` and its Service `gitea-http`.
  fullnameOverride: gitea
  replicaCount: 1
  # One pod on a ReadWriteOnce volume: the old pod lets go of it before the new
  # one starts.
  strategy:
    type: Recreate
  image:
    registry: docker.gitea.com
    repository: gitea
    # -- Gitea's version; the chart appends `-rootless`.
    tag: "1.27.3"
    rootless: true
    # -- The image index of docker.gitea.com/gitea:1.27.3-rootless (linux/amd64,
    # arm64 and riscv64), read with crane on 2026-10-02.
    digest: sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
    pullPolicy: IfNotPresent
  service:
    http:
      # A ClusterIP Service, where the gitea chart's default is headless, so
      # Gitea's address does not change when its pod is replaced.
      clusterIP: ""
      port: 3000
  ingress:
    enabled: false
  persistence:
    enabled: true
    # -- StorageClass of Gitea's volume, which holds its database and every
    # repository; empty uses the cluster's default. On Linode,
    # `linode-block-storage-retain` keeps the volume when its claim goes.
    storageClass: ""
    # -- Size of Gitea's volume. Argo CD renders the default once it adopts the
    # release, so a larger size goes in the gitops repo's values file as well.
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # Kept on uninstall, and never pruned or deleted by Argo CD.
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Infrared's sign-in on Gitea (ADR 0053), after the gitea chart's own init
  # containers, so the database is migrated and app.ini written. It registers,
  # or updates, the OAuth2 source "infrared" at Infrared's issuer while the
  # ConfigMap infrared-gitea-sign-in says ENABLED (oidc.enabled,
  # gitea.browserURL and installation.previews.signInURL all set), with the
  # client in the Secret infrared-oidc-gitea that infrared-api writes. It never
  # fails the pod, so Gitea starts whatever Infrared's state is: with sign-in
  # off it ends at once; on, it waits two minutes at most for that Secret and
  # Infrared's discovery, and registers again at the next start if either is
  # missing. Static, as the gitea chart renders it without tpl: its image, env,
  # mounts, securityContext and resources are configure-gitea's, which
  # scripts/verify.sh checks in the same render. An install that sets its own
  # postExtraInitContainers or extraVolumes list replaces this one (Helm
  # replaces lists), and must keep both or neither.
  postExtraInitContainers:
    - name: configure-infrared-sign-in
      image: docker.gitea.com/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      args:
        - |
          # Infrared's sign-in on Gitea (infrared-docs-internal ADR 0053): register,
          # or update, the OAuth2 source "infrared" at Infrared's issuer, with the
          # client in the Secret infrared-oidc-gitea that infrared-api writes. It never
          # fails the pod, so Gitea starts whatever Infrared's state is, and it never
          # prints the client's secret.
          set -uo pipefail
          log() { printf '==== configure-infrared-sign-in: %s\n' "$*"; }
          skip() {
            log "WARNING: $*. Gitea starts without Infrared sign-in; it registers again at the next start."
            exit 0
          }
          if [ "${INFRARED_SIGN_IN:-}" != true ]; then
            log 'Infrared sign-in is off (oidc.enabled, gitea.browserURL and installation.previews.signInURL are not all set): nothing to do.'
            exit 0
          fi
          url="${INFRARED_SIGN_IN_DISCOVERY_URL:-}"
          client=/infrared-oidc-gitea
          [ -n "$url" ] || skip 'the ConfigMap infrared-gitea-sign-in names no discovery URL'
          # The API writes the client's Secret within seconds of its own start, which
          # may come after this pod's, and the kubelet fills the optional volume once
          # the Secret exists. Gitea registers the source only once it has fetched
          # Infrared's discovery. So wait for both, two minutes at most.
          log "waiting up to 120 seconds for the Secret infrared-oidc-gitea and Infrared's discovery at $url"
          deadline=$(( $(date +%s) + 120 ))
          until [ -s "$client/key" ] && [ -s "$client/secret" ] &&
            [ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$url" 2>/dev/null)" = 200 ]; do
            [ "$(date +%s)" -lt "$deadline" ] ||
              skip "the Secret infrared-oidc-gitea or Infrared's discovery at $url was not ready within 120 seconds"
            sleep 5
          done
          key="$(cat "$client/key")"
          secret="$(cat "$client/secret")"
          run() { if command -v timeout >/dev/null 2>&1; then timeout 20 "$@"; else "$@"; fi; }
          # The source's ID, read as the gitea chart's own configure-gitea reads it.
          list="$(run gitea admin auth list --vertical-bars 2>&1)" || skip 'gitea admin auth list failed'
          regex='(.*)(ID[[:space:]]+\|Name[[:space:]]+\|Type[[:space:]]+\|Enabled.*)'
          [[ "$list" =~ $regex ]] || skip "Gitea's list of authentication sources could not be read"
          id="$(echo "${BASH_REMATCH[2]}" | tail -n+2 | grep -E '\|infrared[[:space:]]+\|' | grep -iE '\|OAuth2[[:space:]]+\|' |
            awk '{print $1}')"
          # Platform admins are Gitea's site admins (groups), and Gitea itself refuses anyone
          # without a role in the platform org (infrared_platform_role is absent), as
          # Infrared does at sign-in (ADR 0053 D4).
          args=(--name infrared --provider openidConnect --key "$key" --secret "$secret" --auto-discover-url "$url"
            --group-claim-name groups --admin-group platform-admin --required-claim-name infrared_platform_role
            --scopes openid --scopes email --scopes profile)
          if [ -z "$id" ]; then
            out="$(run gitea admin auth add-oauth "${args[@]}" 2>&1)" && { log 'added the OAuth2 source infrared'; exit 0; }
          else
            out="$(run gitea admin auth update-oauth --id "$id" "${args[@]}" 2>&1)" &&
              { log "updated the OAuth2 source infrared ($id)"; exit 0; }
          fi
          printf '%s\n' "${out//"$secret"/<redacted>}"
          skip 'Gitea refused the OAuth2 source infrared'
      env:
        - name: GITEA_APP_INI
          value: /data/gitea/conf/app.ini
        - name: GITEA_CUSTOM
          value: /data/gitea
        - name: GITEA_WORK_DIR
          value: /data
        - name: GITEA_TEMP
          value: /tmp/gitea
        - name: HOME
          value: /data/gitea/git
        # Whether sign-in is on, and Infrared's discovery: optional, so with the
        # ConfigMap's keys absent the step ends at once.
        - name: INFRARED_SIGN_IN
          valueFrom:
            configMapKeyRef: {name: infrared-gitea-sign-in, key: ENABLED, optional: true}
        - name: INFRARED_SIGN_IN_DISCOVERY_URL
          valueFrom:
            configMapKeyRef: {name: infrared-gitea-sign-in, key: DISCOVERY_URL, optional: true}
      volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: data
          mountPath: /data
        - name: infrared-oidc-gitea
          mountPath: /infrared-oidc-gitea
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits: {}
        requests:
          cpu: 100m
          memory: 128Mi
  # The client's Secret for the step above alone (keys key and secret), which
  # infrared-api writes while Infrared signs people in to Gitea. Optional: the
  # kubelet fills the volume once the Secret exists, so Gitea never waits on it.
  extraVolumes:
    - name: infrared-oidc-gitea
      secret:
        secretName: infrared-oidc-gitea
        optional: true
        # 0440: the pod's group (the gitea chart's fsGroup, 1000) reads it.
        defaultMode: 288
  gitea:
    admin:
      # -- Fixed: the Secret giteaAdmin describes. Gitea reads the admin's
      # username and password from it.
      existingSecret: infrared-gitea-admin
      # -- The admin's username, written to the Secret when the chart generates
      # it. An underscore keeps it apart from every organization and bot name.
      username: gitea_admin
      # Unused while existingSecret is set; the gitea chart's own default is a
      # well-known password.
      password: ""
      # -- The email Gitea creates the admin with, also written to the Secret.
      email: gitea_admin@gitea.local
      # The admin's password is reset to the Secret's at every start.
      passwordMode: keepUpdated
    config:
      server:
        # -- Gitea's own URL: its Service in the release namespace, as
        # INFRARED_GITEA_URL has it, with a trailing slash. Change it with the
        # namespace.
        ROOT_URL: http://gitea-http.infrared.svc.cluster.local:3000/
        DOMAIN: gitea-http.infrared.svc.cluster.local
        # Set here, not left to the gitea chart's defaults, which fill it in
        # only after its Service has rendered with an empty targetPort.
        HTTP_PORT: 3000
        DISABLE_SSH: true
        START_SSH_SERVER: false
        OFFLINE_MODE: true
      database:
        DB_TYPE: sqlite3
      cache:
        ADAPTER: memory
      queue:
        TYPE: level
      service:
        DISABLE_REGISTRATION: true
        REQUIRE_SIGNIN_VIEW: true
        # The API mints the bot's tokens over basic auth.
        ENABLE_BASIC_AUTHENTICATION: true
      cron.update_checker:
        ENABLED: false
    # Settings from the environment, which the gitea chart applies to app.ini
    # after the config above, at every start of the pod. An install that sets
    # its own additionalConfigFromEnvs list replaces this whole list (Helm
    # replaces lists), Infrared's sign-in with it: localred does, with its own
    # ROOT_URL from its ConfigMap localred-gitea.
    additionalConfigFromEnvs:
      # ROOT_URL follows browserURL, with a trailing slash, so the links Gitea
      # makes and its sign-in's callback open in a browser (ADR 0053 D3); with
      # browserURL empty it is the preset above, exactly as before. The gitea
      # chart renders this list through tpl, where .Values are its own values:
      # .Values.browserURL is gitea.browserURL. A change of browserURL changes
      # Gitea's pod, which restarts Gitea.
      - name: GITEA__SERVER__ROOT_URL
        value: '{{ with .Values.browserURL }}{{ trimSuffix "/" . }}/{{ else }}{{ .Values.gitea.config.server.ROOT_URL }}{{ end }}'
      # Infrared's sign-in (ADR 0053), from the ConfigMap infrared-gitea-sign-in,
      # whose keys exist only while it is on: registration through the source
      # infrared alone, the username from the nickname claim, no linking to an
      # existing account, no OpenID 2.0, and sessions of 12 hours with a
      # remember-me cookie of one day. Optional, so with a key absent Gitea keeps
      # its preset. A change of only oidc.enabled, or of the sign-in URL, changes
      # only the ConfigMap: restart Gitea for it to apply.
      - name: GITEA__SERVICE__DISABLE_REGISTRATION
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: service.DISABLE_REGISTRATION, optional: true}
      - name: GITEA__SERVICE__ALLOW_ONLY_EXTERNAL_REGISTRATION
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: service.ALLOW_ONLY_EXTERNAL_REGISTRATION, optional: true}
      - name: GITEA__SERVICE__SHOW_REGISTRATION_BUTTON
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: service.SHOW_REGISTRATION_BUTTON, optional: true}
      - name: GITEA__OAUTH2_CLIENT__ENABLE_AUTO_REGISTRATION
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: oauth2_client.ENABLE_AUTO_REGISTRATION, optional: true}
      - name: GITEA__OAUTH2_CLIENT__USERNAME
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: oauth2_client.USERNAME, optional: true}
      - name: GITEA__OAUTH2_CLIENT__ACCOUNT_LINKING
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: oauth2_client.ACCOUNT_LINKING, optional: true}
      - name: GITEA__OAUTH2_CLIENT__UPDATE_AVATAR
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: oauth2_client.UPDATE_AVATAR, optional: true}
      - name: GITEA__OPENID__ENABLE_OPENID_SIGNIN
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: openid.ENABLE_OPENID_SIGNIN, optional: true}
      - name: GITEA__OPENID__ENABLE_OPENID_SIGNUP
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: openid.ENABLE_OPENID_SIGNUP, optional: true}
      - name: GITEA__SESSION__SESSION_LIFE_TIME
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: session.SESSION_LIFE_TIME, optional: true}
      - name: GITEA__SECURITY__LOGIN_REMEMBER_DAYS
        valueFrom:
          configMapKeyRef: {name: infrared-gitea-sign-in, key: security.LOGIN_REMEMBER_DAYS, optional: true}
  # The gitea chart's databases, caches and test pod: none, with SQLite.
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false
  valkey-cluster:
    enabled: false
  valkey:
    enabled: false
  test:
    enabled: false
