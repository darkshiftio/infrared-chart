# Default values for the infrared chart.
# Every key here is described in values.schema.json and in the README values table.

# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix. With a release named `infrared`
# the prefix is `infrared`, so the UI Service is `svc/infrared`.
fullnameOverride: ""

managementCluster:
  # -- Name of the management cluster this installation runs on (INFRARED_CLUSTER_NAME).
  name: infrared-mgmt

# -- The API's public base URL, ending in /api (e.g. https://infrared.example.com/api), if exposed
# (INFRARED_EXTERNAL_URL). Optional: Infrared works it out from each request.
externalURL: ""

# What the operator writes to the Installation when it starts, so nobody patches
# it after the install. It writes each field only while that field is empty, and
# never overwrites one.
installation:
  # -- The edge the gitops template routes through (INFRARED_EDGE, operator):
  # `traefik`, an Ingress per route as before, or `gateway`, routes on the shared
  # Envoy Gateway. Empty means traefik. Written to the Installation's `spec.edge`.
  edge: ""
  # -- Preview settings (INFRARED_PREVIEWS, operator, as JSON): `domain` and
  # `signInURL`, and optionally `ingressHost`, `ingressIP`, `managedRoots` and
  # `cloudflareTokenSecret`. Written to the Installation's `spec.previews`.
  # Empty leaves previews to a person, as before.
  previews: {}
  #   domain: preview.example.com              # zone z answers at https://<z>.<domain>
  #   signInURL: https://infrared.example.com  # where preview visitors sign in

# -- The control plane's cloud (ADR 0033): "gcp" or "aws"; empty is "gcp". It
# picks the default image registry and chart repository: darkshift's Artifact
# Registry for "gcp" (us-central1-docker.pkg.dev/darkshift-preprod/infrared), its
# ECR for "aws" (977456087177.dkr.ecr.us-east-1.amazonaws.com). Every release is in
# both, by the same digests. image.registry and gitops.chartRepository override it.
# A control plane on AWS also sets registryToken.aws.region, so Argo CD can pull
# the chart and Substrate's images can be copied with an ECR token.
cloud: ""

gitops:
  # -- Version of infrared-gitops-template the API asks the operator to render
  # (INFRARED_GITOPS_TEMPLATE_VERSION): a tag, or a full 40-character commit SHA
  # to install from a branch of the template. Here feat/one-artifact-per-backup's
  # head, which this branch's operator renders; back to a tag before a release.
  templateVersion: 078c75b5f5b07fdb57c824dd0f1742587393e8c3
  # -- The OCI repository of this chart, host and path with no oci://
  # (INFRARED_CHART_REPO, operator): the gitops template's `infrared` Application
  # pulls the chart from it, and the operator registers it with Argo CD, with the
  # pull secret's credential for its registry. Empty: the cloud's, Artifact
  # Registry's `.../infrared/charts` or ECR's `<ecr>/charts`.
  chartRepository: ""

builds:
  # -- Registry prefix product images are built into by kpack, e.g.
  # `123456789012.dkr.ecr.us-east-1.amazonaws.com/acme` (INFRARED_BUILD_REGISTRY).
  # Empty leaves the gitops template's builds component out.
  registry: ""

registry:
  # -- The install's own registry, as builds and nodes reach it: host and port,
  # no scheme, e.g. `10.43.0.50:5000` (Zot, over plain HTTP inside the
  # cluster; INFRARED_REGISTRY, operator and API). The operator keeps a
  # registry user, rule and push credential per organization, builds as each
  # organization's builder, lets steps whose AgentRole may publish push to it,
  # and hands it to the gitops template (its `Registry`). Empty: none of them.
  address: ""
  # Zot's garbage collection and retention (INFRARED_REGISTRY_RETENTION,
  # operator, as JSON, for the gitops template's Zot). Each empty field keeps
  # the template's default, shown with it.
  retention:
    # -- An untagged image goes this long after it was untagged, e.g. `48h`. Empty: `24h`.
    untaggedAfter: ""
    # -- Every tag that matches one of these regular expressions is kept, e.g. `["^v[0-9]"]`. Empty: `["^v[0-9]"]`.
    keepTags: []
    # -- Besides those, each repository keeps its this many newest tags, 1 to 1000. 0: `10`.
    keepNewest: 0
    # -- How often garbage is collected, e.g. `1h`. Empty: `1h`.
    gcInterval: ""
    # -- How long a blob stays after its last use before it may be collected, e.g. `1h`. Empty: `1h`.
    gcDelay: ""

stores:
  # -- Install the platform's stores through the gitops template: one Postgres
  # and one object store in the cluster (INFRARED_STORES, operator). Off leaves
  # them out, as before.
  enabled: false

# The install's backups, written straight to a bucket outside the cluster, one
# encrypted artifact per backup (Installation.spec.backup). The operator seeds
# the Installation's spec.backup from these once, while it is empty
# (INFRARED_BACKUP: the bucket, its endpoint, region and prefix; INFRARED_COPIES:
# the rest; both as JSON), and from then on the setting is Infrared's, changed
# in Settings, Backups. The bucket: all three of bucket, endpoint and region, or
# none; its key comes from platformTokens. Every other field is empty by
# default, which keeps the default beside it. Schedules are UTC; retentions are
# whole days, e.g. 7d.
backup:
  # -- Bucket name. Empty: no backups.
  bucket: ""
  # -- The bucket's S3 endpoint: https:// and a host, e.g. `https://s3.example.com`;
  # `https://storage.googleapis.com` for Google Cloud Storage, which the Jobs
  # reach keyless, as their ServiceAccounts (see `platformTokens.backupAccessKeyId`).
  endpoint: ""
  # -- The region S3 requests are signed for, e.g. `us-east-1`; for Google
  # Cloud Storage the bucket's location, e.g. `us-central1`.
  region: ""
  # -- The path everything is kept under in the bucket, with the bucket only. Empty: managementCluster.name.
  prefix: ""
  # -- A backup, by the operator's CronJob infrared-backup: five cron fields. Empty: `5 * * * *`.
  schedule: ""
  mirror:
    # -- The buckets' mirror to the backup bucket: five cron fields. Empty: `17 * * * *`.
    schedule: ""
  # -- How long each backup, and what the mirror replaced or deleted, is kept. Empty: `7d`.
  retention: ""
  # -- age recipients (public keys, `age1...`) each backup is encrypted to: one
  # or more, and any one of their private keys restores it. Empty (the default)
  # makes no backup, so nothing changes until a person makes the key. Only the
  # public half is ever in values.
  recipients: []
  postgres:
    # -- Barman's WAL archive of the platform's Postgres in the backup bucket,
    # besides the dump in each backup. Off by default.
    archive: false

# Restore at install: this install comes back from one of the backup bucket's
# backups, made by an install of the same name, before anything acts on them.
# Give the install's usual values with restore.enabled, and, with Gitea,
# gitea.replicaCount=0: Gitea starts once its data is back. The age identity
# that opens the backup is the Secret infrared-backup-identity (key identity),
# made with kubectl before helm install, never a value: Helm keeps every value
# in its release record, which outlives the restore. The operator deletes that
# Secret once the restore is complete. Argo CD never renders any of this.
restore:
  # -- Restore this install from the backup bucket (INFRARED_RESTORE, operator
  # and API): the Jobs infrared-restore and, with Gitea, infrared-gitea-restore.
  # Needs stores.enabled and a backup bucket.
  enabled: false
  # -- Restore the newest complete backup at or before this time, RFC 3339 in
  # UTC, e.g. `2026-10-03T05:00:00Z`. Empty, with no point: the newest.
  from: ""
  # -- Restore exactly this backup, by its stamp, e.g. `20261006T010500Z`
  # (what `ir restore --backup-artifact` passes). Not with from.
  point: ""
  # -- The image of the restore Job's Postgres sidecar, which runs pg_restore
  # of each consumer database's dump into the platform's Postgres: the same
  # image the gitops template's Postgres Cluster runs, pinned by digest, so
  # pg_restore and the server share a major. Change it together with the
  # template's `components/postgres/cluster.yaml`.
  postgresImage: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f89a40f4d74aa6e0900917eaf6299b125a6382eb02fd4ee5d46f55bcbf7e5726"

components:
  # -- The gitops template's components the install leaves out, by name, e.g.
  # `[infisical]` (INFRARED_DISABLED_COMPONENTS, operator, as JSON). Empty leaves
  # out none.
  disabled: []

substrate:
  # -- Agent Substrate's test actors, counter-v1 and sandbox-v1, which the gitops
  # template's counter test and fence check run against. sandbox-v1 runs any
  # command it is sent, so they are off by default: with the stores and a
  # registry, where the template can run Substrate, the chart names
  # `substrate-test-actors` among the components the install leaves out
  # (INFRARED_DISABLED_COMPONENTS) unless this is true.
  testActors: false

codeIndex:
  # -- Infrared's code index: Zoekt and the code service, which the gitops
  # template runs in the namespace code-index, reached by infrared-api alone at
  # http://code-index.code-index.svc:8080. Off by default. On, the chart hands
  # its image to the operator among Infrared's own (INFRARED_IMAGES, code-index),
  # and the template runs it; that needs image.registry to name the registry its
  # image is in (ghcr.io/darkshiftio), since the template names the image by it.
  # Its record (knowledge, below) and its credential for private repositories
  # (the GitHub App in platformTokens) go into infrared-platform-tokens at the
  # install, and the template copies them to the namespace code-index: see
  # "The code index".
  enabled: false
  # The code index's record: the knowledge repository it reads its manifest of
  # repositories and its repo cards from. With codeIndex.enabled, the install
  # writes both into infrared-platform-tokens (keys code-index-knowledge-url and
  # code-index-knowledge-ref), which the gitops template copies to the Secret
  # code-index/code-index-settings. Argo CD's render never writes them again, so
  # a later change goes into that Secret, as a token's does.
  knowledge:
    # -- The knowledge repository's URL, https:// or http://, e.g.
    # `https://github.com/darkshiftio/knowledge.git`. Required with
    # codeIndex.enabled wherever the chart renders infrared-platform-tokens.
    url: ""
    # -- The branch, tag or commit the code index reads it at. Empty: `main`.
    ref: ""
  image:
    # -- The image <image.registry>/infrared-codeindex, by tag and digest: a
    # one-install-<short sha> build of darkshiftio/infrared-codeindex, from its
    # publish-image workflow.
    tag: one-install-34162bc
    # -- Its digest, sha256:...; empty pins by the tag alone.
    digest: sha256:ef9dfab51a875f50cc20cbb27e3f551b5b1367a543792a98cb857eb7873fb307

image:
  # -- Registry prefix shared by every component image. Empty: the cloud's
  # default (see `cloud`). Any registry other than the cloud's default is handed
  # to the operator with every component's tag and digest (INFRARED_IMAGE_REGISTRY,
  # INFRARED_IMAGES), so the gitops template writes them into the `infrared`
  # Application and Argo CD keeps them when it adopts the release.
  registry: ""
  # -- Pull policy for every component image.
  pullPolicy: IfNotPresent

# -- Image pull secrets for every pod, e.g. `[{name: ghcr-pull}]`. The first
# name is also handed to the operator (INFRARED_IMAGE_PULL_SECRET) for the
# clusters it bootstraps and for runner Jobs: it copies the Secret into each org
# namespace and sets it on every Job.
imagePullSecrets: []

# The Secret named by imagePullSecrets[0], a kubernetes.io/dockerconfigjson for
# one registry, rendered when a username and password are set. Empty (the
# default) renders none, and that Secret must already exist in the release
# namespace. Pass the password with --set-file so it is never in a values file;
# surrounding whitespace is trimmed. The Secret is kept on uninstall and when the
# values stop carrying the password, as under Argo CD after adoption.
imageCredentials:
  # -- Registry host the credential is for. The operator also reads it for the
  # chart repository on ghcr.io.
  registry: ghcr.io
  # -- Username; required with a password.
  username: ""
  # -- Password or token, e.g. a token that may only read packages; required with a username.
  password: ""

# The registry token, for a private Artifact Registry in Google Cloud on GKE with
# Workload Identity (no key), or for ECR on AWS with an IAM role (IRSA or the
# node's role). The nodes pull the pods' images as their own
# service account; Argo CD's repo-server (the chart) and the copy of Substrate's
# images into the registry inside the cluster pull themselves, with this. With a
# Google service account set, the chart runs the ServiceAccount registry-token
# (annotated iam.gke.io/gcp-service-account), a Job at the install and every
# upgrade, and a CronJob every 30 minutes, which write that account's access
# token to the Secret registry-token: the install's pull secret
# (INFRARED_IMAGE_PULL_SECRET), so imagePullSecrets and imageCredentials stay
# empty. Substrate's images then come from <image.registry>/substrate
# (INFRARED_SUBSTRATE_REGISTRY). See "The registry token".
registryToken:
  # -- The Google service account whose access token is written, e.g.
  # `registry-reader@darkshift-preprod.iam.gserviceaccount.com`. It needs
  # roles/artifactregistry.reader on the repository, and
  # roles/iam.workloadIdentityUser for `<project>.svc.id.goog[<namespace>/registry-token]`.
  # Empty (the default): no registry token.
  gcpServiceAccount: ""
  # AWS: ECR's token (12 hours) as an IAM role, written the same way; set one of
  # gcpServiceAccount and aws.region. The role needs ecr:GetAuthorizationToken
  # and read on the repositories.
  aws:
    # -- The ECR region, e.g. `us-east-1`. Empty (the default): no ECR token.
    region: ""
    # -- An IAM role for IRSA on EKS, `arn:aws:iam::<account>:role/<name>`, which
    # the ServiceAccount registry-token is annotated with. Empty: the node's role.
    roleArn: ""
    # -- Run the Job on the host's network, for EC2 nodes (such as k3s) whose
    # instance metadata answers only one hop, so a pod reaches the node's role.
    # Handed to the operator, so adoption keeps it.
    hostNetwork: false
  # -- The registry host the token is for. Empty: the image registry's host, e.g.
  # `us-central1-docker.pkg.dev`. The images and gitops.chartRepository must be on it.
  registry: ""
  # -- The Job's image: curl, jq, kubectl and the AWS CLI. alpine/k8s 1.37.0, by digest, as the gitops template's jobs.
  image: "docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4"

# The install's own identity for the cloud accounts orgs add to Infrared
# (CloudAccount, infrared-docs-internal ADR 0033): the ServiceAccount
# infrared-cloud, which the chart always makes and the operator's check Jobs
# run as, is the only identity that reaches an org's cloud. Nothing set: no
# identity, and every cloud account fails its check. Handed to the operator and
# the API as INFRARED_CLOUD_IDENTITY.
cloudIdentity:
  # -- The install's Google service account, bound to infrared-cloud by Workload
  # Identity on GKE: roles/iam.workloadIdentityUser for
  # `<project>.svc.id.goog[<namespace>/infrared-cloud]`. An org grants it
  # roles/iam.serviceAccountTokenCreator on its own service account. Empty: no
  # Google Cloud accounts.
  gcpServiceAccount: ""
  # Where infrared-cloud's AWS credentials come from: at most one of the three.
  # None set: no AWS accounts.
  aws:
    # -- An IAM role for IRSA on EKS, `arn:aws:iam::<account>:role/<name>`, which
    # infrared-cloud is annotated with; it assumes an org's role.
    roleARN: ""
    # -- The node's role through instance metadata, for EC2 nodes (such as k3s)
    # whose metadata answers only one hop: the check Jobs run on the host's network.
    hostNetwork: false
    # -- The cluster's own projected token (audience sts.amazonaws.com), for a
    # control plane outside AWS: an org's role trusts the cluster's OIDC issuer.
    webIdentity: false

# The org registries' credentials (Registry, infrared-docs-internal ADR 0033 phase
# 3): the operator's credential Jobs, as infrared-cloud, write each registry's
# short-lived token into this namespace, which only they may write to (create and
# update on Secrets, nothing else) and only the operator reads; the operator copies
# it to the builds and zone namespaces. Handed to the operator as
# INFRARED_REGISTRY_CREDENTIALS_NAMESPACE.
registryCredentials:
  # -- The namespace the chart makes for them.
  namespace: infrared-registry-credentials

# Generated Secrets. On a plain `helm install`/`helm upgrade` each Secret is
# generated once and kept across upgrades (looked up with `lookup`). Under
# Argo CD `lookup` returns nothing, so once Argo CD adopts the release the
# gitops values must set every `existingSecret` below, or the Secrets would be
# regenerated on every render. The names the API reads are fixed.
setup:
  # -- One-time setup token (Secret `infrared-setup`, key `token`). Empty generates 32 random characters.
  token: ""
  # -- Name of an existing Secret with key `token`; when set, the chart renders no setup Secret.
  existingSecret: ""
session:
  # -- Session signing key (Secret `infrared-session`, key `key`). Empty generates 64 random characters.
  key: ""
  # -- Name of an existing Secret with key `key`; when set, the chart renders no session Secret.
  existingSecret: ""

# Tokens the platform's own components use, kept in one Secret,
# `infrared-platform-tokens`, in the release namespace. The gitops template's
# External Secrets component reads it through the ClusterSecretStore
# `infrared-platform` and copies each token to the namespace that uses it. The
# Secret is rendered when a token is set, or with codeIndex.enabled the code
# index's record, which it then holds as well. Pass each token with --set-file
# so it is never in a values file; surrounding whitespace is trimmed. It is kept
# on uninstall and when the values stop carrying the token, as under Argo CD
# after adoption.
platformTokens:
  # -- Cloudflare API token (key `cloudflare-api-token`), for the edge's DNS
  # records and origin certificates.
  cloudflareApiToken: ""
  # -- Access key ID of the backup bucket's key (key `backup-access-key-id`);
  # required with the secret access key. Not with Google Cloud Storage
  # (`backup.endpoint` `https://storage.googleapis.com`), which takes no key:
  # the ServiceAccounts infrared-backup, infrared-restore, infrared-gitea-restore,
  # the operator's and the API's are granted the bucket's role outside Infrared,
  # and the chart refuses a key given with it. Pass the pair at install only: once
  # Infrared runs, Settings → Backups writes a new key into these same two
  # keys, and a later helm upgrade that passes them again overwrites that key
  # with this one.
  backupAccessKeyId: ""
  # -- Secret access key of the backup bucket's key (key `backup-secret-access-key`);
  # required with the access key ID.
  backupSecretAccessKey: ""
  # -- The code index's GitHub App, which it mints read-only installation tokens
  # from to read private repositories: the App's ID (key
  # `code-index-github-app-id`), a number. All three or none, and only with
  # codeIndex.enabled; with none the code index reads public repositories only,
  # and the three keys are written empty.
  codeIndexGithubAppId: ""
  # -- The ID of the App's installation (key
  # `code-index-github-app-installation-id`), a number.
  codeIndexGithubAppInstallationId: ""
  # -- The App's private key, PEM (key `code-index-github-app-private-key`).
  codeIndexGithubAppPrivateKey: ""
  # -- `infrared-platform-tokens` when that Secret already exists; the chart then
  # renders none. The name is fixed: the template reads it. With
  # codeIndex.enabled, that Secret holds the code index's five keys too.
  existingSecret: ""

# Gitea's site admin, in the Secret `infrared-gitea-admin` (keys username,
# password and email), when gitea.enabled. The chart generates it once, with a
# random password, and keeps it: on upgrades, on uninstall, and once Argo CD
# adopts the release. Gitea reads the username and password from it and resets
# the admin's password to it at every start; the API reads it
# (INFRARED_GITEA_ADMIN_SECRET) to make an org's bot user. Never printed.
giteaAdmin:
  # -- `infrared-gitea-admin` when that Secret already exists; the chart then
  # renders none, as under Argo CD (the gitops template sets it). The name is fixed.
  existingSecret: ""

# Pod-level defaults shared by every component; each component may override.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -- Extra labels on every resource.
commonLabels: {}

# -- The image the operator runs each AgentWorkflowRun agent step in (infrared-runner,
# the Claude Agent SDK). Steps run as Jobs in the org namespace and need the org's
# Secret model-provider-anthropic (key api-key).
observability:
  # -- Prometheus-compatible query URL the API reads SLO error ratios from (INFRARED_METRICS_URL).
  # The default is the VictoriaMetrics single node the gitops template installs; empty reports every SLO as no-data.
  metricsURL: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428"

runner:
  image:
    # -- Repository under image.registry.
    repository: infrared-runner
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.146
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:bce4b9e127a18df1b585c05eeafe21ec4750d6546408839ed245b65d2f449d53"
  # -- Image an init container copies a Go toolchain from, so agents can build and
  # test Go repos. Pinned by digest.
  goToolchainImage: "golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9"
  # -- Image an init container copies helm from, so agents can lint and
  # template a Product's chart. Pinned by digest.
  helmImage: "alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9"
  networkPolicy:
    # -- Fence runner pods with a NetworkPolicy in each org namespace: DNS and
    # HTTP(S) to the internet only, nothing in the cluster, the VPC or cloud
    # metadata. Turn off only when the cluster's CNI does not enforce NetworkPolicy.
    enabled: true
    # -- Private networks runners may also reach over HTTP(S), e.g. a GitHub
    # Enterprise Server: a list of CIDRs.
    extraEgressCIDRs: []

summaryvideo:
  # -- Make a short summary video of each Change that finishes or stops, in orgs
  # that turn summary videos on (Settings): a presenter, a narrated scene per step.
  # Off: no reconciler, no Job and no media volume. The pipeline and its clips are
  # in github.com/darkshiftio/infrared-summary-video.
  enabled: false
  image:
    # -- Repository under image.registry: the pipeline and its reusable clips.
    repository: infrared-summaryvideo
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.145
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:47fde16f077c4a6655f4fcbc66d1a3b027102ea222931b1205b39336e0a7349c"
  # -- Runs the pipeline's Node steps with Puppeteer and Chromium. Pinned by digest.
  browserImage: "docker.io/zenika/alpine-chrome@sha256:ee10e24217aa27443e6b58da628f3b09ea9b814459915b8b62fe15a555f9692a"
  # -- Joins the clips and scenes. Pinned by digest.
  ffmpegImage: "docker.io/jrottenberg/ffmpeg@sha256:8ec1ee1f6a0fcd37c97725827b6b7832795c9596e3439b8da56d7700d61ae778"
  # -- Secret in the release namespace with the platform Gemini key (key api-key)
  # that voices the narration. Not created by the chart.
  geminiSecret: gemini-api
  storage:
    # -- The API keeps the videos on this volume.
    size: 5Gi
    # -- Storage class; empty means the cluster's default.
    storageClassName: ""

operator:
  image:
    # -- Repository under image.registry.
    repository: infrared-operator
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.151
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:8c7facace43e659baa429856461f2b31e6495f34238f5fe0ddf8160f10d3aaf9"
  replicas: 1
  # -- Extra container args, appended after --leader-elect and the probe address.
  extraArgs: []
  # -- Extra environment variables.
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  rbac:
    # -- Rules appended to the generated operator ClusterRole.
    extraRules: []
  serviceAccount:
    annotations: {}
  service:
    port: 8081
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

api:
  image:
    repository: infrared-api
    tag: v0.1.0-alpha.150
    digest: "sha256:a4edaf08b6c544a6f9938caa059688ebb7b0da5f71c8a6781548cd18f724aa29"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  serviceAccount:
    annotations: {}
  service:
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ui:
  image:
    repository: infrared-ui
    tag: v0.1.0-alpha.150
