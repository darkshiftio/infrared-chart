# Default values for the infrared chart.
# Every key here is described in values.schema.json and in the README values table.

# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix. With a release named `infrared`
# the prefix is `infrared`, so the UI Service is `svc/infrared`.
fullnameOverride: ""

managementCluster:
  # -- Name of the management cluster this installation runs on (INFRARED_CLUSTER_NAME).
  name: infrared-mgmt

# -- Public URL of the UI/API, if it is exposed (INFRARED_EXTERNAL_URL). Optional.
externalURL: ""

gitops:
  # -- Version (git tag) of infrared-gitops-template the API asks the operator to render.
  templateVersion: v0.1.10

builds:
  # -- Registry prefix product images are built into by kpack, e.g.
  # `123456789012.dkr.ecr.us-east-1.amazonaws.com/acme` (INFRARED_BUILD_REGISTRY).
  # Empty leaves the gitops template's builds component out.
  registry: ""

image:
  # -- Registry prefix shared by every component image.
  registry: 977456087177.dkr.ecr.us-east-1.amazonaws.com
  # -- Pull policy for every component image.
  pullPolicy: IfNotPresent

# -- Image pull secrets for every pod, e.g. `[{name: ghcr-pull}]`. The first
# name is also handed to the operator (INFRARED_IMAGE_PULL_SECRET) for the
# clusters it bootstraps.
imagePullSecrets: []

# Generated Secrets. On a plain `helm install`/`helm upgrade` each Secret is
# generated once and kept across upgrades (looked up with `lookup`). Under
# Argo CD `lookup` returns nothing, so once Argo CD adopts the release the
# gitops values must set every `existingSecret` below, or the Secrets would be
# regenerated on every render. The names the API reads are fixed.
setup:
  # -- One-time setup token (Secret `infrared-setup`, key `token`). Empty generates 32 random characters.
  token: ""
  # -- Name of an existing Secret with key `token`; when set, the chart renders no setup Secret.
  existingSecret: ""
session:
  # -- Session signing key (Secret `infrared-session`, key `key`). Empty generates 64 random characters.
  key: ""
  # -- Name of an existing Secret with key `key`; when set, the chart renders no session Secret.
  existingSecret: ""

# Pod-level defaults shared by every component; each component may override.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -- Extra labels on every resource.
commonLabels: {}

# -- The image the operator runs each AgentWorkflowRun agent step in (infrared-runner,
# the Claude Agent SDK). Steps run as Jobs in the org namespace and need the org's
# Secret model-provider-anthropic (key api-key).
observability:
  # -- Prometheus-compatible query URL the API reads SLO error ratios from (INFRARED_METRICS_URL).
  # The default is the VictoriaMetrics single node the gitops template installs; empty reports every SLO as no-data.
  metricsURL: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428"

runner:
  image:
    # -- Repository under image.registry.
    repository: infrared-runner
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.62
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:fb2f60e1262224df39af122727f4b5958d7f676fcd0b03aac5bee007fb5d548c"
  # -- Image an init container copies a Go toolchain from, so agents can build and
  # test Go repos. Pinned by digest.
  goToolchainImage: "golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9"
  # -- Image an init container copies helm from, so agents can lint and
  # template a Product's chart. Pinned by digest.
  helmImage: "alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9"
  networkPolicy:
    # -- Fence runner pods with a NetworkPolicy in each org namespace: DNS and
    # HTTP(S) to the internet only, nothing in the cluster, the VPC or cloud
    # metadata. Turn off only when the cluster's CNI does not enforce NetworkPolicy.
    enabled: true
    # -- Private networks runners may also reach over HTTP(S), e.g. a GitHub
    # Enterprise Server: a list of CIDRs.
    extraEgressCIDRs: []

operator:
  image:
    # -- Repository under image.registry.
    repository: infrared-operator
    # -- Tag; empty means the chart appVersion.
    tag: v0.1.0-alpha.61
    # -- Digest (sha256:...); when set the image renders as repo:tag@digest.
    digest: "sha256:6587e4f7e983fab449dcfb987bd4d2ff372fac8097fd470fcf9fdcee678def50"
  replicas: 1
  # -- Extra container args, appended after --leader-elect and the probe address.
  extraArgs: []
  # -- Extra environment variables.
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  rbac:
    # -- Rules appended to the generated operator ClusterRole.
    extraRules: []
  serviceAccount:
    annotations: {}
  service:
    port: 8081
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

api:
  image:
    repository: infrared-api
    tag: v0.1.0-alpha.59
    digest: "sha256:f203e6159b063fc5a7ef3dc6960f2e00b0b3d4bcd1fce1b104bc8da69e9c1b1a"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  serviceAccount:
    annotations: {}
  service:
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ui:
  image:
    repository: infrared-ui
    tag: v0.1.0-alpha.61
    digest: "sha256:b72612861ac12fda31c92aeeb179119d24849cf6be50a56ec9ec5d89e684c50a"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    annotations: {}
  service:
    # -- Port of the primary Service (named after the release fullname).
    port: 80
    type: ClusterIP
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

mcp:
  # -- Token the MCP server presents to the API (Secret `<fullname>-mcp-token`, key `token`). Empty generates one.
  token: ""
  # -- Name of an existing Secret with key `token`; when set, the chart renders neither
  # the MCP token Secret nor `infrared-api-tokens` (both must already exist).
  existingSecret: ""
  access:
    # -- Bearer token clients must send to /mcp (Secret `<fullname>-mcp-access`, key `token`). Empty generates one.
    # Without it the MCP endpoint would answer anyone who can reach the UI.
    token: ""
    # -- Name of an existing Secret with key `token`; when set, the chart renders no access Secret.
    existingSecret: ""
  image:
    repository: infrared-mcp
    tag: v0.1.0-alpha.25
    digest: "sha256:868bd8c2c04da7e20bcea77fb1b975d29c3d3d8a2c335f2bedea201e61f714bd"
  replicas: 1
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    annotations: {}
  service:
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
